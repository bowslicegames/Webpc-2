<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no"

>

<title>Browser x86-64 Linux VM</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#bar {
    height: 50px;
    width: 100%;
    box-sizing: border-box;

    display: flex;
    align-items: center;

    padding: 0 10px;

    background: #181818;
    border-bottom: 1px solid #333;
}

#status {
    flex: 1;
    font-size: 14px;
}

#start {
    border: 0;
    border-radius: 7px;

    padding: 8px 14px;

    background: #2878e8;
    color: white;

    font-size: 14px;
}

#start:disabled {
    opacity: 0.5;
}

#terminal {
    position: absolute;

    left: 0;
    right: 0;

    top: 50px;
    bottom: 0;

    padding: 8px;

    box-sizing: border-box;

    background: #000;

    overflow: hidden;
}

#error {
    display: none;

    position: absolute;

    z-index: 100;

    left: 10px;
    right: 10px;
    top: 60px;

    padding: 14px;

    background: #351313;
    border: 1px solid #a44;
    border-radius: 8px;

    color: #fff;

    font-family: monospace;
    font-size: 13px;

    white-space: pre-wrap;

    max-height: 70vh;
    overflow: auto;
}

</style>

</head>

<body>

<div id="bar">

```
<div id="status">
    Checking browser...
</div>

<button id="start">
    Start VM
</button>
```

</div>

<div id="error"></div>

<div id="terminal"></div>

<script type="module">

/*
============================================================
QEMU-WASM x86-64
============================================================

This version follows the upstream ktock/qemu-wasm-demo
terminal initialization.

Important:

The previous version incorrectly tried to connect xterm-pty
using master.onData().

The upstream demo instead does:

    const { master, slave } = openpty();

    xterm.loadAddon(master);

    Module.pty = slave;

That is what this version uses.
*/


/*
------------------------------------------------------------
REAL PUBLIC ASSET LOCATION
------------------------------------------------------------

These files are from:

ktock/qemu-wasm-demo-images

The previous version incorrectly used:

ktock.github.io/qemu-wasm-demo-images

which does not contain these files.

jsDelivr serves the actual GitHub repository.
*/

const ASSET_BASE =
    "https://cdn.jsdelivr.net/gh/ktock/qemu-wasm-demo-images@main/alpine-x86_64/";


const statusElement =
    document.getElementById("status");

const errorElement =
    document.getElementById("error");

const startButton =
    document.getElementById("start");


function setStatus(message) {

    statusElement.textContent = message;

}


function fail(error) {

    console.error(error);

    errorElement.style.display = "block";

    let message;

    if (error instanceof Error) {

        message =
            error.stack ||
            error.message;

    } else {

        message =
            String(error);

    }

    errorElement.textContent =
        "VM failed to start:\n\n" +
        message;

    startButton.disabled = false;

}


/*
------------------------------------------------------------
Browser compatibility
------------------------------------------------------------
*/

function checkBrowser() {

    if (!window.WebAssembly) {

        throw new Error(
            "WebAssembly is not supported."
        );

    }


    if (!window.SharedArrayBuffer) {

        throw new Error(
            "SharedArrayBuffer is unavailable.\n\n" +

            "Cloudflare Pages must send:\n\n" +

            "Cross-Origin-Opener-Policy: same-origin\n" +

            "Cross-Origin-Embedder-Policy: require-corp"
        );

    }


    if (!window.crossOriginIsolated) {

        throw new Error(
            "The page is not cross-origin isolated.\n\n" +

            "Check your Cloudflare Pages _headers file."
        );

    }

}


/*
------------------------------------------------------------
Load a normal script
------------------------------------------------------------
*/

function loadScript(url) {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement("script");

            script.src = url;

            script.onload =
                () => resolve();

            script.onerror =
                () => reject(
                    new Error(
                        "Failed to load:\n\n" +
                        url
                    )
                );

            document.head.appendChild(script);

        }
    );

}


/*
------------------------------------------------------------
Start VM
------------------------------------------------------------
*/

async function startVM() {

    startButton.disabled = true;

    errorElement.style.display = "none";


    try {

        checkBrowser();


        /*
        ----------------------------------------------------
        xterm.js
        ----------------------------------------------------
        */

        setStatus(
            "Loading terminal..."
        );

        await import(
            "https://unpkg.com/xterm@5.3.0/lib/xterm.js"
        );


        /*
        ----------------------------------------------------
        xterm-pty
        ----------------------------------------------------
        */

        setStatus(
            "Loading virtual terminal..."
        );

        await import(
            "https://unpkg.com/xterm-pty/index.js"
        );


        /*
        ----------------------------------------------------
        Create terminal
        ----------------------------------------------------
        */

        const xterm =
            new Terminal({

                cursorBlink: true,

                fontSize: 14,

                convertEol: true,

                scrollback: 2000,

                theme: {

                    background: "#000000",

                    foreground: "#ffffff"

                }

            });


        xterm.open(
            document.getElementById(
                "terminal"
            )
        );


        /*
        ----------------------------------------------------
        Create PTY
        ----------------------------------------------------

        This is the important correction.

        It follows the upstream QEMU-Wasm demo.
        */

        const {
            master,
            slave
        } = openpty();


        /*
        Connect the PTY master to xterm.

        NOT:

            master.onData(...)

        The upstream demo uses loadAddon().
        */

        xterm.loadAddon(master);


        /*
        ----------------------------------------------------
        Create Emscripten Module
        ----------------------------------------------------
        */

        window.Module =
            window.Module || {};


        Module.pty = slave;


        /*
        ----------------------------------------------------
        QEMU command line
        ----------------------------------------------------

        This is based directly on the upstream
        alpine-x86_64-module.js.

        Networking is deliberately disabled for the
        first boot test.
        */

        Module.arguments = [

            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=browser",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test",

            "-virtfs",
            "local,path=/.wasmenv," +
            "mount_tag=wasm0," +
            "security_model=passthrough," +
            "id=wasm0"

        ];


        /*
        ----------------------------------------------------
        Emscripten file lookup
        ----------------------------------------------------

        QEMU asks for its .wasm and worker files.

        Point those requests at the real public asset
        directory.
        */

        Module.locateFile =
            function(path, prefix) {

                return ASSET_BASE + path;

            };


        Module.mainScriptUrlOrBlob =
            ASSET_BASE + "out.js";


        /*
        ----------------------------------------------------
        Load packaged Linux files
        ----------------------------------------------------
        */

        setStatus(
            "Loading Linux root filesystem..."
        );

        await loadScript(
            ASSET_BASE +
            "load-rootfs.js"
        );


        setStatus(
            "Loading Linux kernel..."
        );

        await loadScript(
            ASSET_BASE +
            "load-kernel.js"
        );


        setStatus(
            "Loading Linux initramfs..."
        );

        await loadScript(
            ASSET_BASE +
            "load-initramfs.js"
        );


        setStatus(
            "Loading BIOS..."
        );

        await loadScript(
            ASSET_BASE +
            "load-rom.js"
        );


        /*
        ----------------------------------------------------
        Load QEMU
        ----------------------------------------------------
        */

        setStatus(
            "Loading x86-64 QEMU..."
        );


        /*
        IMPORTANT:

        out.js exports the Emscripten module as a
        JavaScript module in the upstream demo.

        Therefore we IMPORT it rather than adding it
        as an ordinary <script>.
        */

        const qemu =
            await import(
                ASSET_BASE + "out.js"
            );


        /*
        ----------------------------------------------------
        Start QEMU
        ----------------------------------------------------
        */

        setStatus(
            "Starting x86-64 Linux..."
        );


        let initEmscriptenModule;


        if (
            qemu.default &&
            typeof qemu.default === "function"
        ) {

            initEmscriptenModule =
                qemu.default;

        } else if (
            typeof qemu === "function"
        ) {

            initEmscriptenModule =
                qemu;

        } else {

            throw new Error(
                "QEMU runtime loaded, but its " +
                "Emscripten module could not be found."
            );

        }


        /*
        Start the actual QEMU-Wasm process.
        */

        await initEmscriptenModule(
            Module
        );


        /*
        ----------------------------------------------------
        Terminal polling fix
        ----------------------------------------------------
        */

        if (
            Module.TTY &&
            Module.TTY.stream_ops &&
            Module.TTY.stream_ops.poll &&
            Module.pty
        ) {

            const oldPoll =
                Module.TTY.stream_ops.poll;

            const pty =
                Module.pty;


            Module.TTY.stream_ops.poll =
                function(
                    stream,
                    timeout
                ) {

                    if (!pty.readable) {

                        return (
                            (pty.readable ? 1 : 0) |
                            (pty.writable ? 4 : 0)
                        );

                    }

                    return oldPoll.call(
                        this,
                        stream,
                        timeout
                    );

                };

        }


        setStatus(
            "x86-64 Linux is running."
        );


    } catch (error) {

        fail(error);

    }

}


/*
------------------------------------------------------------
Start button
------------------------------------------------------------
*/

startButton.addEventListener(
    "click",
    startVM
);


/*
------------------------------------------------------------
Initial browser check
------------------------------------------------------------
*/

try {

    checkBrowser();

    setStatus(
        "Browser requirements passed."
    );

} catch (error) {

    fail(error);

}

</script>

</body>
</html>
