
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
/>

<title>WebPC 2 — Alpine Linux x86-64</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #eee;
    font-family: monospace;
  }

  #app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #topbar {
    height: 48px;
    flex: 0 0 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    background: #111;
    border-bottom: 1px solid #333;
    font-family: system-ui, sans-serif;
  }

  #title {
    font-weight: 700;
    white-space: nowrap;
  }

  #status {
    font-size: 13px;
    color: #aaa;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #terminalWrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    overflow: hidden;
  }

  #terminal {
    position: absolute;
    inset: 0;
    padding: 10px;
    overflow-y: auto;
    overflow-x: hidden;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.25;
    -webkit-user-select: text;
    user-select: text;
  }

  #input {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    height: 42px;
    border: 1px solid #555;
    border-radius: 7px;
    background: #111;
    color: #fff;
    outline: none;
    padding: 0 12px;
    font: 14px monospace;
  }

  #input:focus {
    border-color: #aaa;
  }

  #controls {
    height: 50px;
    flex: 0 0 50px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: #111;
    border-top: 1px solid #333;
  }

  button {
    height: 36px;
    padding: 0 14px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #222;
    color: #fff;
    font-weight: 600;
  }

  button:active {
    background: #444;
  }

  #boot {
    display: none;
  }

  #error {
    color: #ff7777;
    white-space: pre-wrap;
  }

  .muted {
    color: #777;
  }

  .ok {
    color: #8f8;
  }
</style>
</head>

<body>

<div id="app">

  <div id="topbar">
    <div id="title">WebPC 2</div>
    <div id="status">Starting Alpine Linux x86-64…</div>
  </div>

  <div id="terminalWrap">
    <div id="terminal"></div>

    <input
      id="input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Type Linux commands here…"
    />
  </div>

  <div id="controls">
    <button id="boot">Boot</button>
    <button id="ctrlc">Ctrl+C</button>
    <button id="clear">Clear</button>
  </div>

</div>

<script type="module">

/*
===========================================================
 WebPC 2
 Alpine Linux x86-64
===========================================================

 This page deliberately does NOT attempt Minecraft.

 The QEMU binary and Alpine image come from:

 https://github.com/bowslicegames/Webpc-2/releases/tag/V1

===========================================================
*/

const RELEASE =
  "https://github.com/bowslicegames/Webpc-2/releases/download/V1/";

const FILES = {
  out:
    RELEASE + "out.js",

  wasm:
    RELEASE + "qemu-system-x86_64.wasm",

  worker:
    RELEASE + "qemu-system-x86_64.worker.js",

  stack:
    RELEASE + "stack.js",

  stackWorker:
    RELEASE + "stack-worker.js",

  rom:
    RELEASE + "load-rom.js",

  kernel:
    RELEASE + "load-kernel.js",

  initramfs:
    RELEASE + "load-initramfs.js",

  rootfs:
    RELEASE + "load-rootfs.js"
};

const terminal =
  document.getElementById("terminal");

const input =
  document.getElementById("input");

const status =
  document.getElementById("status");

const ctrlC =
  document.getElementById("ctrlc");

const clearButton =
  document.getElementById("clear");

let booted = false;
let slave = null;
let master = null;
let qemuModule = null;


/*
-----------------------------------------------------------
 Terminal rendering
-----------------------------------------------------------
*/

function scrollBottom() {
  terminal.scrollTop = terminal.scrollHeight;
}

function print(text) {

  if (text === undefined || text === null)
    return;

  terminal.appendChild(
    document.createTextNode(String(text))
  );

  scrollBottom();
}

function printLine(text = "") {
  print(text + "\n");
}

function setStatus(text) {
  status.textContent = text;
}


/*
-----------------------------------------------------------
 Minimal ANSI handling
-----------------------------------------------------------

 Alpine/QEMU will produce ANSI escape sequences.

 We don't need a complete terminal emulator for the first
 boot test. We remove the most common cursor/control
 sequences while preserving readable Linux output.
-----------------------------------------------------------
*/

function cleanANSI(text) {

  return String(text)
    .replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, "")
    .replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g, "")
    .replace(/\x1b[()][0-2]/g, "")
    .replace(/\x1b[@-_]/g, "");
}


/*
-----------------------------------------------------------
 Try to connect to the PTY without xterm.js.

 IMPORTANT:
 The QEMU build contains the xterm-pty Emscripten
 integration. We therefore still provide the PTY object
 expected by QEMU, but we don't load the visual xterm
 library.
-----------------------------------------------------------
*/

function createBasicPTY() {

  /*
   * This is intentionally a small PTY bridge.
   *
   * The QEMU build's Module.pty is supplied below.
   *
   * If the generated build requires the full xterm-pty
   * JavaScript object, the diagnostic output will tell us
   * exactly that rather than silently pretending that Linux
   * booted.
   */

  const readableCallbacks = [];

  const inputQueue = [];

  const pty = {

    cols: 100,
    rows: 30,

    write(data) {
      print(cleanANSI(data));
    },

    onReadable(callback) {
      readableCallbacks.push(callback);
    },

    read() {
      const data = inputQueue.splice(
        0,
        inputQueue.length
      );

      return data;
    },

    pushInput(data) {

      for (const byte of
        new TextEncoder().encode(data)) {

        inputQueue.push(byte);
      }

      for (const callback of readableCallbacks) {

        try {
          callback();
        } catch (e) {
          console.error(e);
        }

      }
    },

    resize(cols, rows) {
      this.cols = cols;
      this.rows = rows;
    }
  };

  return pty;
}


/*
-----------------------------------------------------------
 Keyboard input
-----------------------------------------------------------
*/

input.addEventListener("keydown", event => {

  if (!slave)
    return;

  if (event.key === "Enter") {

    const command =
      input.value + "\n";

    input.value = "";

    sendInput(command);

    event.preventDefault();

    return;
  }

  if (event.key === "Backspace") {

    sendInput("\x7f");

    event.preventDefault();

    return;
  }

  if (event.key === "Tab") {

    sendInput("\t");

    event.preventDefault();

    return;
  }

  if (event.key === "ArrowUp") {

    sendInput("\x1b[A");

    event.preventDefault();

    return;
  }

  if (event.key === "ArrowDown") {

    sendInput("\x1b[B");

    event.preventDefault();

    return;
  }

  if (event.key === "ArrowLeft") {

    sendInput("\x1b[D");

    event.preventDefault();

    return;
  }

  if (event.key === "ArrowRight") {

    sendInput("\x1b[C");

    event.preventDefault();

    return;
  }

  if (event.key === "c" && event.ctrlKey) {

    sendInput("\x03");

    event.preventDefault();

    return;
  }

});


function sendInput(text) {

  if (!slave)
    return;

  try {

    if (typeof slave.write === "function") {

      slave.write(text);
      return;
    }

  } catch (e) {

    console.error(e);

  }

  try {

    if (typeof master?.write === "function") {

      master.write(text);
    }

  } catch (e) {

    console.error(e);

  }
}


/*
-----------------------------------------------------------
 Ctrl+C
-----------------------------------------------------------
*/

ctrlC.addEventListener("click", () => {

  sendInput("\x03");

  input.focus();

});


/*
-----------------------------------------------------------
 Clear screen
-----------------------------------------------------------
*/

clearButton.addEventListener("click", () => {

  terminal.textContent = "";

  printLine("WebPC 2 — Alpine Linux x86-64");
  printLine("");

});


/*
-----------------------------------------------------------
 Browser diagnostics
-----------------------------------------------------------
*/

function diagnostics() {

  printLine("");
  printLine("Browser diagnostics");
  printLine("-------------------");

  printLine(
    "crossOriginIsolated: " +
    String(window.crossOriginIsolated)
  );

  printLine(
    "SharedArrayBuffer: " +
    String(typeof SharedArrayBuffer !== "undefined")
  );

  printLine(
    "WebAssembly: " +
    String(typeof WebAssembly !== "undefined")
  );

  printLine("");

}


/*
-----------------------------------------------------------
 Load a generated Emscripten package loader
-----------------------------------------------------------
*/

async function loadScript(url) {

  return new Promise((resolve, reject) => {

    const script =
      document.createElement("script");

    script.src = url;

    script.async = false;

    script.onload = () => resolve();

    script.onerror = () => {

      reject(
        new Error(
          "Could not load:\n" + url
        )
      );

    };

    document.head.appendChild(script);

  });

}


/*
-----------------------------------------------------------
 Fetch QEMU WASM

 We explicitly fetch it first so failures are visible.
-----------------------------------------------------------
*/

async function loadWasm() {

  setStatus("Downloading QEMU WebAssembly…");

  printLine(
    "Downloading qemu-system-x86_64.wasm…"
  );

  const response =
    await fetch(FILES.wasm);

  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status +
      " while downloading QEMU WASM."
    );

  }

  const buffer =
    await response.arrayBuffer();

  printLine(
    "QEMU WASM downloaded: " +
    Math.round(buffer.byteLength / 1024 / 1024) +
    " MiB"
  );

  return buffer;
}


/*
-----------------------------------------------------------
 QEMU startup
-----------------------------------------------------------
*/

async function boot() {

  if (booted)
    return;

  booted = true;

  try {

    diagnostics();

    if (!window.crossOriginIsolated) {

      throw new Error(
        "The page is NOT cross-origin isolated.\n\n" +
        "Cloudflare Pages must send:\n" +
        "Cross-Origin-Opener-Policy: same-origin\n" +
        "Cross-Origin-Embedder-Policy: require-corp\n\n" +
        "Check your _headers file."
      );

    }

    /*
     * Create the PTY expected by the existing
     * Emscripten QEMU build.
     */

    const pty =
      createBasicPTY();

    slave = pty;


    /*
     * QEMU configuration.
     *
     * This is deliberately still the Alpine serial-console
     * configuration. No Minecraft and no graphical VM yet.
     */

    window.Module = {

      arguments: [

        "-nographic",

        "-M",
        "pc",

        "-m",
        "512M",

        "-accel",
        "tcg,tb-size=500",

        "-L",
        "/pack-rom/",

        "-nic",
        "none",

        "-kernel",
        "/pack-kernel/vmlinuz-virt",

        "-initrd",
        "/pack-initramfs/initramfs-virt",

        "-append",
        "console=ttyS0 root=/dev/vda noautodetect hostname=webpc",

        "-drive",
        "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

        "-device",
        "virtio-blk-pci,drive=test"
      ],

      /*
       * The PTY is supplied to the Emscripten
       * xterm-pty integration.
       */
      pty: slave,

      /*
       * The generated Emscripten module must know where
       * its main script lives because pthread workers are
       * used by this QEMU build.
       */
      mainScriptUrlOrBlob: FILES.out,

      locateFile(path, prefix) {

        /*
         * QEMU's generated JS asks for:
         *
         * qemu-system-x86_64.wasm
         * worker JS
         * package assets
         *
         * Everything is stored in the V1 GitHub release.
         */

        if (
          path === "qemu-system-x86_64.wasm" ||
          path.endsWith(".wasm")
        ) {

          return FILES.wasm;
        }

        if (
          path === "qemu-system-x86_64.worker.js"
        ) {

          return FILES.worker;
        }

        return RELEASE + path;
      },

      print(text) {
        print(cleanANSI(text));
      },

      printErr(text) {
        print(
          "\n[QEMU] " +
          cleanANSI(text) +
          "\n"
        );
      },

      onAbort(reason) {

        setStatus("QEMU aborted");

        printLine("");
        printLine("QEMU ABORTED:");
        printLine(String(reason));

      }
    };


    /*
     * Make the Module visible globally before loading
     * the generated Emscripten program.
     */

    window.Module =
      window.Module;


    /*
     * Fetch WASM first.
     */

    const wasm =
      await loadWasm();

    window.Module.wasmBinary =
      wasm;


    /*
     * Load the package filesystem scripts.
     */

    setStatus("Loading Alpine Linux image…");

    printLine(
      "Loading Alpine filesystem packages…"
    );

    await loadScript(FILES.rom);
    await loadScript(FILES.kernel);
    await loadScript(FILES.initramfs);
    await loadScript(FILES.rootfs);


    /*
     * Load QEMU itself.
     *
     * out.js is an ES module in this release.
     */

    setStatus("Starting QEMU x86-64…");

    printLine(
      "Starting QEMU system emulator…"
    );

    const qemu =
      await import(FILES.out);

    if (!qemu || typeof qemu.default !== "function") {

      throw new Error(
        "QEMU out.js loaded, but its Emscripten factory " +
        "was not found."
      );

    }

    qemuModule =
      await qemu.default(window.Module);


    booted = true;

    setStatus("Alpine Linux running");

    printLine("");
    printLine(
      "========================================"
    );

    printLine(
      " Alpine Linux x86-64 is starting."
    );

    printLine(
      "========================================"
    );

    printLine("");

    input.focus();

  } catch (error) {

    booted = false;

    setStatus("Failed to start");

    printLine("");
    printLine(
      "========================================"
    );

    printLine("WEBPC 2 STARTUP ERROR");
    printLine(
      "========================================"
    );

    printLine(
      error?.stack ||
      error?.message ||
      String(error)
    );

    printLine("");

    printLine(
      "Open Chrome DevTools → Console for the full error."
    );

  }

}


/*
-----------------------------------------------------------
 Start
-----------------------------------------------------------
*/

window.addEventListener(
  "load",
  () => {

    printLine(
      "WebPC 2 — Alpine Linux x86-64"
    );

    printLine(
      "QEMU-Wasm browser VM"
    );

    printLine("");

    printLine(
      "Preparing Linux…"
    );

    boot();

  }
);

</script>

</body>
</html>
