<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Browser Linux x86-64 VM</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#top {
    height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    box-sizing: border-box;
    background: #181818;
    border-bottom: 1px solid #333;
}

#status {
    flex: 1;
    font-size: 14px;
}

button {
    background: #2d6cdf;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 9px 14px;
    font-size: 14px;
}

button:disabled {
    opacity: .5;
}

#terminal {
    position: absolute;
    left: 0;
    right: 0;
    top: 52px;
    bottom: 0;
    padding: 8px;
    box-sizing: border-box;
    overflow: hidden;
    background: #000;
}

#error {
    display: none;
    position: absolute;
    left: 12px;
    right: 12px;
    top: 65px;
    z-index: 20;
    background: #351313;
    border: 1px solid #a33;
    border-radius: 8px;
    padding: 14px;
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 13px;
}
</style>

</head>

<body>

<div id="top">
    <div id="status">Checking browser...</div>
    <button id="start">Start VM</button>
</div>

<div id="error"></div>
<div id="terminal"></div>

<script type="module">

/*
    ============================================================
    QEMU-WASM x86-64 BROWSER VM
    ============================================================

    IMPORTANT:

    This version does NOT use:

      https://ktock.github.io/qemu-wasm-demo-images/...

    That was the broken path in the previous version.

    Instead, the generated QEMU-Wasm files are downloaded from
    the actual qemu-wasm-demo-images GitHub repository through
    jsDelivr.

    The VM itself is x86-64.
*/


const ASSET_BASE =
    "https://cdn.jsdelivr.net/gh/ktock/qemu-wasm-demo-images@main/alpine-x86_64/";

const QEMU_BASE =
    "https://cdn.jsdelivr.net/gh/ktock/qemu-wasm-demo-images@main/alpine-x86_64/";


const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const startButton = document.getElementById("start");
const terminalEl = document.getElementById("terminal");


function status(text) {
    statusEl.textContent = text;
}


function showError(error) {
    console.error(error);

    errorEl.style.display = "block";

    let message;

    if (error instanceof Error) {
        message = error.stack || error.message;
    } else {
        message = String(error);
    }

    errorEl.textContent =
        "VM failed to start:\n\n" + message;
}


/*
    ------------------------------------------------------------
    Browser checks
    ------------------------------------------------------------
*/

function checkBrowser() {

    if (!window.WebAssembly) {
        throw new Error(
            "WebAssembly is not supported by this browser."
        );
    }

    if (!window.SharedArrayBuffer) {
        throw new Error(
            "SharedArrayBuffer is unavailable.\n\n" +
            "Make sure your Cloudflare Pages deployment has:\n\n" +
            "Cross-Origin-Opener-Policy: same-origin\n" +
            "Cross-Origin-Embedder-Policy: require-corp"
        );
    }

    if (!window.crossOriginIsolated) {
        throw new Error(
            "The page is not cross-origin isolated.\n\n" +
            "Your Cloudflare Pages _headers file must contain:\n\n" +
            "/*\n" +
            "  Cross-Origin-Opener-Policy: same-origin\n" +
            "  Cross-Origin-Embedder-Policy: require-corp\n" +
            "*/"
        );
    }

    status(
        "Browser requirements passed. Ready to start x86-64 Linux."
    );
}


/*
    ------------------------------------------------------------
    Download helper
    ------------------------------------------------------------
*/

async function loadScript(url) {

    status(
        "Loading " +
        url.split("/").pop() +
        "..."
    );

    return new Promise((resolve, reject) => {

        const script = document.createElement("script");

        script.src = url;

        script.onload = () => resolve();

        script.onerror = () =>
            reject(
                new Error(
                    "Failed to load:\n" + url
                )
            );

        document.head.appendChild(script);
    });
}


/*
    ------------------------------------------------------------
    xterm
    ------------------------------------------------------------

    We use the browser's module loader to obtain xterm.

    This is only the terminal UI.

    The actual CPU is QEMU-Wasm.
*/


async function startVM() {

    startButton.disabled = true;
    errorEl.style.display = "none";

    try {

        checkBrowser();

        status("Loading terminal...");

        const {
            Terminal
        } = await import(
            "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
        );

        const {
            openpty
        } = await import(
            "https://cdn.jsdelivr.net/npm/xterm-pty@0.10.0/+esm"
        );


        /*
            ----------------------------------------------------
            Terminal
            ----------------------------------------------------
        */

        const terminal = new Terminal({
            cursorBlink: true,
            convertEol: true,
            fontSize: 14,
            scrollback: 2000,
            theme: {
                background: "#000000",
                foreground: "#ffffff"
            }
        });

        terminal.open(terminalEl);


        /*
            ----------------------------------------------------
            PTY
            ----------------------------------------------------
        */

        status("Creating virtual terminal...");

        const {
            master,
            slave
        } = openpty();


        master.onData(data => {
            terminal.write(data);
        });


        terminal.onData(data => {
            slave.write(data);
        });


        /*
            ----------------------------------------------------
            QEMU Module configuration
            ----------------------------------------------------
        */

        window.Module = window.Module || {};

        Module.pty = slave;

        Module.arguments = [
            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=browser",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test",

            "-virtfs",
            "local,path=/.wasmenv,mount_tag=wasm0," +
            "security_model=passthrough,id=wasm0",

            "-nic",
            "none"
        ];


        /*
            ----------------------------------------------------
            Emscripten asset lookup
            ----------------------------------------------------
        */

        Module.locateFile = function(path, prefix) {

            /*
                QEMU's generated runtime asks for:

                    qemu-system-x86_64.wasm
                    qemu-system-x86_64.worker.js
                    etc.

                Keep those files on the same public asset host.
            */

            return ASSET_BASE + path;
        };


        /*
            This is important for Emscripten's pthread runtime.
        */

        Module.mainScriptUrlOrBlob =
            ASSET_BASE + "out.js";


        /*
            ----------------------------------------------------
            Load generated filesystem packages
            ----------------------------------------------------
        */

        status("Loading Linux kernel...");

        await loadScript(
            ASSET_BASE + "load-kernel.js"
        );

        status("Loading Linux initramfs...");

        await loadScript(
            ASSET_BASE + "load-initramfs.js"
        );

        status("Loading Linux root filesystem...");

        await loadScript(
            ASSET_BASE + "load-rootfs.js"
        );

        status("Loading BIOS/ROM files...");

        await loadScript(
            ASSET_BASE + "load-rom.js"
        );


        /*
            ----------------------------------------------------
            Load networking/runtime support.
            ----------------------------------------------------
        */

        status("Loading QEMU runtime...");

        await loadScript(
            ASSET_BASE + "out.js"
        );


        status("Starting x86-64 Linux...");

        /*
            Emscripten normally starts the runtime after
            out.js has loaded.
        */

        if (typeof Module.onRuntimeInitialized === "function") {
            Module.onRuntimeInitialized();
        }

        status(
            "Linux VM started. Waiting for login prompt..."
        );

    } catch (error) {

        startButton.disabled = false;

        showError(error);
    }
}


startButton.addEventListener(
    "click",
    startVM
);


/*
    Initial check
*/

try {

    checkBrowser();

} catch (error) {

    showError(error);

    startButton.disabled = true;
}

</script>

</body>
</html>
