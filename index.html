<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no">

<title>Linux x86-64 Browser VM</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#bar {
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    box-sizing: border-box;
    background: #181818;
    border-bottom: 1px solid #333;
}

#status {
    flex: 1;
    font-size: 13px;
}

#start {
    padding: 8px 14px;
    border: 0;
    border-radius: 7px;
    background: #2878e8;
    color: white;
    font-size: 14px;
}

#start:disabled {
    opacity: .5;
}

#terminal {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px;
    box-sizing: border-box;
    overflow: hidden;
    background: #000;
}

#error {
    display: none;
    position: absolute;
    z-index: 100;
    top: 60px;
    left: 10px;
    right: 10px;
    max-height: 75vh;
    overflow: auto;
    padding: 14px;
    box-sizing: border-box;

    background: #351313;
    border: 1px solid #a44;
    border-radius: 8px;

    color: #fff;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
}

</style>

</head>

<body>

<div id="bar">

```
<div id="status">
    Checking browser...
</div>

<button id="start">
    Start VM
</button>
```

</div>

<div id="error"></div>

<div id="terminal"></div>

<script type="module">

/*
============================================================
QEMU-WASM x86-64
============================================================

Real generated assets:

ktock/qemu-wasm-demo-images
alpine-x86_64

The previous version allowed Emscripten to fetch the WASM
itself. This version downloads it first and passes the
ArrayBuffer directly to Emscripten.
*/


const BASE =
    "https://cdn.jsdelivr.net/gh/" +
    "ktock/qemu-wasm-demo-images@main/" +
    "alpine-x86_64/";


const WASM_URL =
    BASE + "qemu-system-x86_64.wasm";


const statusBox =
    document.getElementById("status");


const errorBox =
    document.getElementById("error");


const startButton =
    document.getElementById("start");


function status(text) {

    statusBox.textContent = text;

}


function showError(error) {

    console.error(error);

    errorBox.style.display = "block";

    let message = "";

    if (error instanceof Error) {

        message =
            error.stack ||
            error.message;

    } else {

        message =
            String(error);

    }

    errorBox.textContent =
        "VM failed to start:\n\n" +
        message;

    startButton.disabled = false;

}


function browserCheck() {

    if (!window.WebAssembly) {

        throw new Error(
            "WebAssembly is not supported."
        );

    }


    if (!window.SharedArrayBuffer) {

        throw new Error(
            "SharedArrayBuffer is unavailable.\n\n" +
            "Check your Cloudflare _headers file."
        );

    }


    if (!window.crossOriginIsolated) {

        throw new Error(
            "crossOriginIsolated is FALSE.\n\n" +
            "Cloudflare Pages needs:\n\n" +

            "Cross-Origin-Opener-Policy: same-origin\n" +

            "Cross-Origin-Embedder-Policy: require-corp"
        );

    }

}


/*
------------------------------------------------------------
Load classic JavaScript
------------------------------------------------------------
*/

function loadScript(url) {

    return new Promise(
        (resolve, reject) => {

            const s =
                document.createElement("script");

            s.src = url;

            s.onload =
                () => resolve();

            s.onerror =
                () => reject(
                    new Error(
                        "Could not load:\n" +
                        url
                    )
                );

            document.head.appendChild(s);

        }
    );

}


/*
------------------------------------------------------------
Main VM startup
------------------------------------------------------------
*/

async function startVM() {

    startButton.disabled = true;

    errorBox.style.display = "none";


    try {

        browserCheck();


        /*
        ----------------------------------------------------
        Terminal
        ----------------------------------------------------
        */

        status(
            "Loading xterm..."
        );


        await import(
            "https://unpkg.com/xterm@5.3.0/lib/xterm.js"
        );


        status(
            "Loading virtual terminal..."
        );


        await import(
            "https://unpkg.com/xterm-pty/index.js"
        );


        const terminal =
            new Terminal({

                cursorBlink: true,

                fontSize: 14,

                convertEol: true,

                scrollback: 3000,

                theme: {

                    background: "#000000",

                    foreground: "#ffffff"

                }

            });


        terminal.open(
            document.getElementById("terminal")
        );


        /*
        ----------------------------------------------------
        PTY
        ----------------------------------------------------
        */

        const {
            master,
            slave
        } = openpty();


        /*
        This is the same PTY connection method used by
        the upstream QEMU-Wasm demo.
        */

        terminal.loadAddon(master);


        /*
        ----------------------------------------------------
        Global Module
        ----------------------------------------------------
        */

        window.Module = {};


        Module.pty = slave;


        /*
        ----------------------------------------------------
        QEMU command line
        ----------------------------------------------------
        */

        Module.arguments = [

            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=browser",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test",

            "-virtfs",
            "local,path=/.wasmenv," +
            "mount_tag=wasm0," +
            "security_model=passthrough," +
            "id=wasm0"

        ];


        /*
        ----------------------------------------------------
        Locate generated files
        ----------------------------------------------------
        */

        Module.locateFile =
            function(path, prefix) {

                return BASE + path;

            };


        Module.mainScriptUrlOrBlob =
            BASE + "out.js";


        /*
        ----------------------------------------------------
        Capture Emscripten abort reason
        ----------------------------------------------------
        */

        Module.onAbort =
            function(reason) {

                showError(
                    new Error(
                        "Emscripten/QEMU abort:\n\n" +
                        String(reason)
                    )
                );

            };


        Module.print =
            function(text) {

                console.log(
                    "[QEMU]",
                    text
                );

            };


        Module.printErr =
            function(text) {

                console.error(
                    "[QEMU]",
                    text
                );

            };


        /*
        ----------------------------------------------------
        Download WASM ourselves
        ----------------------------------------------------
        */

        status(
            "Downloading QEMU x86-64 WebAssembly..."
        );


        const wasmResponse =
            await fetch(
                WASM_URL,
                {
                    mode: "cors",
                    credentials: "omit"
                }
            );


        if (!wasmResponse.ok) {

            throw new Error(
                "QEMU WASM download failed.\n\n" +

                "HTTP status: " +
                wasmResponse.status +
                "\n\n" +

                WASM_URL
            );

        }


        const contentType =
            wasmResponse.headers.get(
                "content-type"
            ) || "";


        status(
            "Reading QEMU WebAssembly..."
        );


        const wasmBinary =
            await wasmResponse.arrayBuffer();


        if (wasmBinary.byteLength < 1000000) {

            throw new Error(
                "The QEMU WASM file appears invalid.\n\n" +

                "Downloaded bytes: " +
                wasmBinary.byteLength +
                "\n\n" +

                "Expected roughly 40 MB."
            );

        }


        /*
        Give Emscripten the binary directly.

        This avoids another cross-origin fetch inside
        instantiateAsync().
        */

        Module.wasmBinary =
            wasmBinary;


        /*
        ----------------------------------------------------
        Load Linux filesystem packages
        ----------------------------------------------------
        */

        status(
            "Loading Linux root filesystem..."
        );

        await loadScript(
            BASE + "load-rootfs.js"
        );


        status(
            "Loading Linux kernel..."
        );

        await loadScript(
            BASE + "load-kernel.js"
        );


        status(
            "Loading Linux initramfs..."
        );

        await loadScript(
            BASE + "load-initramfs.js"
        );


        status(
            "Loading Linux ROM..."
        );

        await loadScript(
            BASE + "load-rom.js"
        );


        /*
        ----------------------------------------------------
        Load QEMU Emscripten module
        ----------------------------------------------------
        */

        status(
            "Loading QEMU runtime..."
        );


        const qemu =
            await import(
                BASE + "out.js"
            );


        if (
            !qemu ||
            typeof qemu.default !== "function"
        ) {

            throw new Error(
                "The QEMU Emscripten module did not " +
                "export its expected default function."
            );

        }


        /*
        ----------------------------------------------------
        Start QEMU
        ----------------------------------------------------
        */

        status(
            "Starting x86-64 Linux..."
        );


        const ready =
            qemu.default(Module);


        /*
        If the Emscripten module returns its ready
        Promise, wait for it.
        */

        if (
            ready &&
            typeof ready.then === "function"
        ) {

            await ready;

        }


        /*
        ----------------------------------------------------
        PTY polling
        ----------------------------------------------------
        */

        if (
            Module.TTY &&
            Module.TTY.stream_ops &&
            Module.TTY.stream_ops.poll
        ) {

            const oldPoll =
                Module.TTY.stream_ops.poll;


            const pty =
                Module.pty;


            Module.TTY.stream_ops.poll =
                function(
                    stream,
                    timeout
                ) {

                    if (!pty.readable) {

                        return (
                            (pty.readable ? 1 : 0) |
                            (pty.writable ? 4 : 0)
                        );

                    }


                    return oldPoll.call(
                        this,
                        stream,
                        timeout
                    );

                };

        }


        status(
            "x86-64 Linux is running."
        );


    } catch (error) {

        showError(error);

    }

}


startButton.addEventListener(
    "click",
    startVM
);


/*
------------------------------------------------------------
Initial check
------------------------------------------------------------
*/

try {

    browserCheck();

    status(
        "Browser requirements passed."
    );

} catch (error) {

    showError(error);

}

</script>

</body>
</html>
