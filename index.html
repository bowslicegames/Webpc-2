  window.webpcDesktopConsumeOutput = function (data) {
    if (!pending) return;
    let s = typeof data === "string" ? data : "";
    if (!s && data && typeof data.length === "number") {
      try { s = dec.decode(data instanceof Uint8Array ? data : new Uint8Array(data)); } catch (_) {}
    }
    if (!s) return;
    const p = pending;
    let incoming = s;
    if (!p.found) {
      outputBuffer = (outputBuffer + incoming).slice(-500000);
      incoming = "";
      const beginIndex = outputBuffer.lastIndexOf(p.begin);
      if (beginIndex < 0) {
        outputBuffer = outputBuffer.slice(-Math.max(2000, p.begin.length));
        return;
      }
      p.found = true;
      incoming = outputBuffer.slice(beginIndex + p.begin.length);
      outputBuffer = "";
    }

    /*
     * Keep a rolling suffix while collecting output. PTY chunks may split
     * the end marker at any byte boundary, so never discard the possible
     * beginning of that marker before the next chunk arrives.
     */
    const combined = outputBuffer + incoming;
    const endIndex = combined.indexOf(p.end);
    const failIndex = combined.indexOf(p.fail);
    const failed = failIndex >= 0 && (endIndex < 0 || failIndex < endIndex);
    const markerIndex = failed ? failIndex : endIndex;
    const marker = failed ? p.fail : p.end;
    if (markerIndex >= 0) {
      p.text += combined.slice(0, markerIndex);
      outputBuffer = combined.slice(markerIndex + marker.length);
      const result = cleanOutput(p.text).trim();
      const commandError = failed
        ? new Error("Guest command failed with a non-zero exit status." +
            (result ? " " + result.slice(-500) : ""))
        : null;
      p.finish(commandError, result);
      return;
    }

    const keep = Math.max(0, p.end.length, p.fail.length) - 1;
    if (combined.length > keep) {
      p.text += combined.slice(0, combined.length - keep);
      outputBuffer = combined.slice(-keep);
    } else {
      outputBuffer = combined;
    }

  let uploadInProgress = false;

  const uploadPartBytes = 8 * 1024 * 1024;

  function bytesToBase64(buffer) {
    const data = new Uint8Array(buffer);
    let binary = "";
    for (let i = 0; i < data.length; i += 0x8000) {
      binary += String.fromCharCode.apply(null, data.subarray(i, Math.min(data.length, i + 0x8000)));
    }
    return btoa(binary);
  }

  function runGuestPromise(command) {
    return new Promise((resolve, reject) => {
      const accepted = runGuest(command, (err, output) => {
        if (err) reject(err);
        else resolve(output || "");
      });
      if (!accepted) reject(new Error("The VM could not accept the next upload part."));
    });
  }

  function startDirectGuestDownload(rawUrl, fixedName, requireConfirm=true) {
    if (!shellReadyNow()) { setFileStatus("Wait until Linux has logged in before downloading.", true); return; }
    let url; try { url = new URL(rawUrl); } catch (_) { setFileStatus("The download URL is invalid.",true); return; }
    if (url.protocol !== "https:" && url.protocol !== "http:") { setFileStatus("Only HTTP or HTTPS download URLs are supported.", true); return; }
    if (url.username || url.password) { setFileStatus("URLs containing login credentials are not supported.", true); return; }
    let suggested;
    try { suggested = decodeURIComponent(url.pathname.split("/").pop() || "download.bin").replace(/[^A-Za-z0-9._ -]/g, "_"); } catch (_) { suggested = "download.bin"; }
    if (!suggested || suggested === "." || suggested === "..") suggested = "download.bin";
    const name = fixedName || window.prompt("Save download as (in the current folder):", suggested);
    if (name === null) return;
    if (!name || name === "." || name === ".." || !/^[A-Za-z0-9._ -]+$/.test(name) || name.includes("/")) { setFileStatus("Choose a simple filename without slashes.", true); return; }
    let dir; try { dir = guestPath(); } catch (e) { setFileStatus(e.message, true); return; }
    const destination = (dir === "/" ? "" : dir) + "/" + name;
    if (requireConfirm && !window.confirm("Download directly inside Linux to " + destination + "? Existing files will be resumed/replaced depending on server support.")) return;
    const taskId = "wpc-download-" + Date.now().toString(36), taskStatus = "/tmp/" + taskId + ".status", taskLog = "/tmp/" + taskId + ".log";
    const inner = "mkdir -p " + shellQuote(dir) + " || exit $?; " +
      "if command -v wget >/dev/null 2>&1; then wget -c -t 3 -T 30 -O " + shellQuote(destination) + " " + shellQuote(url.href) + "; " +
      "elif command -v curl >/dev/null 2>&1; then curl -fL --retry 3 --connect-timeout 20 -o " + shellQuote(destination) + " " + shellQuote(url.href) + "; " +
      "else echo 'Neither wget nor curl is installed'; false; fi; rc=$?; printf '%s\\n' \"$rc\" > " + shellQuote(taskStatus);
    const launch = "nohup sh -c " + shellQuote(inner) + " </dev/null > " + shellQuote(taskLog) + " 2>&1 & echo WEBPC_TASK_STARTED:$!";
    startBackgroundTask("download", "Downloading " + name, launch, taskStatus, taskLog);
  }

  fileUploadInput.addEventListener("change", async () => {
    const file = fileUploadInput.files && fileUploadInput.files[0];
    if (!file) return;
    if (!shellReadyNow()) { setFileStatus("Wait until Linux has logged in before uploading.", true); return; }

    let dir, name;
    try {
      dir = guestPath();
      name = file.name;
      if (!name || name === "." || name === ".." || !/^[A-Za-z0-9._ -]+$/.test(name) || name.includes("/")) {
        throw new Error("This filename contains unsupported characters. Rename it using letters, numbers, spaces, dots, _ or -.");
      }
    } catch (e) { setFileStatus("Upload blocked: " + e.message, true); return; }

    const destination = (dir === "/" ? "" : dir) + "/" + name;
    if (!window.confirm("Upload " + name + " (" + formatFileSize(file.size) + ") to " + destination + "? If that file exists, it will be replaced.")) return;

    uploadInProgress = true;
    uploadCancelRequested = false;
    fileUploadButton.textContent = "Cancel upload";
    fileUploadButton.disabled = false;
    fileUploadInput.disabled = true;
    let uploaded = 0;
    let partNumber = 0;

    try {
      const ready = await runGuestPromise("mkdir -p " + JSON.stringify(dir) + " && : > " + JSON.stringify(destination) + " && echo WEBPC_UPLOAD_TARGET_READY");
      if (!ready.includes("WEBPC_UPLOAD_TARGET_READY")) throw new Error("Linux could not create the destination file. Check the folder permissions and free disk space.");
      while (uploaded < file.size) {
        if (uploadCancelRequested) throw new Error("Upload cancelled by the user.");
        const part = file.slice(uploaded, Math.min(file.size, uploaded + uploadPartBytes));
        let offset = 0;
        partNumber++;
        while (offset < part.size) {
          if (uploadCancelRequested) throw new Error("Upload cancelled by the user.");
          const blockEnd = Math.min(part.size, offset + uploadTransportBytes);
          const block = await part.slice(offset, blockEnd).arrayBuffer();
          const encoded = bytesToBase64(block);
          const command = "printf '%s' '" + encoded + "' | base64 -d >> " + JSON.stringify(destination) + " && echo WEBPC_UPLOAD_BLOCK_OK";
          const output = await runGuestPromise(command);
          if (!output.includes("WEBPC_UPLOAD_BLOCK_OK")) throw new Error("Linux did not confirm a transfer block; upload stopped to avoid silent corruption.");
          offset = blockEnd;
          uploaded += block.byteLength;
          setFileStatus("Uploading " + name + " · part " + partNumber + " · " +
            formatFileSize(uploaded) + " / " + formatFileSize(file.size) + " (" +
            (file.size ? (uploaded / file.size * 100).toFixed(1) : "100.0") + "%)");
        }
      }

      const verify = await runGuestPromise("test -f " + JSON.stringify(destination) +
        " && test \"$(stat -c %s " + JSON.stringify(destination) + ")\" -eq " + file.size +
        " && echo WEBPC_UPLOAD_VERIFIED");
      if (!verify.includes("WEBPC_UPLOAD_VERIFIED")) throw new Error("Final file-size verification failed. The file may be incomplete or the virtual disk may be full.");
      setFileStatus("Upload complete and size verified: " + destination);
      fileName.value = name;
      selectedFilePath = destination;
      refreshFiles();
    } catch (e) {
      setFileStatus("Upload " + (uploadCancelRequested ? "cancelled" : "failed") + ": " + e.message +
        (uploaded ? " · " + formatFileSize(uploaded) + " transferred before stopping." : ""), true);
    } finally {
      uploadInProgress = false;
      uploadCancelRequested = false;
      fileUploadButton.textContent = "⇧ Upload file";
      fileUploadButton.disabled = false;
      fileUploadInput.disabled = false;
      fileUploadInput.value = "";
    }
  });

      "if [ ! -e /dev/dri/card0 ]; then modprobe bochs_drm >/dev/null 2>&1 || true; fi",
      "if ! pidof Xorg >/dev/null 2>&1; then",
      "  Xorg :0 -config /etc/X11/xorg.conf.d/20-webpc.conf -noreset -nolisten tcp -keeptty -logfile /var/log/webpc-xorg.log vt1 &",
      "  xpid=$!",
      "  n=0",
      "  while [ \"$n\" -lt 20 ] && [ ! -S /tmp/.X11-unix/X0 ]; do",
      "    kill -0 \"$xpid\" 2>/dev/null || break",
      "    sleep 1",
      "    n=$((n + 1))",
      "  done",
      "fi",
      "if [ ! -S /tmp/.X11-unix/X0 ]; then echo 'Xorg did not create display :0'; tail -n 80 /var/log/webpc-xorg.log 2>/dev/null || true; exit 20; fi",
      "exec prismlauncher",
      "WEBPC_MC_EOF",
      "chmod 755 /usr/local/bin/webpc-minecraft-display",
      "echo 'Configured Xorg modesetting and Mesa llvmpipe. Guest VGA/DRM availability will be checked when the display starts.'",
      "if command -v java >/dev/null 2>&1; then java -version 2>&1; java_rc=$?; else echo 'ERROR: java executable is not on PATH'; java_rc=127; fi",
      "if command -v prismlauncher >/dev/null 2>&1; then prismlauncher --version 2>&1 || true; else echo 'ERROR: Prism Launcher executable is missing'; java_rc=127; fi",
      "if [ \"$java_rc\" -eq 0 ] && java -version 2>&1 | grep -Eq 'version .?21|openjdk 21' && command -v prismlauncher >/dev/null 2>&1 && command -v Xorg >/dev/null 2>&1; then rc=0; echo 'SUCCESS: Java 21, Prism Launcher, Xorg and Mesa runtime packages are installed.'; else",
      "  echo 'ERROR: Java verification did not confirm a runnable Java 21 runtime.'; rc=1",
      "  echo '[7/7] Package and network diagnostics'",
      "  echo 'Configured repositories:'; cat /etc/apk/repositories 2>/dev/null || true",
      "  echo 'APK package candidates:'; apk search -x openjdk21-jre prismlauncher xorg-server mesa-dri-gallium 2>&1 || true",
      "  echo 'Disk space:'; df -h / 2>&1 || true",
      "fi",
      "rm -f /tmp/webpc-apk-repositories.orig /tmp/webpc-apk-repositories",
      "printf '%s\\n' \"$rc\" > " + shellQuote(taskStatus),
      "exit \"$rc\""
    ].join("\n");
    const taskScript = "/tmp/" + taskId + ".sh";
    /* Stage the installer as a script to avoid deeply nested shell quoting. */
    const launch = "printf '%s' " + shellQuote(b64(inner)) + " | base64 -d > " + shellQuote(taskScript) +
      " && chmod 700 " + shellQuote(taskScript) +
      " && (nohup /bin/sh " + shellQuote(taskScript) + " </dev/null > " + shellQuote(taskLog) + " 2>&1 & echo WEBPC_TASK_STARTED:$!)";
    startBackgroundTask("java", "Installing Java 21", launch, taskStatus, taskLog, document.getElementById("minecraftStatus"));
  });

  const repairApkButton = document.getElementById("repairApk");
  repairApkButton.addEventListener("click", () => {
    if (!shellReadyNow()) { document.getElementById("apkStatus").textContent = "APK package manager: Linux is still starting."; return; }
    if (!window.confirm("Refresh Alpine package indexes, check disk health, and try installing nano? This does not change the VM disk image or release assets.")) return;
    const taskId = "wpc-apk-" + Date.now().toString(36);
    const taskStatus = "/tmp/" + taskId + ".status", taskLog = "/tmp/" + taskId + ".log";
    const inner = [
      "set +e",
      "echo '=== WebPC APK repair and storage diagnostics ==='",
      "echo '[1/4] Alpine version and repositories'",
      "cat /etc/alpine-release 2>&1 || true",
      "cat /etc/apk/repositories 2>&1 || true",
      "echo '[2/4] Disk, mount flags, and filesystem write probes'",
      "df -h / /tmp /var 2>&1 || true",
      "df -i / /tmp /var 2>&1 || true",
      "mount 2>&1 | grep -E ' on / | on /tmp | on /var ' || true",
      "for d in /tmp /lib/apk/db /etc/apk; do if [ -d \"$d\" ]; then probe=\"$d/.webpc-write-test-$\"; if printf 'ok\\n' > \"$probe\" 2>/tmp/webpc-write-test.err; then rm -f \"$probe\"; echo \"WRITE_OK $d\"; else echo \"WRITE_FAILED $d: $(cat /tmp/webpc-write-test.err 2>/dev/null)\"; fi; fi; done",
      "echo '[3/4] Refreshing package indexes'",
      "apk update",
      "update_rc=$?",
      "if [ \"$update_rc\" -eq 0 ]; then",
      "  echo '[4/4] Repairing APK metadata, then installing nano'",
      "  apk fix --no-scripts apk-tools 2>&1 || echo 'apk-tools repair was unsuccessful; continuing with nano attempt'",
      "  apk add --no-cache nano",
      "  rc=$?",
      "else",
      "  rc=$update_rc",
      "  echo 'APK index refresh failed; package installation was skipped.'",
      "fi",
      "if [ \"$rc\" -ne 0 ]; then",
      "  echo '=== Failure diagnostics ==='",
      "  echo 'Writable paths:'",
      "  for d in /tmp /var/tmp /var/cache/apk /lib/apk/db /etc/apk; do ls -ld \"$d\" 2>&1; done",
      "  echo 'Kernel storage messages:'; dmesg 2>&1 | tail -n 12 || true",
      "  echo 'Final disk status:'; df -h / 2>&1 || true",
      "fi",
      "printf '%s\\n' \"$rc\" > " + shellQuote(taskStatus),
      "exit \"$rc\""
    ].join("\n");
    const taskScript = "/tmp/" + taskId + ".sh";
    const launch = "printf '%s' " + shellQuote(b64(inner)) + " | base64 -d > " + shellQuote(taskScript) +
      " && chmod 700 " + shellQuote(taskScript) +
      " && (nohup /bin/sh " + shellQuote(taskScript) + " </dev/null > " + shellQuote(taskLog) + " 2>&1 & echo WEBPC_TASK_STARTED:$!)";
    const status = document.getElementById("apkStatus");
    startBackgroundTask("java", "Repairing APK and installing nano", launch, taskStatus, taskLog, status);
  });

  const browserForm = document.getElementById("browserForm");
  const browserAddress = document.getElementById("browserAddress");
  const browserStatus = document.getElementById("browserStatus");
  let browserHistory = [], browserHistoryIndex = -1, browserTab = null;
  let webpcHiddenAt = 0;
  function normalizeBrowserAddress(raw) {
    let value = String(raw || "").trim();
    if (!value) throw new Error("Enter a website address or search phrase.");
    const hasScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(value);
    if (/\s/.test(value) && !hasScheme) return "https://duckduckgo.com/?q=" + encodeURIComponent(value);
    if (!hasScheme) value = "https://" + value;
    const url = new URL(value);
    if (url.protocol !== "http:" && url.protocol !== "https:") throw new Error("Only HTTP and HTTPS websites are supported.");
    if (url.username || url.password) throw new Error("For safety, remove usernames and passwords from the address.");
    return url.href;
  }
  function openRealBrowserTab(url) {
    try {
      if (browserTab && !browserTab.closed) {
        browserTab.location.href = url;
        browserTab.focus();
      } else {
        browserTab = window.open(url, "webpc-real-browser");
        if (browserTab) { try { browserTab.opener = null; } catch (_) {} }
      }
    } catch (_) {
      browserTab = window.open(url, "_blank");
      if (browserTab) { try { browserTab.opener = null; } catch (_) {} }
    }
    if (!browserTab) {
      browserStatus.textContent = "Your browser blocked the new tab. Allow pop-ups for this WebPC site, then press Open website.";
      return false;
    }
    browserStatus.textContent = "Opened in your real browser tab. That tab uses the browser's own engine, cookies, JavaScript, downloads and security rules; use its native controls for site-specific features.";
    return true;
  }
  function navigateBrowser(raw, remember = true) {
    let url;
    try { url = normalizeBrowserAddress(raw); }
    catch (e) { browserStatus.textContent = e.message; return; }
    browserAddress.value = url;
    if (remember) {
      browserHistory = browserHistory.slice(0, browserHistoryIndex + 1);
      browserHistory.push(url);
      if (browserHistory.length > 40) browserHistory.shift();
      browserHistoryIndex = browserHistory.length - 1;
    }
    openRealBrowserTab(url);
  }
  browserForm.addEventListener("submit", event => { event.preventDefault(); navigateBrowser(browserAddress.value); });
  document.getElementById("browserLaunch").addEventListener("click", () => navigateBrowser(browserAddress.value));
  document.getElementById("browserReload").addEventListener("click", () => {
    if (browserHistoryIndex < 0) { navigateBrowser(browserAddress.value); return; }
    navigateBrowser(browserHistory[browserHistoryIndex], false);
  });
  document.getElementById("browserBack").addEventListener("click", () => {
    if (browserHistoryIndex > 0) {
      browserHistoryIndex--;
      navigateBrowser(browserHistory[browserHistoryIndex], false);
    } else browserStatus.textContent = "No earlier address in WebPC's navigation history. Use the real browser tab's Back button for navigation performed directly on the website.";
  });
  document.getElementById("browserForward").addEventListener("click", () => {
    if (browserHistoryIndex < browserHistory.length - 1) {
      browserHistoryIndex++;
      navigateBrowser(browserHistory[browserHistoryIndex], false);
    } else browserStatus.textContent = "No later address in WebPC's navigation history.";
  });
  document.getElementById("browserStop").addEventListener("click", () => {
    browserStatus.textContent = "WebPC cannot stop a cross-origin page from the desktop shell. Use Stop in the real browser tab.";
  });
  document.getElementById("browserHome").addEventListener("click", () => navigateBrowser("https://example.com/"));
  document.getElementById("browserExternal").addEventListener("click", () => navigateBrowser(browserAddress.value));
  function noteWebPCResume() {
    if (shellReadyNow()) {
      if (typeof commandChannelStalled !== "undefined" && commandChannelStalled) {
        setStatus("App command channel stalled · WebPC resumed; inspect the terminal before retrying");
      } else if (typeof commandBusy !== "undefined" && commandBusy) {
        setStatus("Linux shell ready · resumed; an app task may have paused");
      } else {
        setStatus("Linux shell ready · WebPC resumed in the foreground");
      }
    } else {
      setStatus("WebPC resumed · Linux may need a moment to wake up");
    }
    if (browserStatus) {
      browserStatus.textContent = "WebPC resumed. Websites are open in a separate browser tab; use that tab's own controls if it needs reloading.";
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      webpcHiddenAt = Date.now();
    } else if (webpcHiddenAt) {
      const awayMs = Date.now() - webpcHiddenAt;
      webpcHiddenAt = 0;
      noteWebPCResume();
      if (awayMs > 30000 && browserStatus) {
        browserStatus.textContent = "Returned after " + Math.round(awayMs / 1000) + "s. If a website needs refreshing, use the real browser tab's Reload control.";
      }
    }
  });
  window.addEventListener("pageshow", event => {
    if (event.persisted) noteWebPCResume();
  });

  window.webpcRevealDesktopAtLogin = function() {
    const startup = document.getElementById("startup");
    if (startup) startup.classList.add("hidden");
    app.classList.add("vm-ready");
    desktop.style.display = "block";
    desktop.classList.add("locked");
    setStatus("Linux login prompt detected · sign in in Terminal to unlock apps");
    showWindow("terminalWindow");
    attachTerminal();
  };
  window.webpcDesktopShellReady = function() {
    desktop.classList.remove("locked");
    setStatus("Linux shell ready · all desktop apps available");
    if(fileStatus) setFileStatus("Linux shell ready. Files are stored on the temporary VM disk and are lost on a fresh launch.");
    if (!homeDirsInitialized) {
      homeDirsInitialized = true;
      const homeDirs = ["Desktop", "Documents", "Downloads"]
        .map(name => shellQuote(BASE_HOME + "/" + name)).join(" ");
      runGuestForService("files", "mkdir -p " + homeDirs, err => {
        if (err) {
          homeDirsInitialized = false;
          setFileStatus("Could not prepare the Linux home folders: " + err.message, true);
          return;
        }
        const fileWindow = document.getElementById("fileWindow");
        if (fileWindow && fileWindow.classList.contains("open")) refreshFiles();
      });
    } else {
      const fileWindow = document.getElementById("fileWindow");
      if (fileWindow && fileWindow.classList.contains("open")) refreshFiles();
    }
  };
  window.showDesktopUI = function() {
    /* The shell-ready callback is the only path that unlocks the desktop. */
    const startup = document.getElementById("startup");
    if (startup) startup.classList.add("hidden");
    app.classList.add("vm-ready");
    desktop.style.display = "block";
    if (shellReadyNow()) {
      desktop.classList.remove("locked");
      setStatus("Linux shell ready · all desktop apps available");
    } else {
      desktop.classList.add("locked");
      setStatus("Linux starting · desktop apps remain locked until sign-in");
    }
    showWindow("terminalWindow");
    attachTerminal();
  };
  desktop.classList.add("locked");
  setStatus("Waiting for Linux login prompt…");
})();
</script>

<script src="./webpc-gpu.js"></script>
<script src="./graphics-qemu-adapter.js"></script>
<script src="./minecraft-touch.js"></script>
<script>
(() => {
  const canvas = document.getElementById("guestDisplayCanvas");
  const status = document.getElementById("guestDisplayStatus");
  const button = document.getElementById("guestDisplayStats");
  const storageButton = document.getElementById("requestStorage");
  const minecraftStatus = document.getElementById("minecraftStatus");
  if (storageButton) storageButton.addEventListener("click", async () => {
    if (!navigator.storage || !navigator.storage.estimate) {
      minecraftStatus.textContent = "Browser storage estimate API is unavailable.";
      return;
    }
    try {
      let persistent = false;
      if (navigator.storage.persist) persistent = await navigator.storage.persist();
      const estimate = await navigator.storage.estimate();
      const used = Number(estimate.usage || 0);
      const quota = Number(estimate.quota || 0);
      const free = Math.max(0, quota - used);
      minecraftStatus.textContent =
        "Browser storage: " + (used / 1073741824).toFixed(2) + " GiB used / " +
        (quota ? (quota / 1073741824).toFixed(2) + " GiB quota" : "quota unavailable") +
        " · " + (free / 1073741824).toFixed(2) + " GiB free · " +
        (persistent ? "persistent storage granted" : "persistence not granted") +
        (free < 4.5 * 1073741824 ? " · WARNING: insufficient free quota for the full Minecraft asset set" : "");
    } catch (error) {
      minecraftStatus.textContent = "Storage check failed: " + (error && error.message ? error.message : String(error));
    }
  });
  if (!canvas || !status || !window.WebPCGraphicsBridge) return;
  try {
    window.WebPCGraphicsBridge.attach(canvas);
    status.textContent = "Guest display: bridge ready · no QEMU frame source is connected yet";
  } catch (error) {
    status.textContent = "Guest display bridge error: " + error.message;
  }
  if (button) button.addEventListener("click", () => {
    const s = window.WebPCGraphicsBridge.getStats();
    status.textContent = "Bridge attached: " + s.attached + " · frames received: " + s.frames + " · resolution: " + (s.width || "—") + "×" + (s.height || "—") + " · input sink: " + s.inputConnected;
  });
})();
</script>
