
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>QEMU x86-64 Browser VM</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b10;
    color: #e8eef7;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#header {
    flex: 0 0 auto;
    padding: 12px;
    background: #111722;
    border-bottom: 1px solid #293445;
}

#title {
    font-weight: 700;
    font-size: 16px;
}

#status {
    margin-top: 5px;
    color: #aebbd0;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}

#log {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 12px;
    box-sizing: border-box;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
}

.ok {
    color: #9be7a6;
}

.warn {
    color: #ffd27a;
}

.bad {
    color: #ff9b9b;
}

.info {
    color: #b7c9e5;
}

#terminal {
    display: none;
    flex: 1;
    min-height: 0;
    padding: 8px;
    box-sizing: border-box;
}

#terminal .xterm {
    height: 100%;
}
</style>
</head>

<body>

<div id="app">

    <div id="header">
        <div id="title">
            Linux x86-64 browser VM
        </div>

        <div id="status">
            Initialising…
        </div>
    </div>

    <div id="log"></div>

    <div id="terminal"></div>

</div>


<script type="module">

/*
============================================================
QEMU-WASM TEST
============================================================

This page intentionally performs the startup in small stages.

If something fails, the exact stage is displayed.

The VM is NON-PERSISTENT.
No IndexedDB or localStorage disk is created.

============================================================
*/


const BASE =
    "https://cdn.jsdelivr.net/gh/" +
    "ktock/qemu-wasm-demo-images@main/alpine-x86_64/";


const FILES = {

    wasm:
        BASE +
        "qemu-system-x86_64.wasm",

    qemuJS:
        BASE +
        "out.js",

    worker:
        BASE +
        "qemu-system-x86_64.worker.js",

    kernel:
        BASE +
        "load-kernel.js",

    initramfs:
        BASE +
        "load-initramfs.js",

    rootfs:
        BASE +
        "load-rootfs.js",

    rom:
        BASE +
        "load-rom.js"
};


const statusElement =
    document.getElementById("status");

const logElement =
    document.getElementById("log");


function setStatus(text) {
    statusElement.textContent = text;
}


function log(text, type = "info") {

    const line =
        document.createElement("div");

    line.className = type;

    line.textContent = text;

    logElement.appendChild(line);

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(text);
}


function success(text) {
    log("✓ " + text, "ok");
}


function warning(text) {
    log("⚠ " + text, "warn");
}


function failure(text) {
    log("✗ " + text, "bad");
}


/*
============================================================
FETCH TEST
============================================================
*/

async function fetchFile(
    url,
    name,
    minimumBytes = 1
) {

    setStatus(
        "Downloading:\n" +
        name
    );

    log(
        "\nDownloading " +
        name +
        "\n" +
        url
    );

    let response;

    try {

        response = await fetch(
            url,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );

    } catch (error) {

        failure(
            "FETCH FAILED: " +
            name
        );

        failure(
            "Browser error: " +
            (
                error &&
                error.message
                    ? error.message
                    : String(error)
            )
        );

        failure(
            "URL:\n" +
            url
        );

        throw error;
    }


    log(
        "HTTP status: " +
        response.status +
        " " +
        response.statusText
    );


    if (!response.ok) {

        const error =
            new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );

        failure(
            "HTTP DOWNLOAD FAILED: " +
            name
        );

        throw error;
    }


    const contentType =
        response.headers.get(
            "content-type"
        );


    if (contentType) {

        log(
            "Content-Type: " +
            contentType
        );

    }


    const buffer =
        await response.arrayBuffer();


    log(
        "Downloaded: " +
        buffer.byteLength.toLocaleString() +
        " bytes"
    );


    if (
        buffer.byteLength <
        minimumBytes
    ) {

        throw new Error(
            name +
            " is smaller than expected."
        );
    }


    success(
        name +
        " downloaded successfully."
    );


    return buffer;
}


/*
============================================================
WASM VALIDATION
============================================================
*/

async function testWasm() {

    const buffer =
        await fetchFile(
            FILES.wasm,
            "QEMU x86-64 WebAssembly",
            1000000
        );


    /*
        WebAssembly magic number:

        00 61 73 6d
    */

    const bytes =
        new Uint8Array(buffer);


    if (
        bytes[0] !== 0x00 ||
        bytes[1] !== 0x61 ||
        bytes[2] !== 0x73 ||
        bytes[3] !== 0x6d
    ) {

        throw new Error(
            "The downloaded file is NOT a WebAssembly binary.\n\n" +
            "First bytes received:\n" +
            Array
                .from(bytes.slice(0, 16))
                .map(
                    x =>
                        x
                            .toString(16)
                            .padStart(2, "0")
                )
                .join(" ")
        );
    }


    success(
        "WASM magic header is valid."
    );


    /*
        Ask the browser whether it can compile
        the downloaded module.
    */

    setStatus(
        "Checking WebAssembly compatibility…"
    );


    let compiled;

    try {

        compiled =
            await WebAssembly.compile(
                buffer
            );

    } catch (error) {

        failure(
            "WebAssembly.compile() FAILED."
        );

        failure(
            error.message ||
            String(error)
        );

        throw error;
    }


    if (
        !(compiled instanceof WebAssembly.Module)
    ) {

        throw new Error(
            "Browser did not produce a WebAssembly.Module."
        );
    }


    success(
        "Browser successfully compiled QEMU WebAssembly."
    );


    return buffer;
}


/*
============================================================
BROWSER REQUIREMENTS
============================================================
*/

function checkBrowser() {

    setStatus(
        "Checking browser requirements…"
    );


    if (
        typeof WebAssembly ===
        "undefined"
    ) {

        throw new Error(
            "WebAssembly is unavailable."
        );
    }


    success(
        "WebAssembly is available."
    );


    if (
        typeof SharedArrayBuffer ===
        "undefined"
    ) {

        throw new Error(
            "SharedArrayBuffer is unavailable.\n\n" +
            "QEMU-Wasm's pthread build requires it.\n\n" +
            "Cloudflare Pages needs the COOP/COEP headers."
        );
    }


    success(
        "SharedArrayBuffer is available."
    );


    if (
        typeof crossOriginIsolated ===
        "undefined"
    ) {

        throw new Error(
            "crossOriginIsolated is unavailable."
        );
    }


    log(
        "crossOriginIsolated = " +
        String(crossOriginIsolated)
    );


    if (!crossOriginIsolated) {

        throw new Error(
            "crossOriginIsolated is FALSE.\n\n" +
            "The Cloudflare Pages _headers file is not being applied."
        );
    }


    success(
        "Cross-origin isolation is enabled."
    );
}


/*
============================================================
DOWNLOAD JS FILE
============================================================
*/

async function downloadText(
    url,
    name
) {

    const buffer =
        await fetchFile(
            url,
            name,
            50
        );


    const text =
        new TextDecoder().decode(
            buffer
        );


    if (!text.trim()) {

        throw new Error(
            name +
            " is empty."
        );
    }


    return text;
}


/*
============================================================
BLOB URL
============================================================
*/

function makeScriptBlob(
    text
) {

    return URL.createObjectURL(
        new Blob(
            [text],
            {
                type:
                    "text/javascript"
            }
        )
    );
}


/*
============================================================
MAIN
============================================================
*/

async function main() {

    try {

        log(
            "Starting QEMU-Wasm diagnostics…"
        );


        /*
        --------------------------------------------------------
        STEP 1
        --------------------------------------------------------
        */

        checkBrowser();


        /*
        --------------------------------------------------------
        STEP 2
        --------------------------------------------------------
        */

        const wasm =
            await testWasm();


        /*
        --------------------------------------------------------
        STEP 3
        --------------------------------------------------------
        */

        setStatus(
            "QEMU WebAssembly works. " +
            "Downloading runtime files…"
        );


        const qemuText =
            await downloadText(
                FILES.qemuJS,
                "QEMU JavaScript runtime"
            );


        const workerText =
            await downloadText(
                FILES.worker,
                "QEMU pthread worker"
            );


        success(
            "QEMU JavaScript files downloaded."
        );


        /*
        --------------------------------------------------------
        STEP 4
        --------------------------------------------------------
        */

        /*
            We intentionally test the four generated package
            scripts before trying to start QEMU.
        */

        await downloadText(
            FILES.kernel,
            "Linux kernel package"
        );


        await downloadText(
            FILES.initramfs,
            "Linux initramfs package"
        );


        await downloadText(
            FILES.rootfs,
            "Alpine root filesystem package"
        );


        await downloadText(
            FILES.rom,
            "QEMU ROM package"
        );


        success(
            "All QEMU package scripts downloaded."
        );


        /*
        --------------------------------------------------------
        STEP 5
        --------------------------------------------------------
        */

        setStatus(
            "Loading terminal libraries…"
        );


        const [
            xtermModule,
            ptyModule
        ] =
            await Promise.all([
                import(
                    "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
                ),
                import(
                    "https://cdn.jsdelivr.net/npm/xterm-pty@0.9.0/+esm"
                )
            ]);


        success(
            "Terminal libraries loaded."
        );


        const Terminal =
            xtermModule.Terminal;


        const {
            openpty
        } = ptyModule;


        /*
        --------------------------------------------------------
        STEP 6
        --------------------------------------------------------
        */

        const terminalElement =
            document.getElementById(
                "terminal"
            );


        terminalElement.style.display =
            "block";


        logElement.style.display =
            "none";


        const terminal =
            new Terminal({
                cursorBlink: true,
                convertEol: true,
                fontSize: 14,
                scrollback: 5000,
                theme: {
                    background:
                        "#080b10",
                    foreground:
                        "#e8eef7"
                }
            });


        terminal.open(
            terminalElement
        );


        const {
            master,
            slave
        } =
            openpty();


        terminal.loadAddon(
            master
        );


        /*
        --------------------------------------------------------
        STEP 7
        --------------------------------------------------------
        */

        const workerBlob =
            makeScriptBlob(
                workerText
            );


        const qemuBlob =
            makeScriptBlob(
                qemuText
            );


        /*
        --------------------------------------------------------
        STEP 8
        --------------------------------------------------------
        */

        const Module = {

            wasmBinary:
                wasm,

            pty:
                slave,

            /*
                IMPORTANT:
                QEMU's pthread worker is supplied explicitly.
            */

            locateFile(
                path,
                prefix
            ) {

                if (
                    path.endsWith(
                        ".worker.js"
                    )
                ) {

                    return workerBlob;
                }


                if (
                    path.endsWith(
                        ".wasm"
                    )
                ) {

                    return FILES.wasm;
                }


                return BASE + path;
            },


            /*
                QEMU pthread runtime uses this
                when loading its module inside workers.
            */

            mainScriptUrlOrBlob:
                qemuBlob,


            print(text) {

                terminal.write(
                    String(text)
                        .replace(
                            /\n/g,
                            "\r\n"
                        )
                );
            },


            printErr(text) {

                terminal.write(
                    "\r\n" +
                    String(text) +
                    "\r\n"
                );


                console.error(
                    "[QEMU]",
                    text
                );
            },


            onAbort(reason) {

                console.error(
                    "QEMU ABORT:",
                    reason
                );


                /*
                    Do NOT overwrite the error with a
                    generic message.
                */

                statusElement.textContent =
                    "QEMU ABORT:\n" +
                    String(reason);
            },


            onExit(code) {

                console.log(
                    "QEMU exited:",
                    code
                );
            }
        };


        window.Module =
            Module;


        /*
        --------------------------------------------------------
        STEP 9
        --------------------------------------------------------

        Execute the generated package loaders.

        These are loaded from downloaded text instead of
        relying on the browser to resolve their relative
        URLs from a foreign origin.
        */

        async function executePackage(
            text,
            name
        ) {

            setStatus(
                "Installing " +
                name +
                "…"
            );


            const blob =
                makeScriptBlob(
                    text
                );


            await new Promise(
                (resolve, reject) => {

                    const script =
                        document.createElement(
                            "script"
                        );


                    script.onload =
                        () => {

                            script.remove();

                            URL.revokeObjectURL(
                                blob
                            );

                            resolve();
                        };


                    script.onerror =
                        () => {

                            script.remove();

                            URL.revokeObjectURL(
                                blob
                            );

                            reject(
                                new Error(
                                    "Could not execute " +
                                    name
                                )
                            );
                        };


                    script.src =
                        blob;


                    document.head.appendChild(
                        script
                    );
                }
            );
        }


        /*
            Re-download package contents so that their text
            can be executed.
        */

        const kernelText =
            await downloadText(
                FILES.kernel,
                "Linux kernel package"
            );


        const initramfsText =
            await downloadText(
                FILES.initramfs,
                "Linux initramfs package"
            );


        const rootfsText =
            await downloadText(
                FILES.rootfs,
                "Alpine root filesystem package"
            );


        const romText =
            await downloadText(
                FILES.rom,
                "QEMU ROM package"
            );


        await executePackage(
            kernelText,
            "Linux kernel"
        );


        await executePackage(
            initramfsText,
            "Linux initramfs"
        );


        await executePackage(
            rootfsText,
            "Alpine root filesystem"
        );


        await executePackage(
            romText,
            "QEMU ROM"
        );


        success(
            "Virtual filesystem packages installed."
        );


        /*
        --------------------------------------------------------
        STEP 10
        --------------------------------------------------------
        */

        Module.arguments = [

            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=browser-vm",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test"
        ];


        /*
        --------------------------------------------------------
        STEP 11
        --------------------------------------------------------
        */

        setStatus(
            "Starting QEMU x86-64…"
        );


        const qemu =
            await import(
                qemuBlob
            );


        if (
            !qemu ||
            typeof qemu.default !==
            "function"
        ) {

            throw new Error(
                "QEMU JavaScript did not expose " +
                "the expected Emscripten module."
            );
        }


        /*
            Start the actual VM.
        */

        await qemu.default(
            Module
        );


        setStatus(
            "Linux x86-64 VM running."
        );


    } catch (error) {

        /*
            This is deliberately verbose.

            The next failure should tell us EXACTLY which
            stage is broken.
        */

        console.error(
            "FULL VM ERROR:",
            error
        );


        setStatus(
            "VM failed — see diagnostic output below."
        );


        failure(
            "\nFINAL ERROR"
        );


        failure(
            error &&
            error.stack
                ? error.stack
                : (
                    error &&
                    error.message
                        ? error.message
                        : String(error)
                )
        );
    }
}


main();

</script>

</body>
</html>
