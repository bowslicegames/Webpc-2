<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Browser Linux x86-64 VM</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    #topbar {
        height: 52px;
        flex: 0 0 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #1b1b1b;
        border-bottom: 1px solid #333;
    }

    #title {
        font-weight: bold;
        white-space: nowrap;
    }

    #status {
        flex: 1;
        min-width: 0;
        color: #aaa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #startButton {
        border: 0;
        border-radius: 8px;
        padding: 9px 15px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #startButton:disabled {
        opacity: 0.5;
        cursor: default;
    }

    #terminal-wrap {
        flex: 1;
        min-height: 0;
        padding: 8px;
        background: #000;
    }

    #terminal {
        width: 100%;
        height: 100%;
        background: #000;
    }

    #log {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-height: 180px;
        overflow: auto;
        padding: 10px;
        border-radius: 8px;
        background: rgba(0,0,0,0.88);
        border: 1px solid #444;
        color: #aaa;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        display: none;
        z-index: 100;
    }

    .ok {
        color: #6ee7b7;
    }

    .error {
        color: #f87171;
    }

    .info {
        color: #93c5fd;
    }
</style>
</head>

<body>

<div id="app">

    <div id="topbar">
        <div id="title">Alpine Linux x86-64</div>
        <div id="status">Ready</div>
        <button id="startButton">Start VM</button>
    </div>

    <div id="terminal-wrap">
        <div id="terminal"></div>
    </div>

</div>

<pre id="log"></pre>

<!--
    IMPORTANT:
    All QEMU/Alpine runtime files are now SAME-ORIGIN.
    They are inside /qemu/ on your Cloudflare Pages site.
-->

<script>
"use strict";

/*
 * QEMU-Wasm's generated files expect a global Module object.
 */
window.Module = {
    arguments: [
        "-nographic",
        "-M", "pc",
        "-m", "512M",

        /*
         * Software emulation.
         * This is required because we are emulating x86-64
         * rather than running native WebAssembly instructions.
         */
        "-accel", "tcg,tb-size=500",

        "-L", "/pack-rom/",

        /*
         * Networking is initially disabled here.
         *
         * Once the basic VM boots reliably, we can enable the
         * browser networking layer separately.
         */
        "-nic", "none",

        "-kernel", "/pack-kernel/vmlinuz-virt",

        "-initrd", "/pack-initramfs/initramfs-virt",

        "-append",
        "console=ttyS0 root=/dev/vda noautodetect hostname=browser-vm",

        "-drive",
        "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

        "-device",
        "virtio-blk-pci,drive=test"
    ],

    /*
     * VERY IMPORTANT:
     *
     * Every generated QEMU file is inside /qemu/.
     */
    locateFile: function(path, prefix) {
        return "/qemu/" + path;
    },

    /*
     * Emscripten uses this when starting the generated module.
     */
    mainScriptUrlOrBlob: "/qemu/out.js",

    print: function(text) {
        console.log("[VM]", text);
    },

    printErr: function(text) {
        console.error("[QEMU]", text);
    },

    onAbort: function(reason) {
        showError("QEMU ABORT: " + reason);
    },

    onExit: function(code) {
        setStatus("VM exited with code " + code);
    }
};
</script>

<!--
    These are the generated Alpine filesystem/kernel loaders.
    They are now loaded directly from Cloudflare.
-->
<script src="/qemu/load-rootfs.js"></script>
<script src="/qemu/load-kernel.js"></script>
<script src="/qemu/load-initramfs.js"></script>
<script src="/qemu/load-rom.js"></script>

<!-- Supporting networking stack package -->
<script src="/qemu/dist/stack.js"></script>

<script type="module">

/*
 * xterm provides the visible Linux terminal.
 *
 * These are ONLY terminal UI libraries.
 * QEMU itself and the Alpine disk/kernel files are local
 * under /qemu/.
 */
import "https://unpkg.com/xterm@5.3.0/lib/xterm.js";
import "https://unpkg.com/xterm-pty/index.js";

/*
 * QEMU's generated Emscripten module.
 */
import initEmscriptenModule
    from "/qemu/out.js";


const BASE = "/qemu/";


const statusElement =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");

const terminalElement =
    document.getElementById("terminal");

const logElement =
    document.getElementById("log");


let terminal = null;
let master = null;
let slave = null;
let vmStarted = false;


function setStatus(message) {

    statusElement.textContent = message;

    console.log("[STATUS]", message);
}


function log(message, type = "info") {

    console.log(message);

    logElement.style.display = "block";

    const prefix =
        type === "error"
            ? "✗ "
            : type === "ok"
                ? "✓ "
                : "• ";

    logElement.textContent +=
        prefix + message + "\n";

    logElement.scrollTop =
        logElement.scrollHeight;
}


function showError(message) {

    setStatus("VM failed");

    log(message, "error");

    console.error(message);
}


async function checkFile(path) {

    const url = BASE + path;

    log("Checking " + url);

    const response =
        await fetch(url, {
            method: "HEAD",
            cache: "no-store"
        });

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status +
            " while loading " +
            url
        );
    }

    log(
        "Found " +
        path +
        " (" +
        (response.headers.get("content-length") || "?") +
        " bytes)",
        "ok"
    );
}


/*
 * Check the important files BEFORE attempting to boot QEMU.
 *
 * This makes Cloudflare upload/path problems obvious.
 */
async function checkQemuFiles() {

    setStatus("Checking QEMU files...");

    const files = [

        "qemu-system-x86_64.wasm",

        "qemu-system-x86_64.worker.js",

        "out.js",

        "load-rootfs.js",
        "load-rootfs.data",

        "load-kernel.js",
        "load-kernel.data",

        "load-initramfs.js",
        "load-initramfs.data",

        "load-rom.js",
        "load-rom.data",

        "c2w-net-proxy.wasm.gzip",

        "dist/stack.js",
        "dist/stack-worker.js"
    ];

    for (const file of files) {
        await checkFile(file);
    }

    setStatus("All QEMU files found");

    log(
        "All required QEMU/Alpine files are present.",
        "ok"
    );
}


/*
 * Start the terminal.
 */
function createTerminal() {

    terminal = new Terminal({

        cursorBlink: true,

        convertEol: true,

        fontSize: 14,

        scrollback: 5000,

        theme: {
            background: "#000000",
            foreground: "#ffffff",
            cursor: "#ffffff"
        }
    });

    terminal.open(terminalElement);


    /*
     * Create a pseudo-terminal.
     *
     * QEMU's serial console communicates with this PTY.
     */
    const pty = openpty();

    master = pty.master;
    slave = pty.slave;


    /*
     * Connect xterm to the PTY.
     */
    terminal.loadAddon(master);


    /*
     * Give QEMU its slave side.
     */
    Module.pty = slave;


    /*
     * Prevent QEMU's TTY poll from getting stuck.
     */
    if (
        Module.TTY &&
        Module.TTY.stream_ops &&
        Module.TTY.stream_ops.poll
    ) {

        const oldPoll =
            Module.TTY.stream_ops.poll;

        Module.TTY.stream_ops.poll =
            function(stream, timeout) {

                if (!Module.pty.readable) {

                    return (
                        (Module.pty.readable ? 1 : 0) |
                        (Module.pty.writable ? 4 : 0)
                    );
                }

                return oldPoll.call(
                    this,
                    stream,
                    timeout
                );
            };
    }


    log("Terminal initialized.", "ok");
}


/*
 * Actually start QEMU.
 */
async function startQemu() {

    if (vmStarted) {
        return;
    }

    vmStarted = true;

    startButton.disabled = true;

    try {

        setStatus("Starting x86-64 QEMU...");

        log(
            "Loading QEMU-Wasm x86-64 from /qemu/...",
            "info"
        );


        /*
         * This is the important change from the previous versions:
         *
         * QEMU is loaded from YOUR Cloudflare Pages site.
         */
        const instance =
            await initEmscriptenModule(Module);


        console.log(
            "QEMU instance:",
            instance
        );


        setStatus("Linux VM started");

        log(
            "QEMU-Wasm started successfully.",
            "ok"
        );

        log(
            "Waiting for Alpine Linux to boot...",
            "info"
        );

    } catch (error) {

        console.error(
            "QEMU startup error:",
            error
        );

        showError(
            "QEMU startup failed: " +
            (
                error &&
                error.stack
                    ? error.stack
                    : String(error)
            )
        );

        startButton.disabled = false;

        vmStarted = false;
    }
}


/*
 * Start button.
 */
startButton.addEventListener(
    "click",
    async function() {

        try {

            /*
             * Check browser requirements first.
             */
            if (!window.WebAssembly) {

                throw new Error(
                    "WebAssembly is not supported by this browser."
                );
            }


            if (!window.crossOriginIsolated) {

                throw new Error(
                    "The page is not cross-origin isolated. " +
                    "Check the Cloudflare _headers file."
                );
            }


            if (!window.SharedArrayBuffer) {

                throw new Error(
                    "SharedArrayBuffer is unavailable."
                );
            }


            log(
                "Browser requirements passed.",
                "ok"
            );


            /*
             * Check every uploaded QEMU file.
             */
            await checkQemuFiles();


            /*
             * Create terminal.
             */
            createTerminal();


            /*
             * Finally start QEMU.
             */
            await startQemu();

        } catch (error) {

            console.error(error);

            showError(
                error &&
                error.stack
                    ? error.stack
                    : String(error)
            );

            startButton.disabled = false;
        }
    }
);


/*
 * Initial status.
 */
setStatus("Ready — press Start VM");


</script>

</body>
</html>
