<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>WebPC 2 — Linux x86-64</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#topbar {
    height: 54px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 12px;

    padding:
        8px
        12px;

    background: #111;
    border-bottom: 1px solid #2b2b2b;
}

#title {
    font-weight: 800;
    font-size: 16px;
    white-space: nowrap;
}

#status {
    flex: 1;
    min-width: 0;

    color: #aaa;

    font-size: 13px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#startButton {
    border: 0;
    border-radius: 8px;

    padding:
        9px
        15px;

    background: #2563eb;
    color: white;

    font-weight: 700;
    font-size: 14px;

    cursor: pointer;
}

#startButton:disabled {
    opacity: .5;
}

#terminal {
    flex: 1;
    min-height: 0;

    background: black;

    padding: 8px;
}

#loading {
    position: fixed;
    z-index: 100;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050505;

    padding: 20px;
}

#loadingBox {
    width: min(650px, 94vw);

    padding: 22px;

    background: #111;

    border:
        1px solid
        #333;

    border-radius: 14px;
}

#loadingTitle {
    font-size: 21px;
    font-weight: 800;

    margin-bottom: 10px;
}

#loadingText {
    color: #aaa;

    font-size: 14px;

    line-height: 1.5;
}

#progress {
    width: 100%;
    height: 8px;

    margin-top: 18px;

    background: #292929;

    border-radius: 99px;

    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: #2563eb;

    transition:
        width .2s ease;
}

#error {
    display: none;

    margin-top: 15px;

    padding: 12px;

    background: #2b1010;

    border:
        1px solid
        #702020;

    border-radius: 8px;

    color: #ffb5b5;

    font-family: monospace;
    font-size: 12px;

    line-height: 1.5;

    white-space: pre-wrap;
    word-break: break-word;
}

#retryButton {
    display: none;

    margin-top: 12px;

    border: 0;
    border-radius: 8px;

    padding:
        9px
        15px;

    background: #2563eb;
    color: white;

    font-weight: 700;
}

#debug {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 10px;

    max-height: 35vh;

    overflow: auto;

    display: none;

    z-index: 200;

    padding: 10px;

    background:
        rgba(0,0,0,.9);

    border:
        1px solid
        #333;

    border-radius: 8px;

    color: #ddd;

    font-family: monospace;
    font-size: 11px;

    white-space: pre-wrap;
}

</style>
</head>

<body>

<div id="app">

    <div id="topbar">

        <div id="title">
            WebPC 2
        </div>

        <div id="status">
            Preparing VM…
        </div>

        <button
            id="startButton"
            disabled
        >
            Start VM
        </button>

    </div>

    <div id="terminal"></div>

</div>


<div id="loading">

    <div id="loadingBox">

        <div id="loadingTitle">
            WebPC 2
        </div>

        <div id="loadingText">
            Preparing Linux x86-64…
        </div>

        <div id="progress">

            <div id="progressBar"></div>

        </div>

        <div id="error"></div>

        <button id="retryButton">
            Reload
        </button>

    </div>

</div>


<div id="debug"></div>


<!--
============================================================
IMPORTANT

The upstream QEMU-Wasm demo uses these as classic scripts,
not ES-module imports.

That is important because xterm-pty exposes openpty()
globally.
============================================================
-->

<script
    src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
></script>

<script
    src="https://unpkg.com/xterm-pty/index.js"
></script>


<script>

"use strict";


/*
============================================================
WEBPC 2
QEMU-WASM x86-64

GitHub release:
bowslicegames/Webpc-2
release:
V1
============================================================
*/


const RELEASE =
    "https://github.com/bowslicegames/Webpc-2/releases/download/V1/";


/*
============================================================
FILES
============================================================
*/

const FILES = {

    wasm:
        RELEASE +
        "qemu-system-x86_64.wasm",

    worker:
        RELEASE +
        "qemu-system-x86_64.worker.js",

    out:
        RELEASE +
        "out.js",

    rootfsJS:
        RELEASE +
        "load-rootfs.js",

    rootfsData:
        RELEASE +
        "load-rootfs.data",

    kernelJS:
        RELEASE +
        "load-kernel.js",

    kernelData:
        RELEASE +
        "load-kernel.data",

    initramfsJS:
        RELEASE +
        "load-initramfs.js",

    initramfsData:
        RELEASE +
        "load-initramfs.data",

    romJS:
        RELEASE +
        "load-rom.js",

    romData:
        RELEASE +
        "load-rom.data",

    worker:
        RELEASE +
        "qemu-system-x86_64.worker.js"

};


/*
============================================================
ELEMENTS
============================================================
*/

const statusElement =
    document.getElementById(
        "status"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const terminalElement =
    document.getElementById(
        "terminal"
    );

const loadingElement =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const errorElement =
    document.getElementById(
        "error"
    );

const retryButton =
    document.getElementById(
        "retryButton"
    );

const debugElement =
    document.getElementById(
        "debug"
    );


/*
============================================================
DEBUG
============================================================
*/

function debug(message) {

    console.log(
        "[WebPC 2]",
        message
    );

    debugElement.style.display =
        "block";

    debugElement.textContent +=
        message +
        "\n";

}


function status(message) {

    statusElement.textContent =
        message;

    loadingText.textContent =
        message;

    debug(message);

}


function progress(value) {

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        ) +
        "%";

}


/*
============================================================
ERROR
============================================================
*/

function fail(error) {

    console.error(
        "[WebPC 2]",
        error
    );

    let message;

    if (
        error &&
        error.stack
    ) {

        message =
            error.stack;

    } else if (
        error &&
        error.message
    ) {

        message =
            error.message;

    } else {

        message =
            String(error);

    }

    errorElement.style.display =
        "block";

    errorElement.textContent =
        message;

    retryButton.style.display =
        "inline-block";

    startButton.disabled =
        false;

    status(
        "VM failed to start."
    );

}


/*
============================================================
BROWSER CHECK
============================================================
*/

function checkBrowser() {

    status(
        "Checking browser…"
    );

    if (
        !window.WebAssembly
    ) {

        throw new Error(
            "WebAssembly is not supported."
        );

    }

    if (
        !window.SharedArrayBuffer
    ) {

        throw new Error(
            "SharedArrayBuffer is unavailable.\n\n" +
            "Make sure Cloudflare Pages is sending:\n\n" +
            "Cross-Origin-Opener-Policy: same-origin\n" +
            "Cross-Origin-Embedder-Policy: require-corp"
        );

    }

    if (
        !window.crossOriginIsolated
    ) {

        throw new Error(
            "crossOriginIsolated is false.\n\n" +
            "The Cloudflare Pages _headers configuration " +
            "is not being applied."
        );

    }

    debug(
        "WebAssembly: OK"
    );

    debug(
        "SharedArrayBuffer: OK"
    );

    debug(
        "crossOriginIsolated: OK"
    );

}


/*
============================================================
VERIFY GITHUB RELEASE FILE
============================================================
*/

async function checkFile(
    url,
    name
) {

    status(
        "Checking " +
        name +
        "…"
    );

    const response =
        await fetch(
            url,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );

    if (
        !response.ok
    ) {

        throw new Error(
            name +
            " failed to download.\n\n" +
            "HTTP " +
            response.status +
            " " +
            response.statusText +
            "\n\n" +
            url
        );

    }

    const data =
        await response.arrayBuffer();

    if (
        data.byteLength === 0
    ) {

        throw new Error(
            name +
            " downloaded as an empty file."
        );

    }

    debug(
        name +
        ": " +
        (
            data.byteLength /
            1024 /
            1024
        ).toFixed(2) +
        " MB"
    );

    return data;

}


/*
============================================================
DOWNLOAD QEMU WASM
============================================================
*/

async function downloadWasm() {

    status(
        "Downloading QEMU x86-64 WebAssembly…"
    );

    progress(8);

    const data =
        await checkFile(
            FILES.wasm,
            "qemu-system-x86_64.wasm"
        );

    const header =
        new Uint8Array(
            data.slice(
                0,
                4
            )
        );

    if (
        header[0] !== 0x00 ||
        header[1] !== 0x61 ||
        header[2] !== 0x73 ||
        header[3] !== 0x6d
    ) {

        throw new Error(
            "qemu-system-x86_64.wasm " +
            "does not contain a valid WebAssembly file."
        );

    }

    debug(
        "WASM magic header: OK"
    );

    progress(25);

    status(
        "Compiling QEMU WebAssembly…"
    );

    try {

        await WebAssembly.compile(
            data
        );

    } catch (error) {

        throw new Error(
            "The QEMU WebAssembly file downloaded " +
            "successfully but could not be compiled.\n\n" +
            error
        );

    }

    debug(
        "WASM compilation: OK"
    );

    return data;

}


/*
============================================================
CREATE TERMINAL
============================================================

THIS IS THE IMPORTANT FIX.

The upstream demo loads xterm-pty as a CLASSIC script,
which creates the global openpty() function.

We therefore use:

    window.Terminal
    window.openpty

instead of trying to import openpty as an ES module.
============================================================
*/

let terminal = null;
let master = null;
let slave = null;


function createTerminal() {

    status(
        "Creating terminal…"
    );


    if (
        typeof window.Terminal !==
        "function"
    ) {

        throw new Error(
            "xterm loaded, but window.Terminal " +
            "was not found."
        );

    }


    if (
        typeof window.openpty !==
        "function"
    ) {

        throw new Error(
            "xterm-pty loaded, but openpty() " +
            "was not found.\n\n" +

            "The browser loaded xterm-pty but " +
            "did not expose its PTY API."
        );

    }


    terminal =
        new window.Terminal({

            cursorBlink:
                true,

            convertEol:
                true,

            scrollback:
                5000,

            fontSize:
                14,

            theme: {

                background:
                    "#000000",

                foreground:
                    "#ffffff",

                cursor:
                    "#ffffff"

            }

        });


    terminal.open(
        terminalElement
    );


    /*
     EXACTLY the PTY arrangement used by
     the upstream QEMU-Wasm demo.
    */

    const pty =
        window.openpty();


    master =
        pty.master;

    slave =
        pty.slave;


    terminal.loadAddon(
        master
    );


    debug(
        "PTY master created."
    );

    debug(
        "PTY slave created."
    );

    debug(
        "xterm connected to PTY."
    );


    /*
     Resize the terminal.
    */

    try {

        terminal.resize(
            Math.max(
                40,
                Math.floor(
                    terminalElement.clientWidth /
                    8.5
                )
            ),

            Math.max(
                10,
                Math.floor(
                    terminalElement.clientHeight /
                    17
                )
            )
        );

    } catch (_) {}


}


/*
============================================================
GLOBAL MODULE
============================================================

This MUST exist before the Emscripten package loaders
are executed.
============================================================
*/

const Module = {

    /*
     QEMU arguments copied from the upstream
     Alpine x86-64 QEMU-Wasm configuration.
    */

    arguments: [

        "-nographic",

        "-M",
        "pc",

        "-m",
        "512M",

        "-accel",
        "tcg,tb-size=500",

        "-L",
        "/pack-rom/",

        "-nic",
        "none",

        "-kernel",
        "/pack-kernel/vmlinuz-virt",

        "-initrd",
        "/pack-initramfs/initramfs-virt",

        "-append",
        "console=ttyS0 " +
        "root=/dev/vda " +
        "noautodetect " +
        "hostname=webpc",

        "-drive",
        "id=test," +
        "file=/pack-rootfs/disk-rootfs.img," +
        "format=raw," +
        "if=none",

        "-device",
        "virtio-blk-pci,drive=test"

    ],


    /*
     CRITICAL:

     The generated package loaders call
     Module.locateFile("load-rootfs.data", ...)
     etc.

     Therefore every generated data file is mapped
     directly to your GitHub Release.
    */

    locateFile:
        function(
            path,
            prefix
        ) {

            if (
                path ===
                "qemu-system-x86_64.wasm"
            ) {

                return FILES.wasm;

            }


            if (
                path ===
                "qemu-system-x86_64.worker.js"
            ) {

                return FILES.worker;

            }


            if (
                path ===
                "load-rootfs.data"
            ) {

                return FILES.rootfsData;

            }


            if (
                path ===
                "load-kernel.data"
            ) {

                return FILES.kernelData;

            }


            if (
                path ===
                "load-initramfs.data"
            ) {

                return FILES.initramfsData;

            }


            if (
                path ===
                "load-rom.data"
            ) {

                return FILES.romData;

            }


            return (
                RELEASE +
                path
            );

        },


    /*
     The upstream runtime uses this value when
     locating its main script / pthread runtime.
    */

    mainScriptUrlOrBlob:
        FILES.out,


    /*
     PTY supplied to QEMU.
    */

    pty:
        null,


    /*
     We provide the WASM binary ourselves.
    */

    wasmBinary:
        null,


    /*
     Diagnostics.
    */

    print:
        function(text) {

            console.log(
                "[QEMU]",
                text
            );

            if (
                terminal
            ) {

                terminal.write(
                    String(text) +
                    "\r\n"
                );

            }

        },


    printErr:
        function(text) {

            console.error(
                "[QEMU ERROR]",
                text
            );

            if (
                terminal
            ) {

                terminal.write(
                    "\r\n" +
                    "\x1b[31m" +
                    String(text) +
                    "\x1b[0m\r\n"
                );

            }

        },


    onAbort:
        function(reason) {

            debug(
                "QEMU ABORT: " +
                String(reason)
            );

        },


    onExit:
        function(code) {

            debug(
                "QEMU EXIT: " +
                String(code)
            );

        }

};


/*
============================================================
LOAD CLASSIC PACKAGE SCRIPT
============================================================

The generated load-*.js files are classic Emscripten
file-package loaders.

They need the global Module object.
============================================================
*/

function loadClassicScript(
    url,
    name
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            status(
                "Loading " +
                name +
                "…"
            );

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                url;


            script.async =
                false;


            script.onload =
                () => {

                    debug(
                        name +
                        " loaded."
                    );

                    resolve();

                };


            script.onerror =
                () => {

                    reject(
                        new Error(
                            name +
                            " failed to load.\n\n" +
                            url
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/*
============================================================
LOAD PACKAGE LOADERS
============================================================
*/

async function loadPackageScripts() {

    /*
     Module must already exist before these scripts run.
    */

    await loadClassicScript(
        FILES.rootfsJS,
        "root filesystem loader"
    );

    progress(35);


    await loadClassicScript(
        FILES.kernelJS,
        "Linux kernel loader"
    );

    progress(45);


    await loadClassicScript(
        FILES.initramfsJS,
        "initramfs loader"
    );

    progress(55);


    await loadClassicScript(
        FILES.romJS,
        "ROM loader"
    );

    progress(65);


    debug(
        "All four Emscripten package loaders loaded."
    );

}


/*
============================================================
LOAD out.js
============================================================

out.js is an ES module.

We download it from your GitHub Release and create
a Blob URL so that the browser can import it.

The QEMU runtime itself is still told that its actual
main script URL is the GitHub Release URL.
============================================================
*/

async function loadQemuRuntime() {

    status(
        "Downloading QEMU JavaScript runtime…"
    );

    progress(70);


    const response =
        await fetch(
            FILES.out,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "out.js failed to download.\n\n" +
            "HTTP " +
            response.status +
            " " +
            response.statusText +
            "\n\n" +
            FILES.out
        );

    }


    const source =
        await response.text();


    if (
        !source.includes(
            "WebAssembly"
        )
    ) {

        throw new Error(
            "The downloaded out.js does not " +
            "appear to be the QEMU Emscripten runtime."
        );

    }


    debug(
        "out.js downloaded successfully."
    );


    const blob =
        new Blob(
            [source],
            {
                type:
                    "text/javascript"
            }
        );


    return URL.createObjectURL(
        blob
    );

}


/*
============================================================
START QEMU
============================================================
*/

async function startQemu(
    wasm,
    runtimeURL
) {

    status(
        "Starting x86-64 QEMU…"
    );

    progress(80);


    /*
     Give QEMU the already-downloaded WASM.
    */

    Module.wasmBinary =
        wasm;


    /*
     Give QEMU its PTY.
    */

    Module.pty =
        slave;


    /*
     Import generated Emscripten runtime.
    */

    debug(
        "Importing out.js…"
    );


    const imported =
        await import(
            runtimeURL
        );


    const factory =
        imported.default ||
        imported;


    if (
        typeof factory !==
        "function"
    ) {

        throw new Error(
            "out.js loaded, but the Emscripten " +
            "module factory was not found."
        );

    }


    debug(
        "Emscripten factory found."
    );


    status(
        "Launching Linux x86-64…"
    );


    progress(88);


    /*
     Start the VM.
    */

    const instance =
        await factory(
            Module
        );


    debug(
        "QEMU Emscripten module started."
    );


    /*
     The upstream demo replaces the default TTY poll
     implementation with a PTY-aware implementation.

     This prevents the terminal from getting stuck
     waiting for normal browser TTY input.
    */

    try {

        if (
            Module.TTY &&
            Module.TTY.stream_ops &&
            Module.TTY.stream_ops.poll &&
            Module.pty
        ) {

            const oldPoll =
                Module
                    .TTY
                    .stream_ops
                    .poll;


            const pty =
                Module.pty;


            Module.TTY.stream_ops.poll =
                function(
                    stream,
                    timeout
                ) {

                    if (
                        !pty.readable
                    ) {

                        return (
                            (pty.readable ? 1 : 0) |
                            (pty.writable ? 4 : 0)
                        );

                    }


                    return oldPoll.call(
                        this,
                        stream,
                        timeout
                    );

                };

        }

    } catch (error) {

        debug(
            "TTY poll adjustment warning: " +
            error
        );

    }


    progress(100);


    status(
        "Linux x86-64 VM running"
    );


    loadingElement.style.display =
        "none";


    startButton.disabled =
        true;


    return instance;

}


/*
============================================================
BOOT
============================================================
*/

let started =
    false;


async function boot() {

    if (
        started
    ) {

        return;

    }


    started =
        true;


    startButton.disabled =
        true;


    errorElement.style.display =
        "none";


    retryButton.style.display =
        "none";


    debugElement.textContent =
        "";


    try {

        progress(0);


        /*
         1. Browser requirements
        */

        checkBrowser();


        /*
         2. Verify the terminal libraries.
        */

        status(
            "Checking terminal libraries…"
        );


        if (
            typeof window.Terminal !==
            "function"
        ) {

            throw new Error(
                "xterm did not load correctly."
            );

        }


        if (
            typeof window.openpty !==
            "function"
        ) {

            throw new Error(
                "xterm-pty did not expose openpty()."
            );

        }


        debug(
            "Terminal libraries: OK"
        );


        /*
         3. Create terminal/PTY.
        */

        createTerminal();


        progress(5);


        /*
         4. Download QEMU WASM.
        */

        const wasm =
            await downloadWasm();


        /*
         5. Load Emscripten package loaders.

         These then download:
           load-rootfs.data
           load-kernel.data
           load-initramfs.data
           load-rom.data

         from your GitHub Release.
        */

        await loadPackageScripts();


        /*
         6. Download QEMU out.js.
        */

        const runtimeURL =
            await loadQemuRuntime();


        /*
         7. Start VM.
        */

        await startQemu(
            wasm,
            runtimeURL
        );


    } catch (error) {

        fail(
            error
        );

    }

}


/*
============================================================
BUTTON
============================================================
*/

startButton.addEventListener(
    "click",
    () => {

        boot();

    }
);


retryButton.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/*
============================================================
INITIALISE
============================================================
*/

window.addEventListener(
    "load",
    () => {

        /*
         Small delay lets the external terminal
         scripts finish initialising.
        */

        setTimeout(
            () => {

                try {

                    checkBrowser();

                    startButton.disabled =
                        false;

                    status(
                        "Ready — start Linux x86-64."
                    );

                } catch (error) {

                    fail(
                        error
                    );

                }

            },
            500
        );

    }
);

</script>

</body>
</html>
