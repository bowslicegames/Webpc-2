<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<title>WebPC 2 — Alpine Linux x86-64</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
}

body {
  overscroll-behavior: none;
}

#app {
  width: 100%;
  height: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  background: #000;
}

#topbar {
  flex: 0 0 50px;

  display: flex;
  align-items: center;

  gap: 12px;
  padding: 0 14px;

  background: #111;
  border-bottom: 1px solid #333;

  overflow: hidden;
}

#title {
  font-weight: 800;
  white-space: nowrap;
}

#status {
  flex: 1;
  min-width: 0;

  color: #aaa;
  font-size: 13px;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#terminal-wrap {
  position: relative;

  flex: 1;
  min-height: 0;

  background: #000;

  padding: 8px;
}

#terminal {
  width: 100%;
  height: 100%;
}

#terminal .xterm {
  width: 100%;
  height: 100%;
}

#terminal .xterm-viewport {
  overflow-y: auto !important;
}

#bottom {
  flex: 0 0 auto;

  display: flex;
  align-items: center;

  gap: 7px;
  padding:
    7px
    max(7px, env(safe-area-inset-right))
    max(7px, env(safe-area-inset-bottom))
    max(7px, env(safe-area-inset-left));

  background: #111;
  border-top: 1px solid #333;
}

#command {
  flex: 1;
  min-width: 0;

  height: 42px;

  border:
    1px solid #555;

  border-radius: 7px;

  background: #080808;
  color: #fff;

  padding: 0 12px;

  outline: none;

  font:
    14px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}

#command:focus {
  border-color: #aaa;
}

button {
  flex: 0 0 auto;

  height: 42px;

  padding: 0 13px;

  border: 1px solid #555;
  border-radius: 7px;

  background: #222;
  color: #fff;

  font-weight: 700;

  touch-action: manipulation;
}

button:active {
  background: #444;
}

#boot-log {
  position: absolute;

  left: 18px;
  right: 18px;
  top: 18px;

  z-index: 10;

  padding: 12px;

  border: 1px solid #333;
  border-radius: 8px;

  background: rgba(0, 0, 0, 0.92);

  color: #ddd;

  font:
    12px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  white-space: pre-wrap;
  word-break: break-word;

  pointer-events: none;
}

#boot-log.hidden {
  display: none;
}

.error {
  color: #ff6b6b;
}

.success {
  color: #8cff8c;
}

.warning {
  color: #ffd166;
}
</style>

<!--
  xterm.js CSS.

  This is loaded with CORS-compatible stylesheet loading.
-->
<link
  rel="stylesheet"
  href="https://unpkg.com/@xterm/xterm@5.3.0/css/xterm.css"
  crossorigin="anonymous"
>

</head>

<body>

<div id="app">

  <div id="topbar">

    <div id="title">
      WebPC 2
    </div>

    <div id="status">
      Preparing Alpine Linux x86-64…
    </div>

  </div>


  <div id="terminal-wrap">

    <div id="terminal"></div>

    <div id="boot-log">
      Starting WebPC 2…
    </div>

  </div>


  <div id="bottom">

    <input
      id="command"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="send"
      placeholder="Type a Linux command…"
    >

    <button id="send">
      Send
    </button>

    <button id="ctrlc">
      Ctrl+C
    </button>

    <button id="clear">
      Clear
    </button>

  </div>

</div>


<script type="module">

/*
============================================================
 WEBPC 2
 ALPINE LINUX x86-64
============================================================

Direct GitHub Release architecture:

    Cloudflare Pages
          |
          v
      this page
          |
          v
 GitHub Release V1
          |
          v
      QEMU-Wasm
          |
          v
 Alpine Linux x86-64

NO CLOUDFLARE WORKER IS USED.

The repository is now public, so browser fetches can use
the GitHub release URLs directly.

Minecraft is intentionally NOT started yet.

The first milestone is:

    QEMU boots
       ->
    Alpine Linux boots
       ->
    Linux shell accepts commands

============================================================
*/


/*
------------------------------------------------------------
 IMPORT REAL TERMINAL + REAL PTY
------------------------------------------------------------

The QEMU build was compiled with xterm-pty's Emscripten
integration.

We therefore use:

    Terminal
       |
       v
    PTY master
       |
       v
    PTY slave
       |
       v
    Emscripten/QEMU

This is NOT a fake terminal.
------------------------------------------------------------
*/

import {
  Terminal
} from
  "https://unpkg.com/@xterm/xterm@5.3.0/lib/xterm.js";

import {
  openpty
} from
  "https://unpkg.com/xterm-pty@0.12.0/index.mjs";


/*
------------------------------------------------------------
 GITHUB RELEASE
------------------------------------------------------------
*/

const BASE =
  "https://github.com/bowslicegames/Webpc-2/releases/download/V1/";


/*
------------------------------------------------------------
 EXACT RELEASE ASSETS
------------------------------------------------------------
*/

const FILES = {

  wasm:
    BASE +
    "qemu-system-x86_64.wasm",

  worker:
    BASE +
    "qemu-system-x86_64.worker.js",

  stack:
    BASE +
    "stack.js",

  stackWorker:
    BASE +
    "stack-worker.js",

  out:
    BASE +
    "out.js",

  rom:
    BASE +
    "load-rom.js",

  romData:
    BASE +
    "load-rom.data",

  kernel:
    BASE +
    "load-kernel.js",

  kernelData:
    BASE +
    "load-kernel.data",

  initramfs:
    BASE +
    "load-initramfs.js",

  initramfsData:
    BASE +
    "load-initramfs.data",

  rootfs:
    BASE +
    "load-rootfs.js",

  rootfsData:
    BASE +
    "load-rootfs.data",

  netProxy:
    BASE +
    "c2w-net-proxy.wasm.gzip"

};


/*
------------------------------------------------------------
 DOM
------------------------------------------------------------
*/

const terminalElement =
  document.getElementById(
    "terminal"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const commandElement =
  document.getElementById(
    "command"
  );

const sendButton =
  document.getElementById(
    "send"
  );

const ctrlCButton =
  document.getElementById(
    "ctrlc"
  );

const clearButton =
  document.getElementById(
    "clear"
  );

const bootLog =
  document.getElementById(
    "boot-log"
  );


/*
------------------------------------------------------------
 STATE
------------------------------------------------------------
*/

let terminal = null;

let master = null;

let slave = null;

let qemu = null;

let bootStarted = false;


/*
------------------------------------------------------------
 BOOT LOG
------------------------------------------------------------
*/

function log(message) {

  bootLog.textContent +=
    String(message) +
    "\n";

}


function setBootLog(message) {

  bootLog.textContent =
    String(message);

}


function hideBootLog() {

  bootLog.classList.add(
    "hidden"
  );

}


function showError(message) {

  bootLog.classList.remove(
    "hidden"
  );

  bootLog.classList.add(
    "error"
  );

  bootLog.textContent =
    String(message);

}


/*
------------------------------------------------------------
 STATUS
------------------------------------------------------------
*/

function status(message) {

  statusElement.textContent =
    String(message);

}


/*
------------------------------------------------------------
 BROWSER DIAGNOSTICS
------------------------------------------------------------
*/

function checkBrowser() {

  log(
    "WebPC 2 — Alpine Linux x86-64"
  );

  log(
    "QEMU-Wasm browser VM"
  );

  log("");

  log(
    "Browser diagnostics"
  );

  log(
    "-------------------"
  );

  log(
    "crossOriginIsolated: " +
    String(
      window.crossOriginIsolated
    )
  );

  log(
    "SharedArrayBuffer: " +
    String(
      typeof SharedArrayBuffer !==
      "undefined"
    )
  );

  log(
    "WebAssembly: " +
    String(
      typeof WebAssembly !==
      "undefined"
    )
  );

  log(
    "navigator.hardwareConcurrency: " +
    String(
      navigator.hardwareConcurrency ||
      "unknown"
    )
  );

  log("");

  if (
    !window.crossOriginIsolated
  ) {

    throw new Error(
      "crossOriginIsolated is FALSE.\n\n" +
      "Cloudflare Pages must send:\n\n" +
      "Cross-Origin-Opener-Policy: same-origin\n" +
      "Cross-Origin-Embedder-Policy: require-corp"
    );

  }

  if (
    typeof SharedArrayBuffer ===
    "undefined"
  ) {

    throw new Error(
      "SharedArrayBuffer is unavailable."
    );

  }

  if (
    typeof WebAssembly ===
    "undefined"
  ) {

    throw new Error(
      "WebAssembly is unavailable."
    );

  }

}


/*
------------------------------------------------------------
 HTTP CHECK
------------------------------------------------------------

This checks the actual public GitHub asset before trying to
start QEMU.

We use a small request first so a bad release URL produces
a clear error instead of a mysterious Emscripten failure.
------------------------------------------------------------
*/

async function checkAsset(
  name,
  url
) {

  status(
    "Checking " +
    name +
    "…"
  );

  log(
    "Checking: " +
    name
  );

  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      name +
      " returned HTTP " +
      response.status +
      "\n\n" +
      url
    );

  }

  log(
    "  OK — HTTP " +
    response.status
  );

  const contentLength =
    response.headers.get(
      "content-length"
    );

  if (contentLength) {

    const megabytes =
      Number(contentLength) /
      1024 /
      1024;

    log(
      "  Size: " +
      megabytes.toFixed(1) +
      " MiB"
    );

  }

  log("");

}


/*
------------------------------------------------------------
 DOWNLOAD WASM
------------------------------------------------------------
*/

async function downloadWasm() {

  status(
    "Downloading QEMU x86-64…"
  );

  log(
    "Downloading qemu-system-x86_64.wasm…"
  );

  const response =
    await fetch(
      FILES.wasm,
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "QEMU WebAssembly download failed.\n\n" +
      "HTTP " +
      response.status +
      "\n\n" +
      FILES.wasm
    );

  }

  const buffer =
    await response.arrayBuffer();

  log(
    "QEMU WASM downloaded: " +
    (
      buffer.byteLength /
      1024 /
      1024
    ).toFixed(1) +
    " MiB"
  );

  log("");

  return buffer;

}


/*
------------------------------------------------------------
 LOAD A GENERATED SCRIPT
------------------------------------------------------------

The Emscripten file-packager outputs are JavaScript files
that populate the virtual filesystem.

They must run after Module is configured.
------------------------------------------------------------
*/

function loadScript(
  url,
  name
) {

  return new Promise(
    (resolve, reject) => {

      log(
        "Loading " +
        name +
        "…"
      );

      const script =
        document.createElement(
          "script"
        );

      script.src =
        url;

      /*
       * Important for Cloudflare COEP.
       *
       * The GitHub asset must be fetched as a CORS
       * resource rather than as an opaque cross-origin
       * script.
       */
      script.crossOrigin =
        "anonymous";

      script.async =
        false;

      script.onload =
        () => {

          log(
            "  " +
            name +
            " loaded."
          );

          resolve();

        };

      script.onerror =
        () => {

          reject(
            new Error(
              "Failed to load " +
              name +
              "\n\n" +
              url
            )
          );

        };

      document.head.appendChild(
        script
      );

    }
  );

}


/*
------------------------------------------------------------
 CREATE XTERM
------------------------------------------------------------
*/

function createTerminal() {

  terminal =
    new Terminal({

      cols: 100,

      rows: 30,

      convertEol: true,

      cursorBlink: true,

      scrollback: 5000,

      fontSize: 14,

      fontFamily:
        "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace",

      theme: {

        background:
          "#000000",

        foreground:
          "#ffffff",

        cursor:
          "#ffffff"

      },

      allowTransparency:
        false

    });


  terminal.open(
    terminalElement
  );


  /*
   * xterm automatically forwards keyboard input through
   * the PTY master once the addon is attached.
   */

}


/*
------------------------------------------------------------
 CONNECT TERMINAL TO PTY
------------------------------------------------------------
*/

function createPTY() {

  if (!terminal) {

    throw new Error(
      "Terminal has not been created."
    );

  }


  const pair =
    openpty();


  master =
    pair.master;

  slave =
    pair.slave;


  /*
   * Connect PTY master to xterm.js.
   */

  terminal.loadAddon(
    master
  );


  /*
   * Give the terminal focus.
   */

  terminal.focus();


  log(
    "PTY created."
  );

  log(
    "Terminal connected to QEMU."
  );

  log("");

}


/*
------------------------------------------------------------
 QEMU ARGUMENTS
------------------------------------------------------------

These are the arguments used by the QEMU-Wasm Alpine x86-64
browser demo.

They boot:

    Linux kernel
        +
    Alpine initramfs
        +
    packaged root filesystem
        +
    packaged PC BIOS/ROM

Serial console:

    ttyS0

Root disk:

    /dev/vda
------------------------------------------------------------
*/

function createQemuModule(
  wasm
) {

  const Module = {

    arguments: [

      "-nographic",

      "-M",
      "pc",

      "-m",
      "512M",

      "-accel",
      "tcg,tb-size=500",

      "-L",
      "/pack-rom/",

      "-nic",
      "none",

      "-kernel",
      "/pack-kernel/vmlinuz-virt",

      "-initrd",
      "/pack-initramfs/initramfs-virt",

      "-append",
      "console=ttyS0 root=/dev/vda noautodetect hostname=webpc",

      "-drive",
      "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

      "-device",
      "virtio-blk-pci,drive=test"

    ],


    /*
     * CRITICAL:
     *
     * The xterm-pty slave is what the QEMU Emscripten build
     * expects for terminal input/output.
     */

    pty:
      slave,


    /*
     * We already downloaded the WASM ourselves.
     *
     * This avoids a second WASM download.
     */

    wasmBinary:
      wasm,


    /*
     * PThread / worker runtime.
     *
     * out.js is an ES module, so this identifies the
     * location of the main generated script.
     */

    mainScriptUrlOrBlob:
      FILES.out,


    /*
     * Every generated Emscripten asset is located through
     * the public GitHub release.
     *
     * This is particularly important for:
     *
     *   *.data
     *   worker JS
     *   QEMU wasm
     */

    locateFile(
      path,
      prefix
    ) {

      /*
       * If Emscripten asks for one of our release files,
       * return its exact public GitHub URL.
       */

      const filename =
        String(path)
          .split("/")
          .pop();


      const known =
        Object.values(
          FILES
        ).find(
          url =>
            url.endsWith(
              "/" +
              filename
            )
        );


      if (known) {

        return known;

      }


      /*
       * Fallback.
       */

      return (
        BASE +
        filename
      );

    },


    /*
     * Emscripten stdout.
     */

    print(text) {

      if (terminal) {

        terminal.write(
          String(text) +
          "\r\n"
        );

      }

    },


    /*
     * Emscripten stderr.
     */

    printErr(text) {

      if (terminal) {

        terminal.write(
          "\r\n\x1b[33m[QEMU] " +
          String(text) +
          "\x1b[0m\r\n"
        );

      }

    },


    /*
     * Progress.
     */

    setStatus(text) {

      if (text) {

        status(
          String(text)
        );

      }

    },


    /*
     * Abort handler.
     */

    onAbort(reason) {

      console.error(
        "QEMU aborted:",
        reason
      );

      showError(
        "QEMU ABORTED\n\n" +
        String(reason)
      );

    }

  };


  /*
   * Expose it globally because the generated package
   * loaders and Emscripten runtime expect Module.
   */

  window.Module =
    Module;


  return Module;

}


/*
------------------------------------------------------------
 START QEMU
------------------------------------------------------------
*/

async function startQemu(
  wasm
) {

  status(
    "Preparing QEMU…"
  );

  log(
    "Creating QEMU Emscripten Module…"
  );


  const Module =
    createQemuModule(
      wasm
    );


  /*
   * Load the Emscripten package files.
   *
   * These populate:
   *
   *   /pack-rom/
   *   /pack-kernel/
   *   /pack-initramfs/
   *   /pack-rootfs/
   *
   * before QEMU starts.
   */

  status(
    "Loading Alpine Linux files…"
  );

  log("");

  await loadScript(
    FILES.rom,
    "ROM package"
  );

  await loadScript(
    FILES.kernel,
    "kernel package"
  );

  await loadScript(
    FILES.initramfs,
    "initramfs package"
  );

  await loadScript(
    FILES.rootfs,
    "rootfs package"
  );


  log("");

  log(
    "All Alpine Linux packages loaded."
  );

  log("");


  /*
   * Import the generated Emscripten factory.
   */

  status(
    "Starting QEMU x86-64…"
  );

  log(
    "Loading QEMU Emscripten runtime…"
  );


  const qemuModule =
    await import(
      FILES.out
    );


  if (
    !qemuModule ||
    typeof qemuModule.default !==
    "function"
  ) {

    throw new Error(
      "out.js loaded, but its Emscripten " +
      "factory was not found."
    );

  }


  log(
    "QEMU runtime loaded."
  );

  log(
    "Starting x86-64 virtual machine…"
  );

  log("");


  /*
   * Start the VM.
   */

  qemu =
    await qemuModule.default(
      Module
    );


  /*
   * If we reach this point, the Emscripten factory
   * successfully initialized.
   */

  status(
    "Alpine Linux x86-64 running"
  );


  bootLog.classList.remove(
    "error"
  );

  bootLog.classList.add(
    "success"
  );


  bootLog.textContent =
    "Alpine Linux x86-64 is running.\n\n" +
    "The terminal below is connected directly to the VM.\n\n" +
    "Try:\n" +
    "  uname -a\n" +
    "  ls\n" +
    "  free -h\n";


  /*
   * Give the terminal a moment to receive the initial
   * kernel output, then hide the overlay.
   */

  setTimeout(
    hideBootLog,
    2500
  );


  terminal.focus();

}


/*
------------------------------------------------------------
 MAIN BOOT SEQUENCE
------------------------------------------------------------
*/

async function boot() {

  if (bootStarted) {

    return;

  }

  bootStarted =
    true;


  try {

    /*
     * 1. Browser requirements
     */

    status(
      "Checking browser…"
    );

    checkBrowser();


    /*
     * 2. Create terminal
     */

    status(
      "Creating terminal…"
    );

    createTerminal();


    /*
     * 3. Create real PTY
     */

    createPTY();


    /*
     * 4. Verify public QEMU asset
     */

    await checkAsset(
      "QEMU x86-64 WebAssembly",
      FILES.wasm
    );


    /*
     * 5. Download QEMU
     */

    const wasm =
      await downloadWasm();


    /*
     * 6. Start Linux
     */

    await startQemu(
      wasm
    );


  } catch (error) {

    console.error(
      "WebPC 2 startup error:",
      error
    );


    status(
      "Startup failed"
    );


    showError(
      "WEBPC 2 STARTUP ERROR\n\n" +
      (
        error?.stack ||
        error?.message ||
        String(error)
      )
    );


    /*
     * Keep the error visible in the browser console too.
     */

    console.error(
      error
    );

  }

}


/*
------------------------------------------------------------
 COMMAND BOX
------------------------------------------------------------
*/

function sendCommand() {

  if (!slave) {

    return;

  }


  const value =
    commandElement.value;


  if (!value) {

    return;

  }


  /*
   * Send through the actual PTY slave.
   *
   * xterm-pty's Emscripten integration reads from the slave
   * through the patched Emscripten TTY layer.
   */

  try {

    slave.write(
      value +
      "\r"
    );

  } catch (error) {

    console.error(
      "PTY input error:",
      error
    );

  }


  commandElement.value =
    "";

  commandElement.focus();

}


sendButton.addEventListener(
  "click",
  sendCommand
);


commandElement.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendCommand();

    }

  }
);


/*
------------------------------------------------------------
 CTRL+C
------------------------------------------------------------
*/

ctrlCButton.addEventListener(
  "click",
  () => {

    if (!slave) {

      return;

    }


    try {

      slave.write(
        "\x03"
      );

    } catch (error) {

      console.error(
        error
      );

    }


    if (terminal) {

      terminal.focus();

    }

  }
);


/*
------------------------------------------------------------
 CLEAR
------------------------------------------------------------
*/

clearButton.addEventListener(
  "click",
  () => {

    if (terminal) {

      terminal.clear();

    }

  }
);


/*
------------------------------------------------------------
 TERMINAL RESIZE
------------------------------------------------------------
*/

window.addEventListener(
  "resize",
  () => {

    if (!terminal) {

      return;

    }

    /*
     * xterm itself handles the visual resize.
     *
     * The VM can continue using its initial PTY size for
     * this first Linux boot milestone.
     */

    terminal.refresh(
      0,
      terminal.rows - 1
    );

  }
);


/*
------------------------------------------------------------
 START
------------------------------------------------------------
*/

window.addEventListener(
  "load",
  () => {

    boot();

  }
);

</script>

</body>
</html>
