<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WebPC 2 — Linux x86-64</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#topbar {
    height: 54px;
    flex: 0 0 54px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #111;
    border-bottom: 1px solid #292929;
}

#title {
    font-weight: 700;
    white-space: nowrap;
}

#status {
    flex: 1;
    min-width: 0;
    color: #aaa;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 9px 14px;
    background: #2563eb;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: default;
}

#terminal {
    flex: 1;
    min-height: 0;
    padding: 8px;
    background: #000;
}

#log {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;
    max-height: 35%;
    overflow: auto;
    padding: 10px;
    background: rgba(0,0,0,.88);
    border: 1px solid #333;
    border-radius: 8px;
    color: #ddd;
    font: 12px/1.45 monospace;
    white-space: pre-wrap;
    z-index: 20;
    display: none;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    padding: 25px;
}

#loadingBox {
    width: min(620px, 94vw);
    background: #111;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 20px;
}

#loadingTitle {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
}

#loadingText {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
}

#progress {
    margin-top: 15px;
    height: 8px;
    border-radius: 99px;
    background: #292929;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #2563eb;
    transition: width .2s;
}

#error {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #2a1010;
    border: 1px solid #6b2020;
    color: #ffb4b4;
    font: 12px/1.5 monospace;
    white-space: pre-wrap;
    word-break: break-word;
}

#startAgain {
    display: none;
    margin-top: 12px;
}
</style>
</head>

<body>

<div id="app">

    <div id="topbar">
        <div id="title">WebPC 2</div>
        <div id="status">Preparing Linux x86-64 VM…</div>
        <button id="startButton">Start VM</button>
    </div>

    <div id="terminal"></div>

</div>

<div id="loading">
    <div id="loadingBox">

        <div id="loadingTitle">WebPC 2</div>

        <div id="loadingText">
            Preparing the Linux x86-64 virtual machine…
        </div>

        <div id="progress">
            <div id="progressBar"></div>
        </div>

        <div id="error"></div>

        <button id="startAgain">
            Try Again
        </button>

    </div>
</div>

<div id="log"></div>

<script type="module">

/*
============================================================
 WEBPC 2
 QEMU-WASM x86-64
 GitHub Release: bowslicegames/Webpc-2 V1

 IMPORTANT:
 The large VM files are NOT stored on Cloudflare Pages.
 They are downloaded from the GitHub Release below.
============================================================
*/

const RELEASE =
    "https://github.com/bowslicegames/Webpc-2/releases/download/V1/";


/*
============================================================
 FILE MAP
============================================================
*/

const FILES = {

    wasm:
        RELEASE + "qemu-system-x86_64.wasm",

    worker:
        RELEASE + "qemu-system-x86_64.worker.js",

    qemuJS:
        RELEASE + "out.js",

    rootfsJS:
        RELEASE + "load-rootfs.js",

    rootfsData:
        RELEASE + "load-rootfs.data",

    kernelJS:
        RELEASE + "load-kernel.js",

    kernelData:
        RELEASE + "load-kernel.data",

    initramfsJS:
        RELEASE + "load-initramfs.js",

    initramfsData:
        RELEASE + "load-initramfs.data",

    romJS:
        RELEASE + "load-rom.js",

    romData:
        RELEASE + "load-rom.data",

    proxy:
        RELEASE + "c2w-net-proxy.wasm.gzip"

};


/*
============================================================
 ELEMENTS
============================================================
*/

const statusEl =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");

const terminalEl =
    document.getElementById("terminal");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const progressBar =
    document.getElementById("progressBar");

const errorEl =
    document.getElementById("error");

const startAgain =
    document.getElementById("startAgain");

const logEl =
    document.getElementById("log");


/*
============================================================
 LOGGING
============================================================
*/

function log(message) {

    console.log("[WebPC 2]", message);

    logEl.style.display = "block";

    logEl.textContent +=
        message + "\n";

}

function setStatus(message) {

    statusEl.textContent = message;
    loadingText.textContent = message;

    log(message);

}

function setProgress(value) {

    progressBar.style.width =
        Math.max(0, Math.min(100, value)) + "%";

}


/*
============================================================
 ERROR HANDLING
============================================================
*/

function showError(error) {

    console.error(error);

    const message =
        error instanceof Error
            ? error.stack || error.message
            : String(error);

    errorEl.style.display = "block";

    errorEl.textContent =
        "VM STARTUP FAILED\n\n" +
        message;

    startAgain.style.display =
        "inline-block";

    startButton.disabled = false;

    setStatus("VM failed to start.");

}


/*
============================================================
 BROWSER REQUIREMENTS
============================================================
*/

function checkBrowser() {

    setStatus("Checking browser requirements…");

    if (!window.WebAssembly) {

        throw new Error(
            "WebAssembly is not supported by this browser."
        );

    }

    if (!window.SharedArrayBuffer) {

        throw new Error(
            "SharedArrayBuffer is unavailable.\n\n" +
            "Your Cloudflare Pages site must use " +
            "Cross-Origin-Opener-Policy: same-origin " +
            "and Cross-Origin-Embedder-Policy: require-corp."
        );

    }

    if (!window.crossOriginIsolated) {

        throw new Error(
            "The page is not cross-origin isolated.\n\n" +
            "Check your Cloudflare Pages _headers file."
        );

    }

    log("WebAssembly: OK");
    log("SharedArrayBuffer: OK");
    log("crossOriginIsolated: OK");

}


/*
============================================================
 DOWNLOAD HELPER
============================================================
*/

async function downloadBinary(url, name) {

    log("Downloading " + name);

    const response =
        await fetch(url, {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "no-store"
        });

    if (!response.ok) {

        throw new Error(
            name +
            " download failed.\n\n" +
            "HTTP " +
            response.status +
            " " +
            response.statusText +
            "\n\n" +
            url
        );

    }

    const data =
        await response.arrayBuffer();

    if (!data.byteLength) {

        throw new Error(
            name +
            " downloaded as an empty file."
        );

    }

    log(
        name +
        " downloaded: " +
        (data.byteLength / 1024 / 1024).toFixed(2) +
        " MB"
    );

    return data;

}


/*
============================================================
 CHECK QEMU WASM
============================================================
*/

async function loadWasm() {

    setStatus(
        "Downloading QEMU x86-64 WebAssembly…"
    );

    setProgress(10);

    const wasm =
        await downloadBinary(
            FILES.wasm,
            "QEMU x86-64 WebAssembly"
        );

    /*
     WebAssembly magic bytes:
     00 61 73 6d
    */

    const bytes =
        new Uint8Array(wasm, 0, 4);

    if (
        bytes[0] !== 0x00 ||
        bytes[1] !== 0x61 ||
        bytes[2] !== 0x73 ||
        bytes[3] !== 0x6d
    ) {

        throw new Error(
            "The downloaded qemu-system-x86_64.wasm " +
            "does not contain valid WebAssembly."
        );

    }

    log("QEMU WASM magic header: OK");

    setProgress(25);

    /*
     Compile before starting QEMU.
     This gives us a useful error if the browser
     cannot actually compile the binary.
    */

    try {

        await WebAssembly.compile(wasm);

        log("QEMU WASM compilation: OK");

    } catch (e) {

        throw new Error(
            "The browser downloaded the QEMU WASM " +
            "file but could not compile it.\n\n" +
            e
        );

    }

    return wasm;

}


/*
============================================================
 LOAD XTERM
============================================================
*/

let Terminal;
let openpty;

async function loadTerminalLibraries() {

    setStatus("Loading terminal…");

    const xterm =
        await import(
            "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
        );

    const pty =
        await import(
            "https://cdn.jsdelivr.net/npm/xterm-pty@0.9.4/+esm"
        );

    Terminal =
        xterm.Terminal;

    openpty =
        pty.openpty;

    log("xterm loaded");
    log("xterm-pty loaded");

}


/*
============================================================
 TERMINAL
============================================================
*/

let terminal;
let master;
let slave;

function createTerminal() {

    terminal =
        new Terminal({

            cursorBlink: true,

            convertEol: true,

            fontSize:
                Math.max(
                    12,
                    Math.min(
                        18,
                        window.innerWidth / 55
                    )
                ),

            theme: {

                background: "#000000",
                foreground: "#ffffff",
                cursor: "#ffffff"

            },

            scrollback: 5000

        });

    terminal.open(terminalEl);

    /*
     PTY pair used by the QEMU-Wasm build.
    */

    const pair =
        openpty();

    master =
        pair.master;

    slave =
        pair.slave;

    terminal.loadAddon(master);

    log("PTY created");

    /*
     Resize terminal when browser size changes.
    */

    window.addEventListener(
        "resize",
        () => {

            if (!terminal)
                return;

            try {

                terminal.resize(
                    Math.max(
                        40,
                        Math.floor(
                            terminalEl.clientWidth / 9
                        )
                    ),
                    Math.max(
                        10,
                        Math.floor(
                            terminalEl.clientHeight / 18
                        )
                    )
                );

            } catch (_) {}

        }
    );

}


/*
============================================================
 LOAD QEMU JS
============================================================
*/

async function loadQemuJS() {

    setStatus(
        "Downloading QEMU JavaScript runtime…"
    );

    setProgress(35);

    const response =
        await fetch(
            FILES.qemuJS,
            {
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "out.js failed to download.\n\n" +
            "HTTP " +
            response.status +
            "\n\n" +
            FILES.qemuJS
        );

    }

    const source =
        await response.text();

    if (
        !source.includes("WebAssembly") &&
        !source.includes("wasm")
    ) {

        throw new Error(
            "out.js was downloaded but does not " +
            "appear to be the QEMU Emscripten runtime."
        );

    }

    log(
        "out.js downloaded: " +
        (source.length / 1024).toFixed(1) +
        " KB"
    );

    /*
     Blob URL makes import() possible while keeping
     the release file on GitHub.
    */

    const blob =
        new Blob(
            [source],
            {
                type:
                    "text/javascript"
            }
        );

    return URL.createObjectURL(blob);

}


/*
============================================================
 LOAD PACKAGE DATA
============================================================

The QEMU image was produced with Emscripten's
file_packager. The four loader JS files register
the corresponding .data files with the Emscripten
virtual filesystem.
============================================================
*/

async function loadPackageScript(url, name) {

    setStatus(
        "Loading " + name + "…"
    );

    const response =
        await fetch(
            url,
            {
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            name +
            " failed to download.\n\n" +
            "HTTP " +
            response.status +
            "\n\n" +
            url
        );

    }

    const source =
        await response.text();

    log(
        name +
        " loaded (" +
        (source.length / 1024).toFixed(1) +
        " KB)"
    );

    const blob =
        new Blob(
            [source],
            {
                type: "text/javascript"
            }
        );

    const blobURL =
        URL.createObjectURL(blob);

    await import(blobURL);

    URL.revokeObjectURL(blobURL);

}


/*
============================================================
 LOAD ALL PACKAGE FILES
============================================================
*/

async function loadPackages() {

    setProgress(45);

    await loadPackageScript(
        FILES.rootfsJS,
        "root filesystem package"
    );

    setProgress(55);

    await loadPackageScript(
        FILES.kernelJS,
        "Linux kernel package"
    );

    setProgress(65);

    await loadPackageScript(
        FILES.initramfsJS,
        "initramfs package"
    );

    setProgress(72);

    await loadPackageScript(
        FILES.romJS,
        "BIOS/ROM package"
    );

    setProgress(78);

}


/*
============================================================
 START QEMU
============================================================
*/

async function startQemu(wasm, qemuURL) {

    setStatus(
        "Starting x86-64 virtual machine…"
    );

    setProgress(82);

    /*
     These arguments follow the upstream
     QEMU-Wasm Alpine x86-64 demo configuration.

     Networking is intentionally disabled for now.
     This makes the first VM boot simpler and avoids
     depending on the separate network proxy.
    */

    const Module = {

        arguments: [

            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda " +
            "noautodetect hostname=webpc",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img," +
            "format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test"

        ],

        /*
         Critical:
         Emscripten will use this for files such as
         qemu-system-x86_64.wasm.
        */

        locateFile(path, prefix) {

            /*
             The WASM is supplied directly below through
             wasmBinary, so this is mainly a fallback.
            */

            if (
                path.endsWith(
                    "qemu-system-x86_64.wasm"
                )
            ) {

                return FILES.wasm;

            }

            if (
                path.endsWith(
                    "qemu-system-x86_64.worker.js"
                )
            ) {

                return FILES.worker;

            }

            return prefix + path;

        },

        /*
         Emscripten runtime.
        */

        wasmBinary: wasm,

        pty: slave,

        mainScriptUrlOrBlob:
            qemuURL,

        print(text) {

            if (terminal) {

                terminal.write(
                    String(text)
                        .replace(/\n/g, "\r\n") +
                    "\r\n"
                );

            }

            console.log(
                "[QEMU]",
                text
            );

        },

        printErr(text) {

            console.error(
                "[QEMU ERROR]",
                text
            );

            if (terminal) {

                terminal.write(
                    "\r\n\x1b[31m" +
                    String(text) +
                    "\x1b[0m\r\n"
                );

            }

        },

        onAbort(reason) {

            log(
                "QEMU ABORT: " +
                reason
            );

        },

        onExit(code) {

            log(
                "QEMU exited with code " +
                code
            );

        }

    };


    /*
     Import the Emscripten ES module.
    */

    setStatus(
        "Launching QEMU x86-64…"
    );

    const qemuModule =
        await import(qemuURL);

    if (!qemuModule) {

        throw new Error(
            "Could not import QEMU out.js."
        );

    }

    /*
     The generated out.js uses a default Emscripten
     module factory.
    */

    const factory =
        qemuModule.default ||
        qemuModule;

    if (
        typeof factory !== "function"
    ) {

        throw new Error(
            "out.js loaded, but its Emscripten " +
            "module factory was not found."
        );

    }

    log(
        "Calling QEMU Emscripten module…"
    );

    await factory(Module);

    setProgress(100);

    setStatus(
        "Linux x86-64 VM running"
    );

    loading.style.display =
        "none";

}


/*
============================================================
 MAIN
============================================================
*/

let started = false;

async function boot() {

    if (started)
        return;

    started = true;

    startButton.disabled = true;
    errorEl.style.display = "none";
    startAgain.style.display = "none";
    logEl.textContent = "";
    logEl.style.display = "none";

    try {

        setProgress(0);

        checkBrowser();

        await loadTerminalLibraries();

        createTerminal();

        setProgress(5);

        /*
         Download and compile the 40+ MB QEMU WASM.
        */

        const wasm =
            await loadWasm();

        /*
         Download the Emscripten JS runtime.
        */

        const qemuURL =
            await loadQemuJS();

        setProgress(40);

        /*
         Load the kernel/rootfs/ROM packages.
        */

        await loadPackages();

        /*
         Start QEMU.
        */

        await startQemu(
            wasm,
            qemuURL
        );

    } catch (error) {

        showError(error);

    }

}


/*
============================================================
 BUTTONS
============================================================
*/

startButton.addEventListener(
    "click",
    boot
);

startAgain.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/*
============================================================
 AUTOMATIC START
============================================================
*/

window.addEventListener(
    "load",
    () => {

        setTimeout(
            boot,
            500
        );

    }
);

</script>

</body>
</html>
