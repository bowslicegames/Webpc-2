<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WebPC 2 — x86-64 Linux</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b10;
    color:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#top{
    flex:0 0 auto;
    padding:10px 12px;
    background:#111720;
    border-bottom:1px solid #293241;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:5;
}

#title{
    font-weight:700;
    white-space:nowrap;
}

#status{
    flex:1;
    min-width:0;
    color:#9aa8ba;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 14px;
    background:#2878ff;
    color:white;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:default;
}

#terminal{
    flex:1;
    min-height:0;
    width:100%;
    padding:8px;
    box-sizing:border-box;
    background:#000;
}

#log{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
    max-height:28vh;
    overflow:auto;
    padding:8px 10px;
    background:rgba(0,0,0,.78);
    border:1px solid #303844;
    border-radius:8px;
    color:#9fe7ff;
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;
    pointer-events:none;
    z-index:20;
}

#warning{
    display:none;
    padding:12px;
    background:#3a170f;
    color:#ffd8c8;
    border-bottom:1px solid #8b3d26;
    font-size:13px;
}

.xterm{
    height:100%;
}

.xterm-viewport{
    overflow-y:auto !important;
}
</style>
</head>

<body>

<div id="app">

    <div id="warning"></div>

    <div id="top">
        <div id="title">WebPC 2</div>
        <div id="status">Checking browser...</div>
        <button id="start" disabled>Start VM</button>
    </div>

    <div id="terminal"></div>

    <pre id="log"></pre>

</div>

<script type="module">

/*
    ============================================================
    WebPC 2
    QEMU Wasm x86-64 / Alpine Linux
    GitHub Release: bowslicegames/Webpc-2 V1

    This version:

      • automatically starts the VM
      • also has a Start / Retry button
      • uses xterm-pty as an ES module
      • does NOT use window.openpty()
      • loads the QEMU assets from GitHub Releases
      • maps all generated Emscripten data files
      • supplies qemu-system-x86_64.wasm directly
      • uses the original Alpine x86-64 QEMU arguments
      • does not use localStorage / IndexedDB persistence
*/


const RELEASE =
    "https://github.com/bowslicegames/Webpc-2/releases/download/V1/";

const FILES = {

    wasm:
        RELEASE + "qemu-system-x86_64.wasm",

    worker:
        RELEASE + "qemu-system-x86_64.worker.js",

    out:
        RELEASE + "out.js",

    stack:
        RELEASE + "stack.js",

    stackWorker:
        RELEASE + "stack-worker.js",

    proxy:
        RELEASE + "c2w-net-proxy.wasm.gzip",

    initramfs:
        RELEASE + "load-initramfs.data",

    initramfsJS:
        RELEASE + "load-initramfs.js",

    kernel:
        RELEASE + "load-kernel.data",

    kernelJS:
        RELEASE + "load-kernel.js",

    rom:
        RELEASE + "load-rom.data",

    romJS:
        RELEASE + "load-rom.js",

    rootfs:
        RELEASE + "load-rootfs.data",

    rootfsJS:
        RELEASE + "load-rootfs.js"
};


const statusElement =
    document.getElementById("status");

const startButton =
    document.getElementById("start");

const terminalElement =
    document.getElementById("terminal");

const logElement =
    document.getElementById("log");

const warningElement =
    document.getElementById("warning");


let terminal = null;
let pty = null;
let master = null;
let slave = null;

let qemuModule = null;
let bootStarted = false;
let bootFinished = false;


/* ------------------------------------------------------------
   Logging
------------------------------------------------------------ */

function log(message){

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        "[" + time + "] " + message + "\n";

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log("[WebPC 2]", message);
}


function setStatus(message){

    statusElement.textContent =
        message;

    log(message);
}


/* ------------------------------------------------------------
   Error handling
------------------------------------------------------------ */

function fatal(error){

    console.error(error);

    const message =
        error instanceof Error
            ? error.stack || error.message
            : String(error);

    setStatus("ERROR");

    warningElement.style.display =
        "block";

    warningElement.textContent =
        "WebPC 2 failed to start: " +
        message;

    startButton.disabled = false;
    startButton.textContent = "Retry VM";

    log("------------------------------------------------");
    log("FATAL ERROR");
    log(message);
    log("------------------------------------------------");
}


/* ------------------------------------------------------------
   Browser checks
------------------------------------------------------------ */

function checkBrowser(){

    if(!window.isSecureContext){

        throw new Error(
            "This page must be served over HTTPS."
        );
    }

    if(!window.crossOriginIsolated){

        throw new Error(
            "Cross-origin isolation is not enabled. " +
            "Cloudflare Pages must send COOP: same-origin " +
            "and COEP: require-corp."
        );
    }

    if(!window.SharedArrayBuffer){

        throw new Error(
            "SharedArrayBuffer is unavailable."
        );
    }

    if(!window.WebAssembly){

        throw new Error(
            "WebAssembly is unavailable."
        );
    }

    log("Secure context: OK");
    log("Cross-origin isolated: OK");
    log("SharedArrayBuffer: OK");
    log("WebAssembly: OK");
}


/* ------------------------------------------------------------
   Load a classic generated Emscripten file
   ------------------------------------------------------------ */

function loadClassicScript(url){

    return new Promise((resolve,reject)=>{

        const script =
            document.createElement("script");

        script.src = url;

        script.async = false;

        script.onload = ()=>{
            log("Loaded " + url.split("/").pop());
            resolve();
        };

        script.onerror = ()=>{
            reject(
                new Error(
                    "Could not load " + url
                )
            );
        };

        document.head.appendChild(script);
    });
}


/* ------------------------------------------------------------
   Terminal
   ------------------------------------------------------------ */

async function createTerminal(){

    setStatus("Loading terminal...");

    /*
       xterm.js and xterm-pty are deliberately imported using
       their browser ES-module interfaces.

       xterm-pty's documented API is:

           import { openpty } from "xterm-pty/index.mjs";

       rather than window.openpty().
    */

    const xtermModule =
        await import(
            "https://unpkg.com/xterm@5.3.0/+esm"
        );

    const ptyModule =
        await import(
            "https://unpkg.com/xterm-pty/index.mjs"
        );

    const Terminal =
        xtermModule.Terminal ||
        xtermModule.default?.Terminal ||
        xtermModule.default;

    const openpty =
        ptyModule.openpty;

    if(!Terminal){

        throw new Error(
            "xterm.js Terminal constructor was not found."
        );
    }

    if(!openpty){

        throw new Error(
            "xterm-pty openpty() was not found."
        );
    }

    terminal =
        new Terminal({

            cursorBlink:true,

            convertEol:true,

            fontFamily:
                'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',

            fontSize:
                14,

            theme:{
                background:"#000000",
                foreground:"#e6edf3",
                cursor:"#ffffff"
            },

            scrollback:
                5000,

            allowProposedApi:
                true
        });

    terminal.open(
        terminalElement
    );

    terminal.focus();

    /*
       Important:
       openpty() is called from the imported module.
    */

    const result =
        openpty();

    master =
        result.master;

    slave =
        result.slave;

    if(!master || !slave){

        throw new Error(
            "openpty() did not return master/slave."
        );
    }

    terminal.loadAddon(master);

    /*
       QEMU/Emscripten writes to the PTY slave.
       The xterm master handles the terminal display.
    */

    if(slave.onReadable){

        slave.onReadable(()=>{

            try{

                const data =
                    slave.read();

                if(data){
                    terminal.write(data);
                }

            }catch(error){

                console.error(
                    "PTY read error",
                    error
                );
            }
        });
    }

    /*
       Forward keyboard input from xterm to QEMU.
    */

    terminal.onData(data=>{

        try{

            slave.write(data);

        }catch(error){

            console.error(
                "PTY write error",
                error
            );
        }
    });

    /*
       iPad/mobile keyboards sometimes need the terminal
       explicitly focused after opening.
    */

    terminalElement.addEventListener(
        "click",
        ()=>{
            terminal.focus();
        }
    );

    log("Terminal ready");
}


/* ------------------------------------------------------------
   Emscripten Module configuration
   ------------------------------------------------------------ */

function createModule(){

    /*
       This MUST exist before the generated package loader
       scripts are executed.
    */

    window.Module = {

        arguments: [

            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=webpc",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test"

        ],

        /*
           Map every generated Emscripten asset to the
           GitHub Release.
        */

        locateFile:
            function(path,prefix){

                const name =
                    path.split("/").pop();

                switch(name){

                    case "qemu-system-x86_64.wasm":
                        return FILES.wasm;

                    case "qemu-system-x86_64.worker.js":
                        return FILES.worker;

                    case "stack.js":
                        return FILES.stack;

                    case "stack-worker.js":
                        return FILES.stackWorker;

                    case "c2w-net-proxy.wasm.gzip":
                        return FILES.proxy;

                    case "load-initramfs.data":
                        return FILES.initramfs;

                    case "load-kernel.data":
                        return FILES.kernel;

                    case "load-rom.data":
                        return FILES.rom;

                    case "load-rootfs.data":
                        return FILES.rootfs;

                    default:

                        /*
                           Most generated resources arrive here.
                           Returning the GitHub Release base lets
                           Emscripten find the flat release assets.
                        */

                        if(path.endsWith(".wasm")){
                            return RELEASE + name;
                        }

                        if(path.endsWith(".worker.js")){
                            return RELEASE + name;
                        }

                        if(path.endsWith(".data")){
                            return RELEASE + name;
                        }

                        return prefix + path;
                }
            },

        /*
           Emscripten pthread builds need a stable reference
           to the main script.
        */

        mainScriptUrlOrBlob:
            FILES.out,

        /*
           Prevent Emscripten from replacing our diagnostic
           output.
        */

        print:
            function(text){
                log(String(text));

                if(terminal){
                    terminal.write(
                        String(text)
                        .replace(/\n/g,"\r\n")
                    );
                }
            },

        printErr:
            function(text){
                log("QEMU STDERR: " + String(text));
            },

        onAbort:
            function(reason){

                fatal(
                    new Error(
                        "Emscripten/QEMU aborted: " +
                        reason
                    )
                );
            }
    };

    qemuModule =
        window.Module;

    return qemuModule;
}


/* ------------------------------------------------------------
   Load QEMU generated package files
   ------------------------------------------------------------ */

async function loadPackages(){

    setStatus(
        "Loading Linux filesystem assets..."
    );

    /*
       These are the exact generated package
       loader files supplied in release V1.

       They populate Emscripten's virtual filesystem
       with:

          /pack-initramfs/
          /pack-kernel/
          /pack-rom/
          /pack-rootfs/
    */

    await loadClassicScript(
        FILES.initramfsJS
    );

    await loadClassicScript(
        FILES.kernelJS
    );

    await loadClassicScript(
        FILES.romJS
    );

    await loadClassicScript(
        FILES.rootfsJS
    );

    log("All filesystem package loaders loaded");
}


/* ------------------------------------------------------------
   Download QEMU's generated ES module
   ------------------------------------------------------------ */

async function loadQemuModule(){

    setStatus(
        "Loading x86-64 QEMU WebAssembly..."
    );

    log(
        "Downloading: qemu-system-x86_64.wasm"
    );

    /*
       Fetch the wasm explicitly.

       This gives us a useful error if GitHub refuses
       the request instead of leaving the VM apparently
       frozen.
    */

    const wasmResponse =
        await fetch(
            FILES.wasm,
            {
                mode:"cors",
                cache:"no-store"
            }
        );

    if(!wasmResponse.ok){

        throw new Error(
            "QEMU WASM download failed: HTTP " +
            wasmResponse.status
        );
    }

    const wasmBytes =
        await wasmResponse.arrayBuffer();

    log(
        "QEMU WASM downloaded: " +
        Math.round(
            wasmBytes.byteLength / 1024 / 1024
        ) +
        " MiB"
    );

    /*
       Emscripten can consume the wasmBinary directly.
       This avoids another download by the generated
       runtime.
    */

    window.Module.wasmBinary =
        wasmBytes;


    log(
        "Downloading generated QEMU JavaScript..."
    );

    const jsResponse =
        await fetch(
            FILES.out,
            {
                mode:"cors",
                cache:"no-store"
            }
        );

    if(!jsResponse.ok){

        throw new Error(
            "QEMU JavaScript download failed: HTTP " +
            jsResponse.status
        );
    }

    const source =
        await jsResponse.text();

    log(
        "QEMU JavaScript downloaded: " +
        Math.round(
            source.length / 1024
        ) +
        " KiB"
    );

    /*
       Create a Blob URL rather than executing the
       downloaded source as a classic script.

       The generated out.js is an ES module.
    */

    const blob =
        new Blob(
            [source],
            {
                type:"text/javascript"
            }
        );

    const blobURL =
        URL.createObjectURL(blob);

    /*
       Keep the URL alive for the lifetime of QEMU.
    */

    window.__qemuBlobURL =
        blobURL;

    /*
       Import the generated Emscripten factory.
    */

    const moduleNamespace =
        await import(blobURL);

    const factory =
        moduleNamespace.default;

    if(typeof factory !== "function"){

        throw new Error(
            "Generated QEMU module did not export " +
            "an Emscripten factory function."
        );
    }

    log(
        "QEMU JavaScript module imported"
    );

    return factory;
}


/* ------------------------------------------------------------
   Start QEMU
   ------------------------------------------------------------ */

async function boot(){

    if(bootStarted){

        log(
            "Boot already started."
        );

        return;
    }

    bootStarted = true;

    startButton.disabled =
        true;

    startButton.textContent =
        "Starting...";

    try{

        setStatus(
            "Starting Linux x86-64..."
        );

        checkBrowser();

        /*
           Terminal first.
        */

        await createTerminal();

        /*
           Configure global Emscripten Module.
        */

        createModule();

        /*
           Load the filesystem package scripts
           before launching QEMU.
        */

        await loadPackages();

        /*
           Load/import the generated QEMU runtime.
        */

        const factory =
            await loadQemuModule();

        setStatus(
            "Launching QEMU..."
        );

        log(
            "Calling Emscripten QEMU factory..."
        );

        /*
           IMPORTANT:
           The generated factory receives our already
           configured global Module object.
        */

        const instance =
            await factory(
                window.Module
            );

        window.QEMU =
            instance;

        bootFinished =
            true;

        startButton.textContent =
            "VM Running";

        startButton.disabled =
            true;

        setStatus(
            "Linux x86-64 is running."
        );

        log(
            "QEMU factory completed."
        );

        log(
            "If the Alpine login/console is not visible yet, " +
            "wait for the guest kernel to finish booting."
        );

        if(terminal){
            terminal.focus();
        }

    }catch(error){

        bootStarted =
            false;

        fatal(error);
    }
}


/* ------------------------------------------------------------
   Manual start/retry button
   ------------------------------------------------------------ */

startButton.addEventListener(
    "click",
    ()=>{

        if(!bootFinished){
            boot();
        }
    }
);


/* ------------------------------------------------------------
   Initialisation
   ------------------------------------------------------------ */

(async function(){

    try{

        setStatus(
            "Checking browser..."
        );

        checkBrowser();

        /*
           Make the button available immediately.
        */

        startButton.disabled =
            false;

        startButton.textContent =
            "Start VM";

        /*
           Automatically boot.

           There is no longer a state where the page simply
           waits forever at "Ready — start Linux x86-64."
        */

        setStatus(
            "Ready — automatically starting Linux x86-64..."
        );

        await boot();

    }catch(error){

        fatal(error);
    }

})();

</script>

</body>
</html>
