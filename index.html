<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>WebPC 2 — x86-64 Linux</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
}

*{
    box-sizing:border-box;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#top{
    flex:0 0 auto;

    min-height:52px;

    padding:8px 10px;

    display:flex;
    align-items:center;
    gap:9px;

    background:#11161d;

    border-bottom:
        1px solid #2b3440;
}

#title{
    font-weight:800;
    white-space:nowrap;
}

#status{
    flex:1;

    min-width:0;

    color:#9caabd;

    font-size:13px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

button{
    border:0;

    border-radius:8px;

    padding:9px 13px;

    background:#2678ff;

    color:white;

    font-weight:700;

    font-size:14px;
}

button:disabled{
    opacity:.45;
}

#terminalWrap{
    position:relative;

    flex:1;

    min-height:0;

    background:#000;
}

#terminal{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    padding:10px;

    overflow:auto;

    white-space:pre-wrap;

    word-break:break-word;

    background:#000;

    color:#e8e8e8;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size:14px;

    line-height:1.35;

    -webkit-user-select:text;
    user-select:text;
}

#input{
    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    width:calc(100% - 20px);

    height:42px;

    padding:8px 10px;

    resize:none;

    border:
        1px solid #394452;

    border-radius:7px;

    outline:none;

    background:#10151c;

    color:#fff;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size:14px;
}

#input:focus{
    border-color:#347fff;
}

#log{
    position:absolute;

    left:10px;
    right:10px;
    bottom:62px;

    max-height:25vh;

    overflow:auto;

    padding:7px 9px;

    border:
        1px solid #303944;

    border-radius:7px;

    background:rgba(0,0,0,.82);

    color:#7fc8ff;

    font:
        11px/1.4
        ui-monospace,
        monospace;

    white-space:pre-wrap;

    pointer-events:none;

    z-index:10;
}

#error{
    display:none;

    position:absolute;

    left:10px;
    right:10px;
    top:62px;

    z-index:20;

    padding:12px;

    border:
        1px solid #8e3927;

    border-radius:8px;

    background:#32130e;

    color:#ffd6ca;

    font-size:13px;

    white-space:pre-wrap;
}

</style>
</head>

<body>

<div id="app">

    <div id="top">

        <div id="title">
            WebPC 2
        </div>

        <div id="status">
            Initialising...
        </div>

        <button id="start">
            Start VM
        </button>

    </div>


    <div id="terminalWrap">

        <div id="terminal"></div>

        <textarea
            id="input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Linux keyboard input..."
        ></textarea>

        <pre id="log"></pre>

        <div id="error"></div>

    </div>

</div>


<script type="module">

/*
============================================================
 WebPC 2
 QEMU-Wasm x86-64
 Alpine Linux

 No xterm
 No xterm-pty
 No external JavaScript dependencies

 QEMU assets:
 GitHub release V1
============================================================
*/


const RELEASE =
    "https://github.com/bowslicegames/Webpc-2/releases/download/V1/";


const FILES = {

    wasm:
        RELEASE +
        "qemu-system-x86_64.wasm",

    worker:
        RELEASE +
        "qemu-system-x86_64.worker.js",

    out:
        RELEASE +
        "out.js",

    stack:
        RELEASE +
        "stack.js",

    stackWorker:
        RELEASE +
        "stack-worker.js",

    proxy:
        RELEASE +
        "c2w-net-proxy.wasm.gzip",

    initramfs:
        RELEASE +
        "load-initramfs.data",

    initramfsJS:
        RELEASE +
        "load-initramfs.js",

    kernel:
        RELEASE +
        "load-kernel.data",

    kernelJS:
        RELEASE +
        "load-kernel.js",

    rom:
        RELEASE +
        "load-rom.data",

    romJS:
        RELEASE +
        "load-rom.js",

    rootfs:
        RELEASE +
        "load-rootfs.data",

    rootfsJS:
        RELEASE +
        "load-rootfs.js"
};


/*
============================================================
 DOM
============================================================
*/

const status =
    document.getElementById("status");

const startButton =
    document.getElementById("start");

const terminal =
    document.getElementById("terminal");

const input =
    document.getElementById("input");

const logBox =
    document.getElementById("log");

const errorBox =
    document.getElementById("error");


/*
============================================================
 State
============================================================
*/

let booting =
    false;

let running =
    false;

let qemu =
    null;

let inputQueue =
    [];

let inputResolve =
    null;


/*
============================================================
 Logging
============================================================
*/

function log(message){

    const text =
        "[" +
        new Date().toLocaleTimeString() +
        "] " +
        message;

    logBox.textContent +=
        text +
        "\n";

    logBox.scrollTop =
        logBox.scrollHeight;

    console.log(
        "[WebPC 2]",
        message
    );
}


function setStatus(message){

    status.textContent =
        message;

    log(message);
}


function showError(error){

    console.error(error);

    const message =
        error instanceof Error
            ? (
                error.stack ||
                error.message
            )
            : String(error);

    errorBox.style.display =
        "block";

    errorBox.textContent =
        "WebPC 2 failed to start:\n\n" +
        message;

    setStatus(
        "VM failed to start"
    );

    startButton.disabled =
        false;

    startButton.textContent =
        "Retry VM";

    booting =
        false;
}


/*
============================================================
 Terminal output
============================================================
*/

function terminalWrite(text){

    if(text === undefined ||
       text === null){

        return;
    }

    text =
        String(text);

    terminal.textContent +=
        text;

    terminal.scrollTop =
        terminal.scrollHeight;
}


/*
============================================================
 Input
============================================================
*/

/*
   Convert a string into character codes that
   Emscripten's stdin callback can consume.
*/

function pushInput(text){

    if(!text){
        return;
    }

    for(
        let i = 0;
        i < text.length;
        i++
    ){

        inputQueue.push(
            text.charCodeAt(i)
        );
    }

    /*
       Wake a waiting stdin request.
    */

    if(inputResolve){

        const resolve =
            inputResolve;

        inputResolve =
            null;

        resolve();
    }
}


/*
   Keyboard / touchscreen input box.

   Enter sends the current line to Linux.
*/

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            const text =
                input.value;

            input.value =
                "";

            pushInput(
                text +
                "\n"
            );

            terminalWrite(
                text +
                "\n"
            );

            return;
        }

        /*
           Backspace is handled normally by
           the textarea.
        */
    }
);


/*
   Allow Ctrl+C to reach Linux.
*/

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "c"
        ){

            event.preventDefault();

            input.value =
                "";

            pushInput(
                String.fromCharCode(3)
            );
        }
    }
);


/*
============================================================
 Browser capability checks
============================================================
*/

function checkBrowser(){

    if(!window.isSecureContext){

        throw new Error(
            "The page must be served over HTTPS."
        );
    }


    if(!window.crossOriginIsolated){

        throw new Error(
            "Cross-origin isolation is not enabled.\n\n" +

            "Your Cloudflare Pages _headers file must contain:\n\n" +

            "Cross-Origin-Opener-Policy: same-origin\n" +

            "Cross-Origin-Embedder-Policy: require-corp"
        );
    }


    if(!window.SharedArrayBuffer){

        throw new Error(
            "SharedArrayBuffer is unavailable."
        );
    }


    if(!window.WebAssembly){

        throw new Error(
            "WebAssembly is unavailable."
        );
    }


    log(
        "Secure context: OK"
    );

    log(
        "Cross-origin isolation: OK"
    );

    log(
        "SharedArrayBuffer: OK"
    );

    log(
        "WebAssembly: OK"
    );
}


/*
============================================================
 Load generated Emscripten package script
============================================================
*/

function loadScript(url){

    return new Promise(
        function(resolve,reject){

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                url;

            script.async =
                false;

            script.onload =
                function(){

                    log(
                        "Loaded " +
                        url.split("/").pop()
                    );

                    resolve();
                };

            script.onerror =
                function(){

                    reject(
                        new Error(
                            "Could not load:\n" +
                            url
                        )
                    );
                };

            document.head.appendChild(
                script
            );
        }
    );
}


/*
============================================================
 Emscripten Module
============================================================
*/

function createModule(){

    window.Module = {

        /*
           Exact Alpine x86-64 QEMU configuration
           based on the qemu-wasm-demo setup.
        */

        arguments: [

            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=webpc",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test"
        ],


        /*
           Emscripten resource mapping.
        */

        locateFile:
            function(path,prefix){

                const name =
                    path
                        .split("/")
                        .pop();


                if(
                    name ===
                    "qemu-system-x86_64.wasm"
                ){

                    return FILES.wasm;
                }


                if(
                    name ===
                    "qemu-system-x86_64.worker.js"
                ){

                    return FILES.worker;
                }


                if(
                    name ===
                    "stack.js"
                ){

                    return FILES.stack;
                }


                if(
                    name ===
                    "stack-worker.js"
                ){

                    return FILES.stackWorker;
                }


                if(
                    name ===
                    "c2w-net-proxy.wasm.gzip"
                ){

                    return FILES.proxy;
                }


                if(
                    name ===
                    "load-initramfs.data"
                ){

                    return FILES.initramfs;
                }


                if(
                    name ===
                    "load-kernel.data"
                ){

                    return FILES.kernel;
                }


                if(
                    name ===
                    "load-rom.data"
                ){

                    return FILES.rom;
                }


                if(
                    name ===
                    "load-rootfs.data"
                ){

                    return FILES.rootfs;
                }


                /*
                   Generic fallback.
                */

                return RELEASE +
                    name;
            },


        /*
           Emscripten uses this for worker handling.
        */

        mainScriptUrlOrBlob =
            FILES.out,


        /*
           QEMU stdout.
        */

        print:
            function(text){

                terminalWrite(
                    String(text) +
                    "\n"
                );

                log(
                    "QEMU: " +
                    String(text)
                );
            },


        /*
           QEMU stderr.
        */

        printErr:
            function(text){

                log(
                    "QEMU STDERR: " +
                    String(text)
                );

                terminalWrite(
                    "\r\n" +
                    String(text) +
                    "\r\n"
                );
            },


        /*
           stdin.

           QEMU's Linux serial console eventually
           reaches this callback.

           If there is no character available,
           wait until the user supplies one.
        */

        stdin:
            function(){

                if(inputQueue.length){

                    return inputQueue.shift();
                }

                return null;
            },


        onAbort:
            function(reason){

                throw new Error(
                    "QEMU/Emscripten aborted: " +
                    reason
                );
            }
    };


    /*
       Some Emscripten builds look for Module
       on window.
    */

    window.Module =
        window.Module;

    return window.Module;
}


/*
============================================================
 Load Linux filesystem packages
============================================================
*/

async function loadPackages(){

    setStatus(
        "Loading Alpine Linux filesystems..."
    );


    await loadScript(
        FILES.initramfsJS
    );


    await loadScript(
        FILES.kernelJS
    );


    await loadScript(
        FILES.romJS
    );


    await loadScript(
        FILES.rootfsJS
    );


    log(
        "All Alpine filesystem packages loaded."
    );
}


/*
============================================================
 Download QEMU WASM
============================================================
*/

async function downloadQemuWasm(){

    setStatus(
        "Downloading x86-64 QEMU..."
    );


    log(
        "Downloading qemu-system-x86_64.wasm..."
    );


    const response =
        await fetch(
            FILES.wasm,
            {
                mode:"cors",
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "QEMU WebAssembly download failed.\n\n" +

            "HTTP status: " +
            response.status +
            "\n\n" +

            FILES.wasm
        );
    }


    const bytes =
        await response.arrayBuffer();


    log(
        "Downloaded " +
        Math.round(
            bytes.byteLength /
            1024 /
            1024
        ) +
        " MiB of QEMU WebAssembly."
    );


    window.Module.wasmBinary =
        bytes;
}


/*
============================================================
 Load generated QEMU JS
============================================================
*/

async function loadQemuJS(){

    setStatus(
        "Loading QEMU runtime..."
    );


    const response =
        await fetch(
            FILES.out,
            {
                mode:"cors",
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "QEMU JavaScript download failed.\n\n" +

            "HTTP status: " +
            response.status
        );
    }


    const source =
        await response.text();


    log(
        "QEMU runtime downloaded."
    );


    /*
       The generated out.js is an ES module.

       Create a Blob URL so it can be imported.
    */

    const blob =
        new Blob(
            [source],
            {
                type:
                    "text/javascript"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    /*
       Keep this URL alive.
    */

    window.__qemuURL =
        url;


    const module =
        await import(url);


    if(
        !module ||
        typeof module.default !==
        "function"
    ){

        throw new Error(
            "The QEMU runtime did not provide " +
            "an Emscripten factory."
        );
    }


    log(
        "QEMU runtime imported."
    );


    return module.default;
}


/*
============================================================
 BOOT
============================================================
*/

async function boot(){

    if(booting ||
       running){

        return;
    }


    booting =
        true;

    startButton.disabled =
        true;

    startButton.textContent =
        "Starting...";


    errorBox.style.display =
        "none";


    try{

        /*
           1.
           Browser checks.
        */

        setStatus(
            "Checking browser..."
        );

        checkBrowser();


        /*
           2.
           Create Module BEFORE package
           scripts are loaded.
        */

        setStatus(
            "Preparing QEMU..."
        );

        createModule();


        /*
           3.
           Load Linux filesystem packages.
        */

        await loadPackages();


        /*
           4.
           Download the main QEMU WASM binary.
        */

        await downloadQemuWasm();


        /*
           5.
           Import QEMU's generated JS.
        */

        const factory =
            await loadQemuJS();


        /*
           6.
           Start QEMU.
        */

        setStatus(
            "Starting x86-64 Linux..."
        );


        log(
            "Launching QEMU..."
        );


        qemu =
            await factory(
                window.Module
            );


        running =
            true;

        booting =
            false;


        startButton.textContent =
            "VM Running";

        startButton.disabled =
            true;


        setStatus(
            "Linux x86-64 is running."
        );


        terminalWrite(
            "\n\n" +
            "========================================\n" +
            " WebPC 2 — Linux x86-64\n" +
            "========================================\n\n"
        );


        input.focus();


    }catch(error){

        showError(
            error
        );
    }
}


/*
============================================================
 Start button
============================================================
*/

startButton.addEventListener(
    "click",
    function(){

        boot();
    }
);


/*
============================================================
 AUTO START
============================================================
*/

(async function(){

    try{

        setStatus(
            "Checking browser..."
        );

        checkBrowser();


        setStatus(
            "Ready — automatically starting VM..."
        );


        /*
           Small delay so the browser has time to paint
           the status before the large downloads begin.
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    150
                )
        );


        await boot();

    }catch(error){

        showError(
            error
        );
    }

})();

</script>

</body>
</html>
