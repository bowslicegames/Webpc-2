<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no"
>

<title>WebPC 2 — Alpine Linux x86-64</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: monospace;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

#topbar {
  height: 48px;
  min-height: 48px;

  display: flex;
  align-items: center;

  gap: 12px;
  padding: 0 12px;

  background: #111;
  border-bottom: 1px solid #333;

  font-family: system-ui, sans-serif;
}

#title {
  font-weight: 700;
  white-space: nowrap;
}

#status {
  color: #aaa;
  font-size: 13px;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#terminal {
  flex: 1;
  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;

  padding: 12px;

  background: #000;

  white-space: pre-wrap;
  word-break: break-word;

  font-size: 14px;
  line-height: 1.3;

  -webkit-user-select: text;
  user-select: text;
}

#error {
  color: #ff6666;
}

#bottom {
  height: 58px;
  min-height: 58px;

  display: flex;
  align-items: center;

  gap: 8px;
  padding: 7px;

  background: #111;
  border-top: 1px solid #333;
}

#command {
  flex: 1;
  min-width: 0;

  height: 42px;

  border: 1px solid #555;
  border-radius: 7px;

  background: #080808;
  color: #fff;

  padding: 0 12px;

  outline: none;

  font: 14px monospace;
}

#command:focus {
  border-color: #aaa;
}

button {
  height: 42px;

  padding: 0 14px;

  border-radius: 7px;

  border: 1px solid #555;

  background: #222;
  color: #fff;

  font-weight: 700;
}

button:active {
  background: #444;
}
</style>
</head>

<body>

<div id="app">

  <div id="topbar">

    <div id="title">
      WebPC 2
    </div>

    <div id="status">
      Preparing Alpine Linux x86-64…
    </div>

  </div>


  <div id="terminal"></div>


  <div id="bottom">

    <input
      id="command"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Linux command…"
    >

    <button id="send">
      Send
    </button>

    <button id="ctrlc">
      Ctrl+C
    </button>

    <button id="clear">
      Clear
    </button>

  </div>

</div>


<script type="module">

/*
===========================================================
 WEBPC 2
 ALPINE LINUX x86-64
===========================================================

The WebPC Pages site remains wherever your GitHub repository
currently publishes it.

Large QEMU files are downloaded through the NEW Worker:

https://webpcproxy.bowslicegames.workers.dev/

The Worker then retrieves the files from:

GitHub:
bowslicegames/Webpc-2
Release:
V1

Minecraft is NOT attempted in this version.

Current goal:

Browser
   ↓
Cloudflare Pages
   ↓
Cloudflare Worker
   ↓
GitHub Release
   ↓
QEMU x86-64
   ↓
Alpine Linux
===========================================================
*/


/*
-----------------------------------------------------------
 NEW WORKER
-----------------------------------------------------------
*/

const WORKER =
  "https://webpcproxy.bowslicegames.workers.dev/";


/*
-----------------------------------------------------------
 Worker file helper
-----------------------------------------------------------
*/

function file(name) {

  return (
    WORKER +
    "?file=" +
    encodeURIComponent(name)
  );

}


/*
-----------------------------------------------------------
 QEMU RELEASE FILES
-----------------------------------------------------------
*/

const FILES = {

  wasm:
    file("qemu-system-x86_64.wasm"),

  worker:
    file("qemu-system-x86_64.worker.js"),

  out:
    file("out.js"),

  rom:
    file("load-rom.js"),

  kernel:
    file("load-kernel.js"),

  initramfs:
    file("load-initramfs.js"),

  rootfs:
    file("load-rootfs.js"),

  stack:
    file("stack.js"),

  stackWorker:
    file("stack-worker.js")

};


/*
-----------------------------------------------------------
 DOM
-----------------------------------------------------------
*/

const terminal =
  document.getElementById("terminal");

const status =
  document.getElementById("status");

const command =
  document.getElementById("command");

const send =
  document.getElementById("send");

const ctrlc =
  document.getElementById("ctrlc");

const clearButton =
  document.getElementById("clear");


/*
-----------------------------------------------------------
 STATE
-----------------------------------------------------------
*/

let started = false;

let qemu = null;

let pty = null;


/*
-----------------------------------------------------------
 OUTPUT
-----------------------------------------------------------
*/

function cleanANSI(text) {

  return String(text)

    .replace(
      /\x1b\[[0-?]*[ -/]*[@-~]/g,
      ""
    )

    .replace(
      /\x1b\][^\x07]*(?:\x07|\x1b\\)/g,
      ""
    )

    .replace(
      /\x1b[()][0-2]/g,
      ""
    )

    .replace(
      /\x1b[@-_]/g,
      ""
    );

}


function output(text) {

  if (
    text === undefined ||
    text === null
  ) {
    return;
  }

  terminal.appendChild(
    document.createTextNode(
      cleanANSI(text)
    )
  );

  terminal.scrollTop =
    terminal.scrollHeight;

}


function line(text = "") {

  output(text + "\n");

}


function setStatus(text) {

  status.textContent = text;

}


/*
-----------------------------------------------------------
 BROWSER CHECK
-----------------------------------------------------------
*/

function browserCheck() {

  line("WebPC 2 — Alpine Linux x86-64");
  line("QEMU-Wasm browser VM");
  line("");

  line("Browser diagnostics");
  line("-------------------");

  line(
    "crossOriginIsolated: " +
    String(window.crossOriginIsolated)
  );

  line(
    "SharedArrayBuffer: " +
    String(
      typeof SharedArrayBuffer !==
      "undefined"
    )
  );

  line(
    "WebAssembly: " +
    String(
      typeof WebAssembly !==
      "undefined"
    )
  );

  line("");

  if (!window.crossOriginIsolated) {

    throw new Error(
      "crossOriginIsolated is false.\n\n" +
      "Your _headers file must contain:\n\n" +
      "Cross-Origin-Opener-Policy: same-origin\n" +
      "Cross-Origin-Embedder-Policy: require-corp"
    );

  }

}


/*
-----------------------------------------------------------
 TEST THE NEW WORKER
-----------------------------------------------------------
*/

async function testWorker() {

  setStatus(
    "Testing new QEMU file proxy…"
  );

  line(
    "Testing new Worker:"
  );

  line(
    WORKER
  );

  line("");

  const response =
    await fetch(
      FILES.wasm,
      {
        method: "GET"
      }
    );

  if (!response.ok) {

    throw new Error(
      "The new Worker returned HTTP " +
      response.status +
      "."
    );

  }

  const contentType =
    response.headers.get(
      "content-type"
    );

  line(
    "Worker response: OK"
  );

  line(
    "Content-Type: " +
    String(contentType)
  );

  line("");

}


/*
-----------------------------------------------------------
 DOWNLOAD QEMU WASM
-----------------------------------------------------------
*/

async function downloadWasm() {

  setStatus(
    "Downloading QEMU x86-64…"
  );

  line(
    "Downloading qemu-system-x86_64.wasm…"
  );

  const response =
    await fetch(FILES.wasm);

  if (!response.ok) {

    throw new Error(
      "QEMU WASM returned HTTP " +
      response.status
    );

  }

  const buffer =
    await response.arrayBuffer();

  line(
    "QEMU WASM downloaded: " +
    (
      buffer.byteLength /
      1024 /
      1024
    ).toFixed(1) +
    " MiB"
  );

  line("");

  return buffer;

}


/*
-----------------------------------------------------------
 LOAD GENERATED EMSCRIPTEN SCRIPT
-----------------------------------------------------------
*/

function loadScript(url) {

  return new Promise(
    (resolve, reject) => {

      const script =
        document.createElement(
          "script"
        );

      script.src = url;

      script.async = false;

      script.onload =
        () => resolve();

      script.onerror =
        () => reject(
          new Error(
            "Could not load:\n" +
            url
          )
        );

      document.head.appendChild(
        script
      );

    }
  );

}


/*
-----------------------------------------------------------
 PTY
-----------------------------------------------------------
*/

function createPTY() {

  return {

    cols: 100,

    rows: 30,

    write(data) {

      output(data);

    },

    resize(cols, rows) {

      this.cols = cols;
      this.rows = rows;

    }

  };

}


/*
-----------------------------------------------------------
 INPUT
-----------------------------------------------------------
*/

function sendInput(text) {

  if (!pty)
    return;

  /*
   * The existing QEMU build uses its PTY integration.
   *
   * Keep a number of possible input methods available
   * rather than assuming one implementation.
   */

  try {

    if (
      typeof pty.writeInput ===
      "function"
    ) {

      pty.writeInput(text);

      return;

    }

  } catch (e) {

    console.error(e);

  }

  try {

    if (
      typeof pty.write ===
      "function"
    ) {

      pty.write(text);

    }

  } catch (e) {

    console.error(e);

  }

}


/*
-----------------------------------------------------------
 COMMAND INPUT
-----------------------------------------------------------
*/

function submitCommand() {

  const value =
    command.value;

  if (!value)
    return;

  sendInput(
    value + "\n"
  );

  command.value = "";

  command.focus();

}


send.addEventListener(
  "click",
  submitCommand
);


command.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      submitCommand();

      event.preventDefault();

    }

  }
);


/*
-----------------------------------------------------------
 CTRL+C
-----------------------------------------------------------
*/

ctrlc.addEventListener(
  "click",
  () => {

    sendInput("\x03");

    command.focus();

  }
);


/*
-----------------------------------------------------------
 CLEAR
-----------------------------------------------------------
*/

clearButton.addEventListener(
  "click",
  () => {

    terminal.textContent = "";

  }
);


/*
-----------------------------------------------------------
 START QEMU
-----------------------------------------------------------
*/

async function boot() {

  if (started)
    return;

  started = true;

  try {

    browserCheck();


    /*
     * First prove that the new Worker works.
     */

    await testWorker();


    /*
     * Download QEMU WASM.
     */

    const wasm =
      await downloadWasm();


    /*
     * Create PTY.
     */

    pty =
      createPTY();


    /*
     * QEMU Module
     */

    window.Module = {

      arguments: [

        "-nographic",

        "-M",
        "pc",

        "-m",
        "512M",

        "-accel",
        "tcg,tb-size=500",

        "-L",
        "/pack-rom/",

        "-nic",
        "none",

        "-kernel",
        "/pack-kernel/vmlinuz-virt",

        "-initrd",
        "/pack-initramfs/initramfs-virt",

        "-append",
        "console=ttyS0 root=/dev/vda noautodetect hostname=webpc",

        "-drive",
        "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

        "-device",
        "virtio-blk-pci,drive=test"

      ],


      /*
       * Existing QEMU PTY interface.
       */

      pty: pty,


      /*
       * We already downloaded the WASM.
       */

      wasmBinary: wasm,


      /*
       * Required by the pthread build.
       */

      mainScriptUrlOrBlob:
        FILES.out,


      /*
       * IMPORTANT:
       *
       * Every QEMU asset now goes through
       * the new Worker.
       */

      locateFile(path) {

        return file(path);

      },


      print(text) {

        output(text);

      },


      printErr(text) {

        output(
          "\n[QEMU] " +
          text +
          "\n"
        );

      },


      onAbort(reason) {

        setStatus(
          "QEMU aborted"
        );

        line("");

        line(
          "QEMU ABORT:"
        );

        line(
          String(reason)
        );

      }

    };


    /*
     * Load the packaged ROM/kernel/initramfs/rootfs.
     */

    setStatus(
      "Loading Alpine Linux files…"
    );

    line(
      "Loading Alpine Linux package files…"
    );


    await loadScript(
      FILES.rom
    );

    await loadScript(
      FILES.kernel
    );

    await loadScript(
      FILES.initramfs
    );

    await loadScript(
      FILES.rootfs
    );


    /*
     * Start QEMU.
     */

    setStatus(
      "Starting QEMU x86-64…"
    );

    line(
      "Starting QEMU x86-64…"
    );

    line("");


    const qemuModule =
      await import(
        FILES.out
      );


    if (
      !qemuModule ||
      typeof qemuModule.default !==
      "function"
    ) {

      throw new Error(
        "QEMU out.js loaded, but its " +
        "Emscripten factory was not found."
      );

    }


    qemu =
      await qemuModule.default(
        window.Module
      );


    setStatus(
      "Alpine Linux running"
    );


    line("");
    line(
      "========================================"
    );
    line(
      " Alpine Linux x86-64"
    );
    line(
      " QEMU-Wasm"
    );
    line(
      "========================================"
    );
    line("");


    command.focus();


  } catch (error) {

    started = false;

    setStatus(
      "Startup failed"
    );

    line("");

    line(
      "========================================"
    );

    line(
      " WEBPC 2 STARTUP ERROR"
    );

    line(
      "========================================"
    );

    line(
      error?.stack ||
      error?.message ||
      String(error)
    );

    line("");

  }

}


/*
-----------------------------------------------------------
 START AUTOMATICALLY
-----------------------------------------------------------
*/

window.addEventListener(
  "load",
  () => {

    boot();

  }
);

</script>

</body>
</html>
