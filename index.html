<body>

<div id="app">

</div>

<script>
"use strict";

/*
    ============================================================
    QEMU-WASM x86-64 CONFIGURATION
    ============================================================

    These are the generated assets from:

    ktock/qemu-wasm-demo-images

    The files are publicly available and are downloaded
    automatically by the browser.

    Nothing is stored permanently by this HTML.
*/

const IMAGE_BASE =
    "https://ktock.github.io/qemu-wasm-demo-images/alpine-x86_64/";

const RUNTIME_BASE = IMAGE_BASE;

/*
    QEMU arguments copied from the actual upstream
    Alpine x86-64 QEMU-Wasm demo.

    Networking is intentionally disabled for this first test.
    We want to prove the x86-64 VM itself works before adding
    browser networking.
*/

var Module = {

    arguments: [
        "-nographic",

        "-M", "pc",

        "-m", "512M",

        "-accel", "tcg,tb-size=500",

        "-L", "/pack-rom/",

        "-nic", "none",

        "-kernel", "/pack-kernel/vmlinuz-virt",

        "-initrd", "/pack-initramfs/initramfs-virt",

        "-append",
        "console=ttyS0 root=/dev/vda noautodetect hostname=browser-vm",

        "-drive",
        "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

        "-device",
        "virtio-blk-pci,drive=test"
    ],

    /*
        Every QEMU runtime/data file is downloaded from the
        public generated-assets repository.
    */
    locateFile: function(path, prefix) {
        return RUNTIME_BASE + path;
    },

    mainScriptUrlOrBlob:
        RUNTIME_BASE + "out.js"
};

</script>


<script type="module">

/*
    ============================================================
    BROWSER REQUIREMENT CHECK
    ============================================================
*/

const status = document.getElementById("status");

function setStatus(text, cls = "") {
    status.textContent = text;
    status.className = cls;
}

if (typeof WebAssembly === "undefined") {
    setStatus("WebAssembly is not supported.", "error");
    throw new Error("WebAssembly unavailable");
}

if (typeof SharedArrayBuffer === "undefined") {
    setStatus(
        "SharedArrayBuffer is unavailable. Check your Cloudflare COOP/COEP headers.",
        "error"
    );
    throw new Error("SharedArrayBuffer unavailable");
}

if (window.crossOriginIsolated !== true) {
    setStatus(
        "The page is not cross-origin isolated. Check COOP/COEP headers.",
        "error"
    );
    throw new Error("crossOriginIsolated === false");
}

setStatus("Browser requirements passed. Loading x86-64 QEMU...", "ok");


/*
    ============================================================
    LOAD XTERM
    ============================================================
*/

try {

    const xtermModule =
        await import(
            "https://unpkg.com/xterm@5.3.0/lib/xterm.js"
        );

    const ptyModule =
        await import(
            "https://unpkg.com/xterm-pty/index.js"
        );

    /*
        xterm normally exports Terminal.
        xterm-pty provides openpty().
    */

    const Terminal =
        xtermModule.Terminal ||
        window.Terminal;

    if (!Terminal) {
        throw new Error("Could not load xterm Terminal.");
    }

    /*
        Some versions expose openpty globally.
        Others expose it from the imported module.
    */

    const openptyFunction =
        ptyModule.openpty ||
        window.openpty;

    if (!openptyFunction) {
        throw new Error("Could not load xterm-pty.");
    }


    /*
        ========================================================
        CREATE TERMINAL
        ========================================================
    */

    const terminal = new Terminal({
        cursorBlink: true,
        convertEol: true,
        scrollback: 5000,
        fontSize: 14,
        theme: {
            background: "#000000",
            foreground: "#ffffff",
            cursor: "#ffffff"
        }
    });

    terminal.open(
        document.getElementById("terminal")
    );


    /*
        ========================================================
        CREATE PTY
        ========================================================
    */

    const pty = openptyFunction();

    const master = pty.master;
    const slave = pty.slave;

    terminal.loadAddon(master);

    Module.pty = slave;


    /*
        ========================================================
        LOAD THE GENERATED Emscripten DATA PACKAGES
        ========================================================

        These files populate QEMU's virtual filesystem:

        load-rootfs.data
        load-kernel.data
        load-initramfs.data
        load-rom.data
    */

    function loadScript(src) {

        return new Promise((resolve, reject) => {

            const script =
                document.createElement("script");

            script.src = src;

            script.onload = resolve;

            script.onerror = () => {
                reject(
                    new Error(
                        "Failed to load: " + src
                    )
                );
            };

            document.head.appendChild(script);
        });
    }


    setStatus(
        "Downloading Linux VM components...",
        "warn"
    );


    /*
        Important:

        Module.locateFile() above tells each generated
        .js data-loader where its corresponding .data
        file is located.
    */

    await loadScript(
        RUNTIME_BASE + "load-rootfs.js"
    );

    await loadScript(
        RUNTIME_BASE + "load-kernel.js"
    );

    await loadScript(
        RUNTIME_BASE + "load-initramfs.js"
    );

    await loadScript(
        RUNTIME_BASE + "load-rom.js"
    );


    /*
        ========================================================
        LOAD QEMU-WASM
        ========================================================
    */

    setStatus(
        "Loading QEMU-Wasm x86-64 runtime...",
        "warn"
    );

    /*
        The upstream runtime is Emscripten-generated.
        We import it as a module and pass our Module object.
    */

    const qemuModule =
        await import(
            RUNTIME_BASE + "out.js"
        );


    /*
        ========================================================
        START QEMU
        ========================================================
    */

    setStatus(
        "Starting x86-64 Linux...",
        "warn"
    );

    const initEmscriptenModule =
        qemuModule.default || qemuModule;


    /*
        QEMU's generated terminal handling expects the
        PTY to behave correctly when polling.
    */

    const oldPoll =
        Module.TTY &&
        Module.TTY.stream_ops &&
        Module.TTY.stream_ops.poll;

    if (oldPoll && Module.pty) {

        Module.TTY.stream_ops.poll =
            function(stream, timeout) {

                const pty = Module.pty;

                if (!pty.readable) {
                    return (
                        (pty.readable ? 1 : 0) |
                        (pty.writable ? 4 : 0)
                    );
                }

                return oldPoll.call(
                    this,
                    stream,
                    timeout
                );
            };
    }


    /*
        Start QEMU.
    */

    const instance =
        await initEmscriptenModule(Module);


    /*
        ========================================================
        SUCCESS
        ========================================================
    */

    setStatus(
        "Linux x86-64 VM running.",
        "ok"
    );

    terminal.focus();


} catch (error) {

    console.error(error);

    setStatus(
        "VM failed to start: " +
        (error && error.message
            ? error.message
            : String(error)),
        "error"
    );

    const terminalElement =
        document.getElementById("terminal");

    terminalElement.innerHTML =
        "<div style=\"" +
        "padding:20px;" +
        "font-family:monospace;" +
        "color:#ff6666;" +
        "white-space:pre-wrap;" +
        "\">" +
        "QEMU-Wasm startup error\\n\\n" +
        String(
            error && error.stack
                ? error.stack
                : error
        ) +
        "</div>";
}

</script>

</body>
</html>
