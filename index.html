
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Browser Linux x86-64 VM</title>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b10;
    color:#e8eef7;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#top {
    flex:0 0 auto;
    padding:10px 14px;
    background:#111722;
    border-bottom:1px solid #283242;
}

#title {
    font-weight:700;
    font-size:16px;
}

#status {
    margin-top:4px;
    color:#9aa9bd;
    font-size:13px;
    white-space:pre-wrap;
}

#terminal {
    flex:1 1 auto;
    min-height:0;
    padding:8px;
    box-sizing:border-box;
    overflow:hidden;
}

#terminal .xterm {
    height:100%;
}

#error {
    display:none;
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
    max-height:55%;
    overflow:auto;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #733;
    border-radius:10px;
    background:#210d0d;
    color:#ffb9b9;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    white-space:pre-wrap;
    z-index:20;
}

button {
    border:0;
    border-radius:8px;
    padding:9px 13px;
    background:#273449;
    color:white;
    font-weight:600;
    margin-top:8px;
}

button:active {
    transform:scale(.98);
}
</style>
</head>

<body>
<div id="app">

    <div id="top">
        <div id="title">Linux x86-64 browser VM</div>
        <div id="status">Starting…</div>
    </div>

    <div id="terminal"></div>

    <div id="error"></div>

</div>

<script type="module">

/*
    IMPORTANT

    This VM is deliberately non-persistent.

    Nothing is saved to IndexedDB/localStorage by this page.
    When the page is closed/reloaded, the VM state disappears.

    The QEMU-Wasm files below come from the public generated image
    repository used by the upstream QEMU-Wasm demo.
*/

const BASE =
    "https://raw.githubusercontent.com/ktock/qemu-wasm-demo-images/main/alpine-x86_64/";

const URLS = {
    wasm:
        BASE + "qemu-system-x86_64.wasm",

    qemuJS:
        BASE + "out.js",

    worker:
        BASE + "qemu-system-x86_64.worker.js",

    kernel:
        BASE + "load-kernel.js",

    initramfs:
        BASE + "load-initramfs.js",

    rootfs:
        BASE + "load-rootfs.js",

    rom:
        BASE + "load-rom.js"
};

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");

function status(message) {
    statusEl.textContent = message;
    console.log("[VM]", message);
}

function fail(message, error = null) {

    let details = message;

    if (error) {
        details +=
            "\n\n" +
            (error.stack || error.message || String(error));
    }

    console.error(details, error);

    errorEl.style.display = "block";
    errorEl.textContent = details;
    status("VM failed.");
}

/*
    Download a file explicitly.

    We do NOT let Emscripten perform the initial WASM download.
    The browser fetches it first so that:
      - HTTP status is checked
      - CORS is checked
      - the actual downloaded byte count is known
      - the resulting ArrayBuffer can be supplied directly
*/
async function download(url, label, expectedMinimum = 1) {

    status("Downloading " + label + "…");

    let response;

    try {
        response = await fetch(url, {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "no-store"
        });
    }
    catch (e) {
        throw new Error(
            "Network/CORS failure while downloading:\n" +
            label +
            "\n\nURL:\n" +
            url +
            "\n\nBrowser error:\n" +
            (e.message || e)
        );
    }

    if (!response.ok) {
        throw new Error(
            "HTTP " +
            response.status +
            " " +
            response.statusText +
            " while downloading:\n" +
            label +
            "\n\nURL:\n" +
            url
        );
    }

    const data = await response.arrayBuffer();

    if (data.byteLength < expectedMinimum) {
        throw new Error(
            "Downloaded file is unexpectedly small.\n\n" +
            "File: " + label + "\n" +
            "Bytes received: " + data.byteLength + "\n" +
            "URL: " + url
        );
    }

    console.log(
        "[VM] downloaded",
        label,
        data.byteLength.toLocaleString(),
        "bytes"
    );

    return data;
}


/*
    Convert downloaded JavaScript into a same-origin Blob URL.

    This is important for the pthread worker because the QEMU-Wasm
    build contains a dedicated worker.
*/
async function downloadTextAsBlobURL(url, label) {

    const bytes = await download(url, label, 50);

    const text = new TextDecoder().decode(bytes);

    if (!text.trim()) {
        throw new Error(label + " downloaded as an empty file.");
    }

    return URL.createObjectURL(
        new Blob(
            [text],
            { type:"text/javascript" }
        )
    );
}


/*
    Execute one of the generated Emscripten file-package loaders.

    These loaders populate QEMU's virtual filesystem with:
      - Linux kernel
      - initramfs
      - root filesystem
      - BIOS/ROM files
*/
async function loadPackageScript(url, label, Module) {

    status("Loading " + label + "…");

    const bytes = await download(url, label, 50);

    const text = new TextDecoder().decode(bytes);

    if (!text.includes("loadPackage")) {
        console.warn(
            "[VM] " + label +
            " does not contain the expected file-package loader."
        );
    }

    /*
        The generated loaders are classic scripts and expect a
        global Module variable.
    */
    window.Module = Module;

    const blobURL = URL.createObjectURL(
        new Blob(
            [text],
            { type:"text/javascript" }
        )
    );

    try {
        await new Promise((resolve, reject) => {

            const script = document.createElement("script");

            script.onload = () => {
                script.remove();
                URL.revokeObjectURL(blobURL);
                resolve();
            };

            script.onerror = () => {
                script.remove();
                URL.revokeObjectURL(blobURL);
                reject(
                    new Error(
                        "Could not execute " + label
                    )
                );
            };

            script.src = blobURL;

            document.head.appendChild(script);
        });
    }
    catch (e) {
        throw e;
    }
}


/*
    Main boot routine.
*/
async function boot() {

    let workerBlobURL = null;
    let qemuBlobURL = null;

    try {

        status("Checking browser requirements…");

        if (typeof WebAssembly === "undefined") {
            throw new Error(
                "WebAssembly is not available in this browser."
            );
        }

        if (typeof SharedArrayBuffer === "undefined") {
            throw new Error(
                "SharedArrayBuffer is unavailable.\n\n" +
                "QEMU-Wasm's pthread build requires cross-origin isolation.\n\n" +
                "Make sure Cloudflare Pages is sending:\n\n" +
                "Cross-Origin-Opener-Policy: same-origin\n" +
                "Cross-Origin-Embedder-Policy: require-corp"
            );
        }

        if (!crossOriginIsolated) {
            throw new Error(
                "The page is NOT cross-origin isolated.\n\n" +
                "crossOriginIsolated = false\n\n" +
                "Cloudflare Pages must send:\n\n" +
                "Cross-Origin-Opener-Policy: same-origin\n" +
                "Cross-Origin-Embedder-Policy: require-corp"
            );
        }

        status("Browser requirements passed.");

        /*
            --------------------------------------------------------
            1. Download QEMU WebAssembly
            --------------------------------------------------------
        */

        const wasmBinary = await download(
            URLS.wasm,
            "QEMU x86-64 WebAssembly",
            1000000
        );

        /*
            Check the WebAssembly magic number.

            A real WebAssembly binary begins with:
                00 61 73 6d
        */

        const wasmBytes = new Uint8Array(wasmBinary);

        if (
            wasmBytes[0] !== 0x00 ||
            wasmBytes[1] !== 0x61 ||
            wasmBytes[2] !== 0x73 ||
            wasmBytes[3] !== 0x6d
        ) {
            throw new Error(
                "The downloaded QEMU file is not a valid WebAssembly binary.\n\n" +
                "The server may have returned HTML/error text instead of the .wasm file."
            );
        }

        status(
            "QEMU WebAssembly downloaded successfully (" +
            wasmBinary.byteLength.toLocaleString() +
            " bytes)."
        );


        /*
            --------------------------------------------------------
            2. Download the pthread worker
            --------------------------------------------------------
        */

        workerBlobURL = await downloadTextAsBlobURL(
            URLS.worker,
            "QEMU pthread worker"
        );

        status("QEMU pthread worker prepared.");


        /*
            --------------------------------------------------------
            3. Download QEMU's generated JavaScript
            --------------------------------------------------------
        */

        qemuBlobURL = await downloadTextAsBlobURL(
            URLS.qemuJS,
            "QEMU JavaScript runtime"
        );

        status("QEMU JavaScript runtime prepared.");


        /*
            --------------------------------------------------------
            4. Load xterm
            --------------------------------------------------------
        */

        status("Loading terminal…");

        const [
            xtermModule,
            ptyModule
        ] = await Promise.all([
            import(
                "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm"
            ),
            import(
                "https://cdn.jsdelivr.net/npm/xterm-pty@0.9.0/+esm"
            )
        ]);

        const Terminal = xtermModule.Terminal;
        const { openpty } = ptyModule;

        const terminal = new Terminal({
            cursorBlink: true,
            convertEol: true,
            fontSize: 14,
            scrollback: 5000,
            theme: {
                background: "#080b10",
                foreground: "#e8eef7"
            }
        });

        terminal.open(
            document.getElementById("terminal")
        );

        /*
            xterm-pty gives QEMU the same kind of terminal connection
            used by the upstream demo.
        */
        const {
            master,
            slave
        } = openpty();

        terminal.loadAddon(master);


        /*
            --------------------------------------------------------
            5. Create Emscripten Module object
            --------------------------------------------------------
        */

        const Module = {

            /*
                Give Emscripten the WASM bytes directly.

                This is the important change from the previous version.
            */
            wasmBinary: wasmBinary,

            /*
                QEMU's pthread worker.

                Returning the Blob URL means the Worker itself is
                created from the same origin as this page.
            */
            locateFile(path, prefix) {

                if (
                    path === "qemu-system-x86_64.worker.js" ||
                    path.endsWith(".worker.js")
                ) {
                    return workerBlobURL;
                }

                /*
                    Emscripten may ask for the wasm file.
                    wasmBinary above normally prevents another download,
                    but this remains a safe fallback.
                */
                if (
                    path === "qemu-system-x86_64.wasm" ||
                    path.endsWith(".wasm")
                ) {
                    return URLS.wasm;
                }

                /*
                    Packaged filesystem data.
                */
                if (path.endsWith(".data")) {
                    return BASE + path;
                }

                return BASE + path;
            },

            /*
                Used by the pthread worker when it imports the main
                QEMU ES module.
            */
            mainScriptUrlOrBlob: qemuBlobURL,

            /*
                Connect QEMU's terminal to xterm-pty.
            */
            pty: slave,

            print(text) {
                terminal.write(
                    String(text).replace(/\n/g, "\r\n")
                );
            },

            printErr(text) {
                terminal.write(
                    "\r\n\x1b[31m" +
                    String(text) +
                    "\x1b[0m\r\n"
                );

                console.error("[QEMU]", text);
            },

            onAbort(reason) {
                fail(
                    "Emscripten/QEMU aborted:\n\n" +
                    String(reason)
                );
            },

            onExit(statusCode) {
                console.log(
                    "[QEMU] exited with status",
                    statusCode
                );
            }
        };


        /*
            Make Module globally visible for the generated
            file-package loaders.
        */
        window.Module = Module;


        /*
            --------------------------------------------------------
            6. Load the four generated filesystem packages
            --------------------------------------------------------
        */

        await loadPackageScript(
            URLS.kernel,
            "Linux kernel package",
            Module
        );

        await loadPackageScript(
            URLS.initramfs,
            "Linux initramfs package",
            Module
        );

        await loadPackageScript(
            URLS.rootfs,
            "Alpine root filesystem package",
            Module
        );

        await loadPackageScript(
            URLS.rom,
            "QEMU ROM package",
            Module
        );


        /*
            --------------------------------------------------------
            7. QEMU command line
            --------------------------------------------------------

            This mirrors the upstream Alpine x86-64 demonstration:

              - 512 MB RAM
              - x86 PC machine
              - TCG acceleration
              - kernel
              - initramfs
              - packaged root filesystem
              - virtio disk

            Networking is deliberately disabled for this first boot.
            That removes another independent failure point.
        */

        Module.arguments = [
            "-nographic",

            "-M",
            "pc",

            "-m",
            "512M",

            "-accel",
            "tcg,tb-size=500",

            "-L",
            "/pack-rom/",

            "-nic",
            "none",

            "-kernel",
            "/pack-kernel/vmlinuz-virt",

            "-initrd",
            "/pack-initramfs/initramfs-virt",

            "-append",
            "console=ttyS0 root=/dev/vda noautodetect hostname=browser-vm",

            "-drive",
            "id=test,file=/pack-rootfs/disk-rootfs.img,format=raw,if=none",

            "-device",
            "virtio-blk-pci,drive=test"
        ];


        /*
            --------------------------------------------------------
            8. Start QEMU
            --------------------------------------------------------
        */

        status("Starting x86-64 QEMU…");

        /*
            Import the generated ES module from the same-origin
            Blob URL.
        */
        const qemuModule =
            await import(qemuBlobURL);

        if (
            !qemuModule ||
            typeof qemuModule.default !== "function"
        ) {
            throw new Error(
                "The downloaded QEMU JavaScript did not expose " +
                "the expected Emscripten module factory."
            );
        }

        /*
            Emscripten's default export returns its initialization
            promise.
        */
        await qemuModule.default(Module);

        status(
            "Linux x86-64 VM started. " +
            "The terminal is live."
        );

    }
    catch (error) {

        fail(
            "VM startup failed.\n\n" +
            "The failure occurred while downloading or starting " +
            "the QEMU-Wasm x86-64 runtime.",
            error
        );

    }
}


/*
    Start only after the page has loaded.
*/
boot();

</script>
</body>
</html>
