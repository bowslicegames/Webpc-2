<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Debian i386 Browser VM</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #080b10;
    color: #e8edf2;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

#topbar {
    flex: 0 0 auto;
    min-height: 58px;
    padding: 8px;
    padding-top: max(8px, env(safe-area-inset-top));
    background: #111720;
    border-bottom: 1px solid #27303b;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

#title {
    font-weight: 700;
    margin-right: auto;
    white-space: nowrap;
}

button {
    appearance: none;
    border: 1px solid #394553;
    background: #1a222d;
    color: white;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 14px;
    min-height: 42px;
}

button:active {
    background: #2a3542;
    transform: scale(.98);
}

button.primary {
    background: #245c9c;
    border-color: #3477c2;
}

button.danger {
    background: #722c2c;
    border-color: #a53d3d;
}

#status {
    flex: 0 0 auto;
    padding: 7px 10px;
    background: #0d1218;
    color: #9da9b5;
    font-size: 13px;
    border-bottom: 1px solid #202832;
}

#main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

#screenWrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    overflow: auto;
    background: black;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

#screen_container {
    position: relative;
    margin: 0 auto;
}

#screen_container > div {
    position: relative;
}

#screen_container canvas {
    image-rendering: auto;
    max-width: none;
}

#terminal {
    flex: 0 0 190px;
    min-height: 130px;
    max-height: 35vh;
    background: #050709;
    border-top: 1px solid #29313a;
    display: flex;
    flex-direction: column;
}

#terminalOutput {
    flex: 1 1 auto;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    padding: 8px;
    color: #b9f5c3;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
}

#commandRow {
    display: flex;
    gap: 6px;
    padding: 7px;
    padding-bottom: max(7px, env(safe-area-inset-bottom));
    border-top: 1px solid #202832;
}

#command {
    flex: 1;
    min-width: 0;
    min-height: 43px;
    max-height: 100px;
    resize: none;
    border: 1px solid #394553;
    border-radius: 9px;
    background: #11161d;
    color: white;
    padding: 10px;
    font-family: ui-monospace, monospace;
    font-size: 14px;
}

#help {
    padding: 9px;
    font-size: 12px;
    line-height: 1.4;
    color: #8e9aa7;
    background: #0b0f14;
    border-top: 1px solid #202832;
}

#loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080b10;
    z-index: 20;
    text-align: center;
    padding: 25px;
}

#loadingBox {
    max-width: 600px;
}

#loadingTitle {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
}

#progressOuter {
    height: 10px;
    border-radius: 99px;
    background: #202832;
    overflow: hidden;
    margin-top: 15px;
}

#progressInner {
    width: 0%;
    height: 100%;
    background: #4387cf;
    transition: width .2s;
}

.hidden {
    display: none !important;
}

@media (orientation: landscape) and (max-height: 500px) {
    #terminal {
        flex-basis: 135px;
    }

    #topbar {
        min-height: 48px;
    }

    button {
        min-height: 36px;
        padding: 7px 10px;
    }
}
</style>
</head>

<body>

<div id="topbar">
    <div id="title">Debian i386 Browser VM</div>

    <button id="startBtn" class="primary">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn" class="danger">Reset VM</button>
    <button id="fullBtn">Fullscreen</button>
</div>

<div id="status">Waiting to start...</div>

<div id="main">

    <div id="screenWrap">

        <div id="loading">
            <div id="loadingBox">

                <div id="loadingTitle">
                    Preparing Debian i386 VM
                </div>

                <div id="loadingText">
                    Loading the virtual machine...
                </div>

                <div id="progressOuter">
                    <div id="progressInner"></div>
                </div>

            </div>
        </div>

        <div id="screen_container"></div>

    </div>

    <div id="terminal">

        <div id="terminalOutput">
            Browser VM console
        </div>

        <div id="commandRow">

            <textarea
                id="command"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="Type a serial command..."
            ></textarea>

            <button id="keyboardBtn">
                ⌨ Keyboard
            </button>

            <button id="sendBtn" class="primary">
                Send
            </button>

        </div>

        <div id="help">
            On iPad, tap Keyboard before typing.
            Enter sends the command. Shift+Enter inserts a new line.
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/v86@0.5.462/build/libv86.js"></script>

<script>
"use strict";

/*
    Debian i386 Browser VM
    ======================

    This page is designed for GitHub Pages.

    CPU:
        x86 / i386

    Target virtual disk:
        10 GiB

    Important:
        GitHub Pages is static hosting. A normal browser page cannot
        write directly back to a 10 GiB server-side disk.

        Therefore this file deliberately does NOT pretend that a
        remote static disk is writable.

        The final persistent version should use v86 split-image
        storage or an IndexedDB-backed disk layer.
*/

const V86_WASM =
    "https://cdn.jsdelivr.net/npm/v86@0.5.462/build/v86.wasm";

const SEA_BIOS =
    "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin";

const VGA_BIOS =
    "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin";

const DEBIAN_ISO =
    "https://cdimage.debian.org/cdimage/archive/12.15.0/i386/iso-cd/debian-12.15.0-i386-netinst.iso";

const TEN_GIB =
    10 * 1024 * 1024 * 1024;

let emulator = null;
let running = false;

const statusEl = document.getElementById("status");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const progressInner = document.getElementById("progressInner");
const terminalOutput = document.getElementById("terminalOutput");
const command = document.getElementById("command");

function status(text) {
    statusEl.textContent = text;
}

function log(text) {
    terminalOutput.textContent += text;
    terminalOutput.scrollTop = terminalOutput.scrollHeight;
}

function progress(percent, text) {
    progressInner.style.width =
        Math.max(0, Math.min(100, percent)) + "%";

    if (text) {
        loadingText.textContent = text;
    }
}

function showError(error) {
    console.error(error);

    loadingText.textContent =
        "Error: " + (error && error.message
            ? error.message
            : String(error));

    status("VM failed to start.");
}

async function fetchBinary(url, label) {

    progress(5, "Downloading " + label + "...");

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            label +
            " failed: HTTP " +
            response.status
        );
    }

    const buffer = await response.arrayBuffer();

    progress(15, label + " loaded.");

    return buffer;
}

async function startVM() {

    if (emulator) {
        emulator.run();

        running = true;

        status("VM running.");

        return;
    }

    try {

        document.getElementById("startBtn").disabled = true;

        status("Loading v86...");

        const wasmBuffer =
            await fetchBinary(V86_WASM, "v86 WebAssembly");

        progress(20, "Loading SeaBIOS...");

        const biosBuffer =
            await fetchBinary(SEA_BIOS, "SeaBIOS");

        progress(30, "Loading VGA BIOS...");

        const vgaBuffer =
            await fetchBinary(VGA_BIOS, "VGA BIOS");

        /*
            The Debian installer is streamed directly from Debian.

            It is intentionally not embedded into this HTML file.
            This keeps the GitHub repository practical.
        */

        progress(40, "Preparing Debian installer...");

        emulator = new V86({

            wasm_fn: async imports => {

                return await WebAssembly.instantiate(
                    wasmBuffer,
                    imports
                ).then(result => result.instance.exports);

            },

            memory_size:
                128 * 1024 * 1024,

            vga_memory_size:
                16 * 1024 * 1024,

            bios: {
                buffer: biosBuffer
            },

            vga_bios: {
                buffer: vgaBuffer
            },

            /*
                NOTE:

                This is intentionally a read-only streamed image
                configuration.

                The real 10 GiB persistent disk should be supplied
                as split v86 image parts in the repository.
            */

            cdrom: {
                url: DEBIAN_ISO,
                async: true
            },

            screen_container:
                document.getElementById("screen_container"),

            disable_mouse: false,
            disable_keyboard: false,
            disable_speaker: true,

            autostart: true,

            boot_order: 0x321

        });

        emulator.add_listener(
            "emulator-ready",
            () => {

                loading.classList.add("hidden");

                running = true;

                status(
                    "Debian i386 VM running."
                );

                log(
                    "\n[v86] Emulator ready.\n"
                );

            }
        );

        emulator.add_listener(
            "serial0-output-byte",
            byte => {

                log(
                    String.fromCharCode(byte)
                );

            }
        );

        emulator.add_listener(
            "emulator-started",
            () => {

                status(
                    "VM started."
                );

            }
        );

        progress(
            100,
            "Starting virtual machine..."
        );

        log(
            "\n[v86] Starting...\n"
        );

    } catch (error) {

        showError(error);

    } finally {

        document.getElementById("startBtn").disabled = false;

    }
}

document.getElementById("startBtn")
    .addEventListener(
        "click",
        startVM
    );

document.getElementById("pauseBtn")
    .addEventListener(
        "click",
        async () => {

            if (!emulator) {
                return;
            }

            if (running) {

                await emulator.stop();

                running = false;

                status("VM paused.");

            } else {

                await emulator.run();

                running = true;

                status("VM running.");

            }

        }
    );

document.getElementById("resetBtn")
    .addEventListener(
        "click",
        () => {

            if (!emulator) {
                location.reload();
                return;
            }

            if (
                confirm(
                    "Restart the virtual machine?"
                )
            ) {

                emulator.restart();

                running = true;

                status(
                    "VM restarted."
                );

            }

        }
    );

document.getElementById("fullBtn")
    .addEventListener(
        async () => {

            const element =
                document.documentElement;

            try {

                if (
                    document.fullscreenElement
                ) {

                    await document.exitFullscreen();

                } else if (
                    element.requestFullscreen
                ) {

                    await element.requestFullscreen();

                } else {

                    alert(
                        "Fullscreen is not available in this browser."
                    );

                }

            } catch (error) {

                console.error(error);

            }

        }
    );

document.getElementById("keyboardBtn")
    .addEventListener(
        () => {

            command.focus();

        }
    );

document.getElementById("sendBtn")
    .addEventListener(
        () => {

            if (!emulator) {
                return;
            }

            const value =
                command.value;

            if (!value) {
                return;
            }

            try {

                emulator.serial0_send(
                    value + "\n"
                );

                log(
                    "\n> " + value + "\n"
                );

                command.value = "";

            } catch (error) {

                log(
                    "\n[serial error] " +
                    error.message +
                    "\n"
                );

            }

        }
    );

command.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            document
                .getElementById("sendBtn")
                .click();

        }

    }
);

window.addEventListener(
    "beforeunload",
    event => {

        /*
            Do not claim that the VM is automatically persisted.
            The persistent disk implementation will be added once
            the split/IndexedDB backing store is supplied.
        */

        if (
            emulator &&
            running
        ) {

            event.preventDefault();

            event.returnValue =
                "The VM is still running.";

        }

    }
);

</script>

</body>
</html>
