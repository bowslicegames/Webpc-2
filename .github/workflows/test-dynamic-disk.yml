name: Boot-test WebPC guest with dynamic disk

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-dynamic-disk.yml"

# Re-run after each disk release so the exact published image is boot-tested.
permissions:
  contents: read

jobs:
  qemu-guest-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out WebPC 2
        uses: actions/checkout@v4

      - name: Install host QEMU and disk utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Download the published guest disk and boot assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p work
          gh release download V1 --repo "${{ github.repository }}" \
            --pattern "disk-rootfs-qcow2.img" \
            --pattern "qemu-system-x86_64.wasm" \
            --pattern "qemu-system-x86_64.worker.js" \
            --pattern "out.js" \
            --pattern "load-kernel.data" \
            --pattern "load-kernel.js" \
            --pattern "load-initramfs.data" \
            --pattern "load-initramfs.js" \
            --dir work
          for f in disk-rootfs-qcow2.img qemu-system-x86_64.wasm qemu-system-x86_64.worker.js out.js load-kernel.data load-kernel.js load-initramfs.data load-initramfs.js; do
            test -s "work/$f"
          done
          qemu-img check work/disk-rootfs-qcow2.img
          qemu-img info --output=json work/disk-rootfs-qcow2.img > work/disk-info.json
          python3 <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path("work/disk-info.json").read_text())
          assert info.get("format") == "qcow2", info
          assert info.get("virtual-size") == 8*1024*1024*1024, info
          physical=Path("work/disk-rootfs-qcow2.img").stat().st_size
          assert physical < 8*1024*1024*1024, physical
          print(f"PASS: 8 GiB virtual disk, {physical} physical bytes.")
          PY

      - name: Decode the actual kernel and initramfs using WebPC's LZ4 loader
        run: |
          set -eux
          cat > work/extract-boot-files.cjs <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const { pathToFileURL } = require("node:url");

          global.require = require;
          global.process = process;
          global.location = { href: pathToFileURL(process.cwd() + "/").href, pathname: "/" };
          global.Module = {
            wasmBinary: fs.readFileSync("work/qemu-system-x86_64.wasm"),
            mainScriptUrlOrBlob: pathToFileURL(path.resolve("work/out.js")).href,
            noInitialRun: true,
            noExitRuntime: true,
            preRun: [],
            pty: { onSignal: () => {}, onReadable: () => {}, onData: () => {}, write: () => {}, resize: () => {} },
            locateFile: name => path.resolve("work", name),
            print: (...args) => console.log("[QEMU WASM]", ...args),
            printErr: (...args) => console.error("[QEMU WASM]", ...args)
          };
          for (const loader of ["load-kernel.js", "load-initramfs.js"]) {
            vm.runInThisContext(fs.readFileSync(path.join("work", loader), "utf8"), { filename: loader });
          }
          (async () => {
            const qemu = await import(pathToFileURL(path.resolve("work/out.js")).href);
            await qemu.default(global.Module);
            const kernel = global.Module.FS.readFile("/pack-kernel/vmlinuz-virt");
            const initramfs = global.Module.FS.readFile("/pack-initramfs/initramfs-virt");
            if (kernel.byteLength < 1024 * 1024 || initramfs.byteLength < 1024 * 1024) {
              throw new Error("Decoded kernel or initramfs is unexpectedly small.");
            }
            fs.writeFileSync("work/vmlinuz-virt", kernel);
            fs.writeFileSync("work/initramfs-virt", initramfs);
            console.log("Decoded kernel:", kernel.byteLength, "bytes; initramfs:", initramfs.byteLength, "bytes.");
            process.exit(0);
          })().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          JS
          node work/extract-boot-files.cjs

      - name: Boot Linux with the 8 GiB qcow2 disk attached
        run: |
          set -eux
          cat > work/boot-test.py <<'PY'
          import os, re, select, subprocess, sys, time
          cmd = [
              "qemu-system-x86_64", "-M", "pc", "-m", "512M", "-accel", "tcg", "-nic", "none",
              "-kernel", "work/vmlinuz-virt", "-initrd", "work/initramfs-virt",
              "-append", "earlyprintk=ttyS0 console=ttyS0 root=/dev/vda loglevel=7 hostname=webpc2",
              "-drive", "id=test,file=work/disk-rootfs-qcow2.img,format=qcow2,if=none",
              "-device", "virtio-blk-pci,drive=test", "-nographic", "-no-reboot"
          ]
          proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, bufsize=0)
          deadline = time.monotonic() + 90
          seen = ""
          with open("work/boot.log", "w", encoding="utf-8", errors="replace") as log:
              while time.monotonic() < deadline:
                  ready, _, _ = select.select([proc.stdout], [], [], 1.0)
                  if ready:
                      chunk = os.read(proc.stdout.fileno(), 4096)
                      if not chunk:
                          break
                      piece = chunk.decode("utf-8", errors="replace")
                      log.write(piece); log.flush()
                      sys.stdout.write(piece); sys.stdout.flush()
                      seen = (seen + piece)[-20000:]
                      if re.search(r"webpc login:|login:", seen, re.I):
                          proc.terminate()
                          try: proc.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              proc.kill(); proc.wait(timeout=5)
                          print("\nPASS: Linux reached its login prompt with the published 8 GiB qcow2 disk.")
                          sys.exit(0)
                  if proc.poll() is not None:
                      break
          if proc.poll() is None:
              proc.kill()
              proc.wait(timeout=5)
          print("FAIL: Linux did not reach a login prompt.")
          try:
              with open("work/boot.log", encoding="utf-8", errors="replace") as log:
                  print(log.read()[-12000:])
          except OSError:
              pass
          sys.exit(1)
          PY
          python3 work/boot-test.py