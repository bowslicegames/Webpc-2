name: Build and enable dynamic 8 GiB WebPC disk

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-dynamic-disk.yml"

permissions:
  contents: write

concurrency:
  group: webpc-dynamic-disk-release
  cancel-in-progress: false

jobs:
  build-dynamic-disk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WebPC 2
        uses: actions/checkout@v4

      - name: Install disk image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs qemu-utils python3

      - name: Download the current known-good runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p work
          gh release download V1 --repo "${{ github.repository }}" \
            --pattern "load-rootfs.data" \
            --pattern "load-rootfs.js" \
            --pattern "out.js" \
            --pattern "qemu-system-x86_64.wasm" \
            --pattern "qemu-system-x86_64.worker.js" \
            --dir work
          test -s work/load-rootfs.data
          test -s work/load-rootfs.js
          test -s work/out.js
          test -s work/qemu-system-x86_64.wasm
          grep -a -qi 'qcow2' work/qemu-system-x86_64.wasm

      - name: Extract the disk using WebPC's real Emscripten LZ4 decoder
        run: |
          set -eux
          cat > work/extract-rootfs.cjs <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const { pathToFileURL } = require("node:url");

          global.require = require;
          global.process = process;
          global.location = { href: pathToFileURL(process.cwd() + "/").href, pathname: "/" };
          global.Module = {
            wasmBinary: fs.readFileSync("work/qemu-system-x86_64.wasm"),
            noInitialRun: true,
            noExitRuntime: true,
            preRun: [],
            pty: { onSignal: () => {}, onReadable: () => {}, onData: () => {}, write: () => {}, resize: () => {} },
            print: (...args) => console.log("[qemu]", ...args),
            printErr: (...args) => console.error("[qemu]", ...args),
            locateFile: (name) => {
              if (name === "load-rootfs.data") return path.resolve("work/load-rootfs.data");
              if (name === "qemu-system-x86_64.wasm") return path.resolve("work/qemu-system-x86_64.wasm");
              return path.resolve("work", name);
            },
            mainScriptUrlOrBlob: pathToFileURL(path.resolve("work/out.js")).href
          };

          vm.runInThisContext(fs.readFileSync("work/load-rootfs.js", "utf8"), { filename: "load-rootfs.js" });

          (async () => {
            const imported = await import(pathToFileURL(path.resolve("work/out.js")).href);
            if (typeof imported.default !== "function") throw new Error("QEMU Emscripten factory was not exported.");
            await imported.default(global.Module);
            if (!global.Module.FS || typeof global.Module.FS.readFile !== "function") {
              throw new Error("Emscripten FS was not exposed after initialization.");
            }
            const image = global.Module.FS.readFile("/pack-rootfs/disk-rootfs.img");
            if (!image || image.byteLength < 64 * 1024 * 1024) {
              throw new Error("LZ4 decoder did not produce a plausible disk image.");
            }
            fs.writeFileSync("work/disk-rootfs.raw", image);
            console.log("Extracted guest disk through Module.LZ4:", image.byteLength, "bytes");
            process.exit(0);
          })().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          JS
          node work/extract-rootfs.cjs
          file work/disk-rootfs.raw
          test "$(sudo blkid -p -s TYPE -o value work/disk-rootfs.raw)" = "ext4"

      - name: Expand the ext4 filesystem to 8 GiB
        run: |
          set -eux
          target=8589934592
          source_size="$(stat -c '%s' work/disk-rootfs.raw)"
          test "$source_size" -lt "$target"
          sudo truncate -s "$target" work/disk-rootfs.raw
          set +e
          sudo e2fsck -f -p work/disk-rootfs.raw
          rc=$?
          set -e
          test "$rc" -le 1
          sudo resize2fs work/disk-rootfs.raw
          set +e
          sudo e2fsck -f -p work/disk-rootfs.raw
          rc=$?
          set -e
          test "$rc" -le 1
          sudo dumpe2fs -h work/disk-rootfs.raw 2>/dev/null | grep -E 'Block size|Block count|Free blocks'
          test "$(stat -c '%s' work/disk-rootfs.raw)" -eq "$target"

      - name: Convert to a sparse dynamically growing qcow2 disk
        run: |
          set -eux
          qemu-img convert -p -c -f raw -O qcow2 -o compat=1.1,lazy_refcounts=on \
            work/disk-rootfs.raw work/disk-rootfs-qcow2.img
          qemu-img check work/disk-rootfs-qcow2.img
          qemu-img info --output=json work/disk-rootfs-qcow2.img > work/qcow2-info.json
          python3 <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path("work/qcow2-info.json").read_text())
          expected = 8 * 1024 * 1024 * 1024
          if info.get("format") != "qcow2":
              raise SystemExit(f"Wrong disk format: {info.get('format')}")
          if info.get("virtual-size") != expected:
              raise SystemExit(f"Wrong virtual size: {info.get('virtual-size')}")
          actual = Path("work/disk-rootfs-qcow2.img").stat().st_size
          if actual >= expected:
              raise SystemExit(f"qcow2 is not sparse: physical size {actual}")
          print(f"Verified disk: {expected} virtual bytes; {actual} physical bytes.")
          PY

      - name: Verify the converted image preserves the expanded ext4 filesystem
        run: |
          set -eux
          qemu-img convert -f qcow2 -O raw work/disk-rootfs-qcow2.img work/roundtrip.raw
          test "$(stat -c '%s' work/roundtrip.raw)" -eq 8589934592
          set +e
          sudo e2fsck -f -n work/roundtrip.raw
          rc=$?
          set -e
          test "$rc" -le 1
          rm -f work/roundtrip.raw
          ls -lh work/disk-rootfs-qcow2.img

      - name: Publish the new disk image without touching old assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release upload V1 \
            work/disk-rootfs-qcow2.img#disk-rootfs-qcow2.img \
            --repo "${{ github.repository }}" --clobber

      - name: Switch WebPC to the dynamic disk
        run: |
          set -eux
          python3 <<'PY'
          import re
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()

          def once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match for {old!r}, got {count}")
              s = s.replace(old, new)

          once('    rootfsData:\n        "load-rootfs.data",\n\n    rootfsLoader:\n        "load-rootfs.js",',
               '    rootfsDisk:\n        "disk-rootfs-qcow2.img",')
          once('    "load-rootfs.data":\n        82611515,',
               '    "disk-rootfs-qcow2.img":\n        PLACEHOLDER_DISK_SIZE,')
          disk_size = Path("work/disk-rootfs-qcow2.img").stat().st_size
          s = s.replace("PLACEHOLDER_DISK_SIZE", str(disk_size))
          once('        FILES.rootfsData,\n        FILES.rootfsLoader,',
               '        FILES.rootfsDisk,')
          once('    await downloadAsset(\n        FILES.rootfsData,\n        "rootfs",\n        "Downloading the Alpine Linux root filesystem."\n    );',
               '    let rootDiskBlob = await downloadAsset(\n        FILES.rootfsDisk,\n        "rootfs",\n        "Downloading the sparse 8 GiB virtual disk (only allocated blocks are transferred)."\n    );\n    let rootDiskBinary = await rootDiskBlob.arrayBuffer();\n    downloaded.delete(FILES.rootfsDisk);\n    rootDiskBlob = null;')
          once('        FILES.rootfsLoader\n    ];',
               '    ];')
          once('    preRun:\n            []',
               '    preRun:\n            [mod => {\n                try { mod.FS.mkdir("/pack-rootfs"); } catch (_) {}\n                mod.FS.writeFile("/pack-rootfs/disk-rootfs.img", new Uint8Array(rootDiskBinary));\n                rootDiskBinary = null;\n            }]')
          once('    await loadScript(\n        blobURL(\n            FILES.rootfsLoader\n        )\n    );',
               '    // The qcow2 guest disk is written into MEMFS in Module.preRun; no huge raw disk is preloaded.')
          once('const ASSET_CACHE_NAME = "webpc-runtime-assets-v1-20261011";',
               'const ASSET_CACHE_NAME = "webpc-runtime-assets-v2-20261011-qcow2";')
          p.write_text(s)
          PY
          python3 <<'PY'
          from pathlib import Path
          p=Path("_worker.js")
          s=p.read_text()
          anchor='  "load-rootfs.js",'
          if s.count(anchor) != 1:
              raise SystemExit("Cannot find the current rootfs asset allowlist entry.")
          s=s.replace(anchor, anchor+'\n  "disk-rootfs-qcow2.img",')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable sparse dynamic 8 GiB qcow2 guest disk"
          INDEX_COMMIT="$(git rev-parse HEAD)"
          python3 - "$INDEX_COMMIT" <<'PY'
          import sys
          from pathlib import Path
          p=Path("_worker.js")
          s=p.read_text()
          old='"5a1beed1bb19baea105f165dd702423b08c0df29"'
          new='"'+sys.argv[1]+'"'
          if s.count(old) != 1:
              raise SystemExit("Unexpected Worker static commit pin; refusing to overwrite.")
          p.write_text(s.replace(old,new))
          PY
          git add _worker.js
          git commit -m "Serve the dynamic disk image"
          git push origin HEAD:main

      - name: Verify the published disk asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release view V1 --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | select(.name == "disk-rootfs-qcow2.img") | {name,size}'
