name: Check deployed WebPC Worker assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-live-worker.yml"
      - "_worker.js"
      - "stack.js"

# This runs after release rebuilds to catch stale Worker asset pins and stale disk bytes.
permissions:
  contents: read

jobs:
  live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for the latest Worker deployment and verify its desktop
        run: |
          set -eux
          mkdir -p work
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 \
              https://webpc.bowslicegames.workers.dev/index.html -o work/live-index.html; then
              if grep -Fq 'Actual used blocks still consume browser memory' work/live-index.html \
                && grep -Fq 'webpcRunGuestForService' work/live-index.html \
                && grep -Fq 'format=qcow2' work/live-index.html \
                && grep -Fq 'apk add --no-cache unzip' work/live-index.html \
                && grep -Fq 'wget -q -T 5 -O /dev/null https://example.com' work/live-index.html; then
                ready=1
                break
              fi
            fi
            echo "Waiting for the newest Worker deployment (attempt $attempt/24)…"
            sleep 5
          done
          test "$ready" -eq 1
          grep -F 'disk-rootfs-qcow2.img' work/live-index.html
          grep -F 'id="installJava"' work/live-index.html
          grep -F 'id="fileDownloadUrl"' work/live-index.html
          grep -F 'id="networkTest"' work/live-index.html
          grep -F 'webpcShellReadyNow' work/live-index.html
          grep -F 'apk add --no-cache unzip' work/live-index.html
          grep -F 'wget -q -T 5 -O /dev/null https://example.com' work/live-index.html
          # Exercise a multi-megabyte binary response through the same-origin
          # network relay. The /range endpoint has a deterministic byte pattern,
          # so this checks both exact length and payload integrity, not just HTTP 200.
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 120 \
            -D work/proxy-headers.txt \
            -H 'X-WebPC-Proxy-Target: https://httpbin.org/range/8388608' \
            https://webpc.bowslicegames.workers.dev/net-proxy \
            -o work/proxy-large.bin
          grep -Fiq 'X-WebPC-Proxy-Body: streamed' work/proxy-headers.txt
          test "$(wc -c < work/proxy-large.bin | tr -d ' ')" -eq 8388608
          node <<'NODE'
          const fs = require("fs");
          const actual = fs.readFileSync("work/proxy-large.bin");
          const expected = Buffer.alloc(8388608);
          for (let i = 0; i < expected.length; i++) expected[i] = i % 256;
          if (!actual.equals(expected)) {
            let first = 0;
            while (first < Math.min(actual.length, expected.length) && actual[first] === expected[first]) first++;
            throw new Error("Large proxy payload differs at byte " + first + " (actual size " + actual.length + ")");
          }
          console.log("Verified 8 MiB proxy payload byte-for-byte");
          NODE

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 60 -I \
            https://webpc.bowslicegames.workers.dev/assets/disk-rootfs-qcow2.img
