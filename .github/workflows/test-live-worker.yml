name: Check deployed WebPC Worker assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-live-worker.yml"
      - "_worker.js"
      - "index.html"
      - "stack.js"
      - "wrangler.toml"

# This runs after release rebuilds to catch stale Worker asset pins and stale disk bytes.
permissions:
  contents: read

jobs:
  live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the expected Worker revision
        uses: actions/checkout@v4

      - name: Wait for the latest Worker deployment and verify its desktop
        run: |
          set -eux
          mkdir -p work
          curl --fail --silent --show-error --location --max-time 30 \
            https://api.github.com/repos/bowslicegames/Webpc-2/releases/tags/V1 \
            -o work/release.json
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const match = html.match(/const KNOWN_SIZES = \{([\s\S]*?)\n\};/);
          if (!match) throw new Error("Runtime size manifest is missing");
          const known = Object.fromEntries([...match[1].matchAll(/"([^"]+)":\s*(\d+)/g)]
            .map(item => [item[1], Number(item[2])]));
          const release = JSON.parse(fs.readFileSync("work/release.json", "utf8"));
          const actual = Object.fromEntries(release.assets.map(asset => [asset.name, asset.size]));
          for (const [name, size] of Object.entries(known)) {
            const expected = name === "stack.js" ? fs.statSync("stack.js").size : actual[name];
            if (expected === undefined) throw new Error("Manifest asset is absent from Release V1: " + name);
            if (size !== expected) throw new Error("Incorrect size for " + name + ": manifest " + size + ", actual " + expected);
          }
          console.log("Verified", Object.keys(known).length, "runtime asset sizes against Release V1 and the pinned stack module.");
          NODE
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 \
              https://webpc.bowslicegames.workers.dev/index.html -o work/live-index.html; then
              if grep -Fq 'Actual used blocks still consume browser memory' work/live-index.html \
                && grep -Fq 'webpcRunGuestForService' work/live-index.html \
                && grep -Fq 'format=qcow2' work/live-index.html \
                && grep -Fq 'const ASSET_CACHE_NAME = "webpc-runtime-assets-v4-' work/live-index.html \
                && grep -Fq 'Discarding invalid cached WebPC asset:' work/live-index.html \
                && grep -Fq 'const BASE_HOME = "/root";' work/live-index.html \
                && grep -Fq 'value="/root/Desktop"' work/live-index.html \
                && grep -Fq 'WEBPC_APKINDEX_OK' work/live-index.html \
                && grep -Fq 'APKINDEX.tar.gz' work/live-index.html \
                && grep -Fq 'apk add --no-cache unzip' work/live-index.html \
                && grep -Fq 'wget -q -T 8 -O /dev/null https://example.com' work/live-index.html; then
                ready=1
                break
              fi
            fi
            echo "Waiting for the newest Worker deployment (attempt $attempt/24)…"
            sleep 5
          done
          test "$ready" -eq 1
          grep -F 'disk-rootfs-qcow2.img' work/live-index.html
          grep -F 'id="installJava"' work/live-index.html
          grep -F 'id="fileDownloadUrl"' work/live-index.html
          grep -F 'id="networkTest"' work/live-index.html
          grep -F 'webpcShellReadyNow' work/live-index.html
          grep -F 'apk add --no-cache unzip' work/live-index.html
          grep -F 'wget -q -T 8 -O /dev/null https://example.com' work/live-index.html
          # Wait for the Worker script itself to deploy, not just the static
          # HTML asset bundle. A small request verifies the new streaming marker.
          proxy_ready=0
          for attempt in $(seq 1 24); do
            proxy_status="$(curl --silent --show-error --location --max-time 20 \
              -D work/proxy-probe-headers.txt \
              -H 'X-WebPC-Proxy-Target: https://example.com' \
              https://webpc.bowslicegames.workers.dev/net-proxy \
              -o work/proxy-probe.txt -w '%{http_code}' || true)"
            if [ "$proxy_status" = "200" ] && grep -Fiq 'X-WebPC-Proxy-Body: streamed' work/proxy-probe-headers.txt; then
              proxy_ready=1
              break
            fi
            echo "Waiting for the streaming proxy Worker (attempt $attempt/24, HTTP $proxy_status)…"
            sleep 5
          done
          test "$proxy_ready" -eq 1

          # Exercise the actual Alpine package-index CDN through the Worker
          # relay and verify that the streamed gzip payload is intact.
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 60 \
            -H 'X-WebPC-Proxy-Target: https://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/APKINDEX.tar.gz' \
            https://webpc.bowslicegames.workers.dev/net-proxy \
            -o work/alpine-main-index.tar.gz
          gzip -t work/alpine-main-index.tar.gz

          # Check the exact BellSoft Java 21 APK URL used by the desktop app.
          bellsoft_status="$(curl --silent --show-error --location --head --max-time 30 \
            -H 'X-WebPC-Proxy-Target: https://download.bell-sw.com/java/21.0.12+10/bellsoft-jdk21.0.12+10-linux-x64-musl.apk' \
            https://webpc.bowslicegames.workers.dev/net-proxy -o /dev/null -w '%{http_code}')"
          test "$bellsoft_status" = "200"

          # A missing binary URL must not return a saveable HTML error page.
          binary_error_status="$(curl --silent --show-error --location --max-time 20 \
            -D work/binary-error-headers.txt \
            -H 'X-WebPC-Proxy-Target: https://example.com/nonexistent-webpc-test.wasm' \
            https://webpc.bowslicegames.workers.dev/net-proxy \
            -o work/binary-error.txt -w '%{http_code}')"
          test "$binary_error_status" = "502"
          grep -Fq 'WebPC network relay refused binary download' work/binary-error.txt
          if grep -Eiq '<html|<!doctype' work/binary-error.txt; then
            echo "Binary error response unexpectedly contains HTML"
            exit 1
          fi

          # Wait for the Worker to report the exact STATIC_COMMIT configured
          # in this checkout. A streaming proxy header alone can come from an
          # older deployment and is not proof that the new stack module is live.
          expected_stack_pin="$(node -e 'const s=require("fs").readFileSync("_worker.js","utf8"); const m=s.match(/const STATIC_COMMIT =\s*"([0-9a-f]+)"/); if(!m) process.exit(2); process.stdout.write(m[1]);')"
          stack_ready=0
          for attempt in $(seq 1 24); do
            curl --silent --show-error --location --max-time 20 \
              -D work/stack-headers.txt \
              https://webpc.bowslicegames.workers.dev/assets/stack.js \
              -o work/live-stack.js || true
            if grep -Fiq "X-WebPC-Static-Commit: $expected_stack_pin" work/stack-headers.txt; then
              stack_ready=1
              break
            fi
            echo "Waiting for Worker stack pin $expected_stack_pin (attempt $attempt/24)…"
            sleep 5
          done
          test "$stack_ready" -eq 1
          # Confirm the live Worker serves the new bridge module, not a stale
          # pinned copy that still buffers whole responses.
          grep -Fq 'MAX_RESPONSE_BUFFER_BYTES' work/live-stack.js
          grep -Fq 'pumpResponseBody' work/live-stack.js
          grep -Fq 'scheduleSockRecvDrain' work/live-stack.js
          grep -Fq 'sockRecvPendingLengths' work/live-stack.js
          if grep -Fq 'Atomics.wait(' work/live-stack.js; then
            echo "Live stack.js still blocks on Atomics.wait"
            exit 1
          fi
          if grep -Fq 'resp.arrayBuffer()' work/live-stack.js; then
            echo "Live stack.js still buffers complete HTTP responses"
            exit 1
          fi

          # Compare the same 40 MB immutable release asset through the direct
          # asset route and the guest-network relay. This verifies full-body
          # length and byte-for-byte integrity without depending on a third-party
          # test endpoint's availability or rate limits.
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 180 \
            https://webpc.bowslicegames.workers.dev/assets/qemu-system-x86_64.wasm \
            -o work/direct-large.bin
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 180 \
            -D work/proxy-headers.txt \
            -H 'X-WebPC-Proxy-Target: https://github.com/bowslicegames/Webpc-2/releases/download/V1/qemu-system-x86_64.wasm' \
            https://webpc.bowslicegames.workers.dev/net-proxy \
            -o work/proxy-large.bin
          grep -Fiq 'X-WebPC-Proxy-Body: streamed' work/proxy-headers.txt
          test "$(wc -c < work/proxy-large.bin | tr -d ' ')" -eq "$(wc -c < work/direct-large.bin | tr -d ' ')"
          cmp work/direct-large.bin work/proxy-large.bin
          echo "Verified large proxy payload byte-for-byte"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 60 -I \
            https://webpc.bowslicegames.workers.dev/assets/disk-rootfs-qcow2.img
