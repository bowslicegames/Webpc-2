name: Check deployed WebPC Worker assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-live-worker.yml"

permissions:
  contents: read

jobs:
  live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the live Worker serves the new desktop and disk
        run: |
          set -eux
          mkdir -p work
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 \
            https://webpc.bowslicegames.workers.dev/index.html -o work/live-index.html
          grep -F 'disk-rootfs-qcow2.img' work/live-index.html
          grep -F 'format=qcow2' work/live-index.html
          grep -F 'id="installJava"' work/live-index.html
          grep -F 'id="fileDownloadUrl"' work/live-index.html
          grep -F 'id="networkTest"' work/live-index.html
          grep -F 'webpcRunGuestForService' work/live-index.html
          grep -F 'webpcShellReadyNow' work/live-index.html
          grep -F 'Actual used blocks still consume browser memory' work/live-index.html
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 60 -I \
            https://webpc.bowslicegames.workers.dev/assets/disk-rootfs-qcow2.img
