name: Validate WebPC

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker JavaScript syntax
        run: node --check _worker.js

      - name: Check browser boot test syntax and workflow presence
        run: |
          node --check tests/webpc-boot-test.mjs
          test -s .github/workflows/boot-test.yml
          grep -Fq 'waitForFunction' tests/webpc-boot-test.mjs
          grep -Fq 'webpc-opfs' tests/webpc-boot-test.mjs

      - name: Check graphics transport and QEMU ABI starter
        run: |
          node --check graphics-bridge.js
          node --check graphics-qemu-adapter.js
          node --check webpc-gpu.js
          node tools/test-webpc-gpu.cjs
          node --check minecraft-touch.js
          node tools/test-graphics-bridge.cjs
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Iqemu-webpc-display qemu-webpc-display/webpc-display-abi.c
          python3 tools/test-qemu-webpc-patcher.py
          cc -DWEBPC_NATIVE_TEST -std=c11 -Wall -Wextra -Werror -Iqemu-webpc-display tools/test-webpc-display-abi.c qemu-webpc-display/webpc-display-abi.c -o /tmp/test-webpc-display-abi
          /tmp/test-webpc-display-abi

      - name: Check guest framebuffer bridge and tests
        run: |
          node --check graphics-bridge.js
          node tools/test-graphics-bridge.cjs

      - name: Check streaming network bridge syntax and invariants
        run: |
          node --input-type=module --check < stack.js
          node <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("stack.js", "utf8");
          const required = [
            "MAX_RESPONSE_BUFFER_BYTES",
            "serveResponseChunks",
            "pumpResponseBody",
            "respBodyBytes >= MAX_RESPONSE_BUFFER_BYTES",
            "Never report a truncated transfer as clean EOF"
          ];
          for (const marker of required) {
            if (!source.includes(marker)) {
              throw new Error("Streaming bridge invariant missing: " + marker);
            }
          }
          if (source.includes("resp.arrayBuffer()")) {
            throw new Error("Response body must not be fully buffered with arrayBuffer()");
          }
          if (source.includes("appendData(s, req_.body)")) {
            throw new Error("Request body must not be repeatedly concatenated");
          }
          NODE
          node tools/test-network-stream.mjs
          node tools/test-network-socket.mjs

      - name: Syntax-check every inline browser script and validate DOM references
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          if (!html.includes("stat -c %s") || html.includes("wc -c <")) {
            throw new Error("File listing/upload size checks must use filesystem metadata, not reread file contents");
          }
          if (!html.includes("__webpc_exit_code=$?") || !html.includes("_END_FAIL__")) {
            throw new Error("Desktop command broker must report guest command failures");
          }
          if (html.includes("browserLoading")) {
            throw new Error("Stale browserLoading reference remains in the desktop lifecycle code");
          }
          if (!html.includes('const BASE_HOME = "/root";') ||
              !html.includes('value="/root/Desktop"')) {
            throw new Error("File Manager home must match the Alpine root account's /root home");
          }
          for (const marker of ['id="memoryCheck"', 'id="enableZram"', '/sys/block/zram0/disksize', 'vm.swappiness=80', 'WEBPC_ZRAM_UNAVAILABLE', 'WEBGL_lose_context']) {
            if (!html.includes(marker)) throw new Error("GPU/memory optimisation marker missing: " + marker);
          }
          for (const marker of ['id="graphicsSelfTest"', 'id="graphicsTestCanvas"', 'gl.readPixels(160,75,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel)', "Minecraft browser readiness", "Stage 2 — virtual display"]) {
            if (!html.includes(marker)) throw new Error("Browser graphics milestone missing: " + marker);
          }
          if (html.includes("fallocate -l") || html.includes("dd if=/dev/zero of=/swapfile")) {
            throw new Error("Disk-backed swapfile must remain disabled");
          }
          const worker = fs.readFileSync("_worker.js", "utf8");
          const diskBuild = fs.readFileSync(".github/workflows/build-dynamic-disk.yml", "utf8");
          if (!diskBuild.includes("GITHUB_RUN_ID") ||
              !diskBuild.includes("Cannot find the runtime Cache Storage version to rotate")) {
            throw new Error("Dynamic disk builds must rotate the browser asset cache version on every release");
          }
          const stack = fs.readFileSync("stack.js");
          const sizeMatch = html.match(/const KNOWN_SIZES = \{([\s\S]*?)\n\};/);
          if (!sizeMatch) throw new Error("Runtime asset size manifest was not found");
          const stackSizeMatch = sizeMatch[1].match(/"stack.js":\s*(\d+)/);
          if (!stackSizeMatch || Number(stackSizeMatch[1]) !== stack.length) {
            throw new Error("KNOWN_SIZES stack.js does not match the checked-in bridge bytes");
          }
          const pinMatch = worker.match(/const STATIC_COMMIT =\s*"([0-9a-f]+)"/);
          if (!pinMatch) throw new Error("Worker STATIC_COMMIT pin was not found");
          const { execFileSync } = require("child_process");
          const pinnedStack = execFileSync("git", ["show", pinMatch[1] + ":stack.js"]);
          if (!pinnedStack.equals(stack)) throw new Error("Worker STATIC_COMMIT does not contain the checked-in stack.js");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("No inline scripts found");
          let written = 0;
          for (let i = 0; i < scripts.length; i++) {
            const code = scripts[i][1];
            if (!code.trim()) continue;
            fs.writeFileSync("/tmp/webpc-inline-" + i + ".js", code);
            written++;
          }
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error("Duplicate HTML ids: " + [...new Set(duplicates)].join(", "));
          const refs = new Set([
            ...[...html.matchAll(/\$\(["']([^"']+)["']\)/g)].map(match => match[1]),
            ...[...html.matchAll(/getElementById\(["']([^"']+)["']\)/g)].map(match => match[1])
          ]);
          const missing = [...refs].filter(id => !ids.includes(id));
          if (missing.length) throw new Error("JavaScript references missing DOM ids: " + missing.join(", "));
          console.log("Found", written, "inline scripts;", ids.length, "unique DOM ids;", refs.size, "valid DOM references.");
          NODE
          for script in /tmp/webpc-inline-*.js; do
            node --check "$script"
          done
          cat /tmp/webpc-inline-*.js > /tmp/webpc-all-inline.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 \
            --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' \
            --rule 'no-undef:error' /tmp/webpc-all-inline.js
          node --check xterm-pty/index.mjs
          node --check xterm/xterm.js
          sh -n tools/expand-rootfs-image.sh

      - name: Verify Wrangler configuration
        run: |
          test -f wrangler.toml
          grep -Fx 'main = "_worker.js"' wrangler.toml
          grep -Fx 'name = "webpc"' wrangler.toml
          grep -Fx 'directory = "."' wrangler.toml
          grep -Fx 'run_worker_first = true' wrangler.toml

      - name: Compile the guest display ABI storage
        run: |
          cc -std=c11 -Wall -Wextra -Werror -c qemu-webpc-display/webpc-display-abi.c -o /tmp/webpc-display-abi.o
