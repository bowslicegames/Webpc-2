name: Validate WebPC

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker JavaScript syntax
        run: node --check _worker.js

      - name: Check streaming network bridge syntax and invariants
        run: |
          node --input-type=module --check < stack.js
          node <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("stack.js", "utf8");
          const required = [
            "MAX_RESPONSE_BUFFER_BYTES",
            "serveResponseChunks",
            "pumpResponseBody",
            "respBodyBytes >= MAX_RESPONSE_BUFFER_BYTES",
            "Never report a truncated transfer as clean EOF"
          ];
          for (const marker of required) {
            if (!source.includes(marker)) {
              throw new Error("Streaming bridge invariant missing: " + marker);
            }
          }
          if (source.includes("resp.arrayBuffer()")) {
            throw new Error("Response body must not be fully buffered with arrayBuffer()");
          }
          if (source.includes("appendData(s, req_.body)")) {
            throw new Error("Request body must not be repeatedly concatenated");
          }
          NODE
          node tools/test-network-stream.mjs

      - name: Extract and check browser startup script
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scriptPattern = new RegExp("<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>", "gi");
          const scripts = [...html.matchAll(scriptPattern)];
          if (!scripts.length) throw new Error("No inline startup script found");

          // The application startup script contains the main() call.
          const mainPattern = new RegExp("\\basync function main\\s*\\(");
          const mainCallPattern = new RegExp("\\bmain\\s*\\(\\s*\\)\\s*;");
          const match = scripts.find(m => mainPattern.test(m[1]) && mainCallPattern.test(m[1]));
          if (!match) throw new Error("WebPC startup script not found");

          fs.writeFileSync("/tmp/webpc-main.js", match[1]);
          NODE
          node --check /tmp/webpc-main.js

      - name: Verify Wrangler configuration
        run: |
          test -f wrangler.toml
          grep -Fx 'main = "_worker.js"' wrangler.toml
          grep -Fx 'name = "webpc"' wrangler.toml
          grep -Fx 'directory = "."' wrangler.toml
          grep -Fx 'run_worker_first = true' wrangler.toml
